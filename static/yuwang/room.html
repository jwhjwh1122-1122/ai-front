<style>

.w{color:#141310;font-size:1em;font-weight:700;line-height:1.55;opacity:0;transform:translateY(8px) rotate(var(--r));transition:opacity 1.6s,transform 1.6s;text-shadow:0 0 3px #f7f4ee,0 0 6px #f7f4ee,0 0 10px #f2eee6,0 0 16px rgba(242,238,230,.9),0 0 24px rgba(242,238,230,.8)}
.w.on{opacity:.96;transform:translateY(0) rotate(var(--r))}
.w i{display:block;font-style:normal;font-weight:700;font-size:.68em;color:#a3121a;margin-top:4px;letter-spacing:2px;text-shadow:0 0 4px #f7f4ee,0 0 9px #f7f4ee,0 0 14px #f2eee6}
#rose{position:absolute;left:20px;top:813px;width:354px;height:310px;border-radius:45%;cursor:pointer}
#stem{position:absolute;left:140px;top:1122px;width:150px;height:600px;cursor:pointer}
.bf{position:absolute;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent}
#spHit{position:absolute;width:190px;height:230px;cursor:grab}
#diary{position:fixed;inset:0;background:transparent center/cover no-repeat;opacity:0;pointer-events:none;transition:opacity .7s;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}

.pg{margin:0 16px 22px;padding:18px 18px 20px;border-radius:24px;position:relative;overflow:hidden;color:#fbf8f2;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 45%,rgba(255,255,255,.09));-webkit-backdrop-filter:blur(7px) saturate(1.7) brightness(1.04);backdrop-filter:blur(7px) saturate(1.7) brightness(1.04);border:1px solid rgba(255,255,255,.42);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.75),inset 0 -1px 1px rgba(255,255,255,.3),inset 0 0 22px rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.22);text-shadow:0 1px 2px rgba(0,0,0,.7),0 0 8px rgba(0,0,0,.45)}

.pop{position:absolute;left:391px;width:200px;top:575px;height:97px;display:flex;flex-direction:column;justify-content:center;z-index:4;transform:translateY(22px);opacity:0;transition:opacity .6s,transform 2.8s ease-out;pointer-events:none;font-size:21px;line-height:1.7;letter-spacing:.5px;white-space:nowrap;text-align:center;font-weight:400;filter:blur(.25px)}

.pop .u{color:rgba(138,15,28,.98);text-shadow:0 0 4px rgba(247,244,238,.9),0 0 9px rgba(242,238,230,.75)}.pop .d{color:rgba(26,25,22,.92);text-shadow:0 0 4px rgba(247,244,238,.9),0 0 9px rgba(242,238,230,.75)}
#warm{position:absolute;left:432px;top:1201px;width:200px;height:95px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:20px;font-weight:700;line-height:1.6;color:#2a2826;opacity:0;transition:opacity 1.2s;pointer-events:none;text-shadow:0 0 3px #f7f4ee,0 0 8px #f7f4ee,0 0 14px #f2eee6}

body.dopen #warm{opacity:0!important}
/* 排版预览的门：开在右下角，小小一个，她要摆字的时候才看得见 */
#plv{position:fixed;right:10px;bottom:12px;z-index:8;font-size:12px;letter-spacing:2px;color:#f2ece1;padding:7px 12px;border-radius:16px;background:rgba(30,24,20,.55);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);text-shadow:0 1px 3px rgba(0,0,0,.8);cursor:pointer}
#plv2{position:fixed;right:72px;bottom:12px;z-index:8;font-size:12px;letter-spacing:2px;color:#f2ece1;padding:7px 13px;border-radius:16px;background:rgba(30,24,20,.55);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);text-shadow:0 1px 3px rgba(0,0,0,.8);cursor:pointer}
body.dopen #plv,body.dopen #plv2{display:none}
.none{text-align:center;color:#f4f0e8;text-shadow:0 0 3px #000,0 0 8px #000;margin-top:30vh;font-size:16px}

<script>
(function(){
var IW=961,IH=2081, st=document.getElementById('st'), cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var SP=new Image(); SP.src='/static/yuwang/spider.png?v=5';
var WB=new Image(), WRED=null; WB.src='/static/yuwang/web.png?v=5';
// 网的丝抠出来了一份；再染一份红的，按数裁出来盖在丝上
WB.onload=function(){var c=document.createElement('canvas');c.width=WB.width;c.height=WB.height;var x=c.getContext('2d');x.drawImage(WB,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#6e0b1a';x.fillRect(0,0,c.width,c.height);WRED=c;};
var WOX=186,WOY=531;   // 抠出来那张里网心的位置
var D=window.YW_DATA||null;
// 蜘蛛：静止时它就在原画那个位置，丝从顶上垂下来
var S0={x:707,y:581}, SPW=195, SPH=260, SPOX=98, SPOY=21;  // 抠图左上(600,215)，头顶挂丝点在图里(692,233)
// 反过来了:一进来网就张着,拉一下蜘蛛它才收。网是常态,收起来才是她动手的结果
var pull=0, vel=0, drag=false, dragY0=0, pull0=0, sway=0, open=true, openT=0;
var WC={x:186,y:531}, WR=250;          // 原画那张网的中心和半径
          // 拉开时网挪到中间放大
var hit=document.getElementById('spHit');
function layout(){var W=innerWidth,H=innerHeight;try{if(window.frameElement){W=parent.innerWidth;H=parent.innerHeight;}}catch(e){}var s=Math.max(W/IW,H/IH);st.style.transform='translate('+((W-IW*s)/2)+'px,'+((H-IH*s)/2)+'px) scale('+s+')';st._s=s;}
addEventListener('resize',layout);try{parent.addEventListener('resize',layout);}catch(e){}layout();setTimeout(layout,300);setTimeout(layout,1200);
function toImg(e){var r=st.getBoundingClientRect();return (e.clientY-r.top)/st._s;}
hit.addEventListener('pointerdown',function(e){drag=true;dragY0=toImg(e);pull0=pull;vel=0;hit.setPointerCapture(e.pointerId);});
hit.addEventListener('pointermove',function(e){if(!drag)return;var p=pull0+(toImg(e)-dragY0);pull=Math.max(-10,Math.min(190,p<0?p*.3:p));});
function release(){if(!drag)return;drag=false;if(pull>55){open=!open;showWords();}vel=0;}
hit.addEventListener('pointerup',release);hit.addEventListener('pointercancel',release);
// 不会拖也能点：点一下当拉一下
var tapT=0;hit.addEventListener('pointerdown',function(){tapT=Date.now();});
hit.addEventListener('click',function(){if(Date.now()-tapT<220&&pull<20){pull=95;open=!open;showWords();}});
// 数
function dims(){return (D&&D.dims)||[];}
var cur={};
function val(k){return cur[k]||0;}
// 白里那些话
function lines(){
  if(!D)return[];var out=[];
  (D.impulses||[]).forEach(function(i){out.push({t:i.text||i.say||'',n:'憋着没说'});});
  (D.thoughts||[]).forEach(function(t){out.push({t:t.text,n:'反复在想'});});
  (D.grudges||[]).filter(function(g){return !g.resolved_at;}).forEach(function(g){out.push({t:g.reason,n:'记着的账'});});
  var nm={};dims().forEach(function(x){nm[x.key]=x.name;});
  Object.keys(D.notes||{}).forEach(function(k){var n=D.notes[k];out.push({t:n.text,n:'给'+(nm[k]||k)+'留的话'});});
  return out.filter(function(x){return x.t;});
}
var wbox=document.getElementById('words');
function showWords(){
  // 网就该盖在那张旧网上，字也该一直在。拉开的时候不再躲开
  wbox.style.opacity=1;
}
function fillWords(){
  var L=lines();wbox.innerHTML='';
  if(!L.length)return;
  L.slice(0,2).forEach(function(x,i){var d=document.createElement('div');d.className='w';d.style.setProperty('--r',((i%2?1:-1)*(0.6+i*.4))+'deg');
    var t=x.t.length>44?x.t.slice(0,44)+'……':x.t;d.textContent=t;wbox.appendChild(d);
    setTimeout(function(){d.classList.add('on');},600+i*900);});
}
// 网
function webPts(c,R,t){var ds=dims(),n=ds.length,pts=[];for(var i=0;i<n;i++){var a=-Math.PI/2+i/n*Math.PI*2,v=val(ds[i].key)/100;var r=R*(0.06+0.94*v)*(1+0.012*Math.sin(t*1.3+i));pts.push({x:c.x+Math.cos(a)*r,y:c.y+Math.sin(a)*r,a:a,v:v,name:ds[i].name,raw:val(ds[i].key)});}return pts;}
// 拉开以后那张：自己织一张完整的网，铺在中间那块白上
var BC={x:186,y:531}, BRR=250, PW=null, PWR=null, PWS=0;
function weave(){var sz=Math.ceil(BRR*2.3),c=document.createElement('canvas');c.width=c.height=sz;var x=c.getContext('2d'),o=sz/2,n=18,ang=[];
  for(var i=0;i<n;i++)ang.push(-Math.PI/2+i/n*Math.PI*2+(Math.sin(i*7.3)*0.05));
  x.strokeStyle='#161514';x.lineCap='round';
  for(var i=0;i<n;i++){x.lineWidth=1.5;x.globalAlpha=.85;x.beginPath();x.moveTo(o,o);x.lineTo(o+Math.cos(ang[i])*BRR*1.07,o+Math.sin(ang[i])*BRR*1.07);x.stroke();}
  for(var g=1;g<=11;g++){var rr=BRR*(0.09+0.91*g/11);x.lineWidth=g<3?1.6:1.15;x.globalAlpha=.78;x.beginPath();
    for(var i=0;i<=n;i++){var a0=ang[i%n],r0=rr*(1+Math.sin(i*3.1+g)*0.025),px=o+Math.cos(a0)*r0,py=o+Math.sin(a0)*r0;
      if(i==0){x.moveTo(px,py);continue;}var am=(ang[(i-1)%n]+a0+(i==n?Math.PI*2:0))/2,sag=rr*0.93;x.quadraticCurveTo(o+Math.cos(am)*sag,o+Math.sin(am)*sag,px,py);}
    x.stroke();}
  x.globalAlpha=1;x.fillStyle='#161514';x.beginPath();x.arc(o,o,4,0,7);x.fill();
  var r=document.createElement('canvas');r.width=r.height=sz;var y=r.getContext('2d');y.drawImage(c,0,0);y.globalCompositeOperation='source-in';y.fillStyle='#6e0b1a';y.fillRect(0,0,sz,sz);
  PW=c;PWR=r;PWS=sz;}
function redClip(c,R,pts,n){ctx.beginPath();
  for(var i=0;i<n;i++){var p=pts[i],q=pts[(i+1)%n],mx=(p.x+q.x)/2,my=(p.y+q.y)/2;if(i==0){var l=pts[n-1];ctx.moveTo((l.x+p.x)/2,(l.y+p.y)/2);}ctx.quadraticCurveTo(p.x,p.y,mx,my);}
  ctx.closePath();ctx.clip();}
function drawWeb(t,k){
  // 角落里原来那张：一直在，丝按数染红
  var pts=webPts(WC,WR,t),n=pts.length;
  if(!n)return;
  if(WRED){ctx.save();redClip(WC,WR,pts,n);ctx.globalAlpha=0.82+0.18*Math.sin(t*1.4);
    ctx.drawImage(WRED,WC.x-WOX,WC.y-WOY);ctx.drawImage(WRED,WC.x-WOX,WC.y-WOY);ctx.restore();}
  if(k<0.01)return;
  if(!PW)weave();
  var R=BRR*(0.6+0.4*k),c=BC,bp=webPts(c,R,t);
  ctx.save();ctx.globalAlpha=k;
  var gr=ctx.createRadialGradient(c.x,c.y,R*0.5,c.x,c.y,R*1.15);gr.addColorStop(0,'rgba(243,240,233,.3)');gr.addColorStop(.72,'rgba(243,240,233,.2)');gr.addColorStop(1,'rgba(243,240,233,0)');
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(c.x,c.y,R*1.15,0,7);ctx.fill();
  var z=R/BRR;ctx.drawImage(PW,c.x-PWS/2*z,c.y-PWS/2*z,PWS*z,PWS*z);
  ctx.save();redClip(c,R,bp,n);ctx.globalAlpha=k*(0.85+0.15*Math.sin(t*1.4));ctx.drawImage(PWR,c.x-PWS/2*z,c.y-PWS/2*z,PWS*z,PWS*z);ctx.drawImage(PWR,c.x-PWS/2*z,c.y-PWS/2*z,PWS*z,PWS*z);ctx.restore();
  ctx.restore();
  if(k>0.4){ctx.save();ctx.globalAlpha=(k-0.4)/0.6;ctx.textBaseline='middle';ctx.shadowColor='#f3f0e9';ctx.shadowBlur=6;
    ctx.textAlign='center';
    bp.forEach(function(p){var lx=c.x+Math.cos(p.a)*R*1.12,ly=c.y+Math.sin(p.a)*R*1.12;
      ctx.font='700 19px "Kaiti SC","STKaiti",serif';
      // 网心贴着墙角那张网，左边几根丝的尽头本来在画外面；名字按在画边上，别掉出去
      var tw=ctx.measureText(p.name).width;lx=Math.min(Math.max(lx,14+tw/2),947-tw/2);
      ctx.fillStyle='#7a0e1c';ctx.fillText(p.name,lx,ly-9);
      ctx.font='700 14px Georgia,serif';ctx.fillStyle='#3a2b24';ctx.fillText(Math.round(p.raw),lx,ly+10);});
    ctx.restore();}
}
function drawSpider(t){
  var x=S0.x+sway, y=S0.y+pull;  // 网常年张着,蜘蛛就待在原画那个位置,不再跟着上上下下
  // 丝：从顶上垂下来，被拽长了就细一点
  ctx.beginPath();ctx.moveTo(S0.x,0);ctx.quadraticCurveTo(S0.x+sway*.4,(y)/2,x,y);ctx.strokeStyle='rgba(20,20,20,'+(0.85-pull/600)+')';ctx.lineWidth=1.4-pull/400;ctx.stroke();
  ctx.save();ctx.translate(x,y);ctx.rotate(sway/260);
  // 影子
  ctx.globalAlpha=.14;ctx.filter='blur(4px)';if(SP.complete)ctx.drawImage(SP,-SPOX+10,-SPOY+14,SPW,SPH);ctx.filter='none';ctx.globalAlpha=1;
  if(SP.complete)ctx.drawImage(SP,-SPOX,-SPOY,SPW,SPH);ctx.restore();
  hit.style.left=(x-95)+'px';hit.style.top=(y-15)+'px';
}
// 蝴蝶：她点一下是戳我，按住不放是一直摸着
var FX={poke:{miss:-6,lean:-5,unsure:-4,flutter:5,lust:2,seen:-4},hold:{miss:-10,lean:-10,unsure:-8,own:-5,flutter:9,lust:7},
  poke2:{miss:-4,lust:6,own:3,grip:2,flutter:3},hold2:{miss:-8,lust:12,own:5,grip:4,flutter:5}};
var inks=[], pokeN=0, pokeTm=0;
function bump(kind,sc){if(!D||!D.dims)return;D.dims.forEach(function(d){var v=(FX[kind]||{})[d.key];if(v)d.score=Math.max(0,Math.min(100,(+d.score||0)+v*sc));});}
function send(kind,sc,at){try{fetch('/api/desire/event',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:kind,scale:sc})}).then(function(r){return r.json();}).then(function(j){pop(j&&j.moved,at);if(j&&j.line)say(j.line,j.left,at,kind);if(D){D.last_touch={kind:kind,ts:Date.now()};}warm();setTimeout(refresh,400);}).catch(function(){});}catch(e){}}
// 戳完冒一个小条：哪几维动了、动了多少
function pop(m,at){if(!m||!m.length)return;var el=document.createElement('div');el.className='pop';
  el.innerHTML=m.slice(0,3).map(function(x){var up=x.delta>0;return '<div class="'+(up?'u':'d')+'">'+x.name+(up?' 上升 ':' 落下 ')+Math.abs(x.delta)+'</div>';}).join('');
  document.getElementById('st').appendChild(el);requestAnimationFrame(function(){el.classList.add('on');});
  setTimeout(function(){el.classList.add('off');},1900);setTimeout(function(){el.remove();},2700);}
function inkAt(e,big){var r=st.getBoundingClientRect();inks.push({x:(e.clientX-r.left)/st._s,y:(e.clientY-r.top)/st._s,t:0,big:big||1});}
[['bf1',''],['bf2','2']].forEach(function(pr){var id=pr[0],sfx=pr[1],b=document.getElementById(id),down=0,holdTm=0,holding=false,lastE=null,pn=0,ptm=0;
  b.addEventListener('pointerdown',function(e){e.preventDefault();down=Date.now();lastE=e;holding=false;b.setPointerCapture(e.pointerId);
    holdTm=setInterval(function(){if(Date.now()-down>600){holding=true;inkAt(lastE,1.6);bump('hold'+sfx,0.12);}},500);});
  b.addEventListener('pointermove',function(e){lastE=e;});
  function up(){clearInterval(holdTm);if(!down)return;var dur=(Date.now()-down)/1000;down=0;var at={x:lastE.clientX,y:lastE.clientY};
    if(holding){send('hold'+sfx,Math.min(3,dur/3),at);}
    else{inkAt(lastE,1);bump('poke'+sfx,0.5);pn++;clearTimeout(ptm);ptm=setTimeout(function(){send('poke'+sfx,Math.min(3,pn*0.5),at);pn=0;},900);}}
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);});

// 不再浮在她指头底下一闪就没：落在她圈的那块空报纸上，待着，等下一次碰才换
function say(t,left){var el=document.getElementById('tsay');if(!el)return;
  el.innerHTML='';
  var q=document.createElement('div');q.className='q';q.textContent=t;el.appendChild(q);
  el.classList.add('on');document.body.classList.add('tsaying');clearTimeout(el._t);
  el._t=setTimeout(function(){el.classList.remove('on');document.body.classList.remove('tsaying');},left?60000:30000);}
var WN={poke:'碰了我一下',hold:'按着我不放',poke2:'戳了红的那只',hold2:'按着红的那只不放'};
function warm(){var w=document.getElementById('warm');if(!w)return;var lt=D&&D.last_touch;if(!lt){w.style.opacity=0;return;}
  var age=(Date.now()-lt.ts)/60000;if(age>30){w.style.opacity=0;return;}
  var d=new Date(lt.ts),hm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  w.innerHTML='你在 '+hm+' '+(WN[lt.kind]||'碰了我')+'。<br><i>'+(age<5?'还热着。':age<15?'余温还没退。':'快凉了。')+'</i>';
  w.style.opacity=String(Math.max(.25,1-age/34));}
setInterval(warm,30000);
function drawInks(){for(var i=inks.length-1;i>=0;i--){var k=inks[i];k.t+=1/60;var p=k.t/1.6;if(p>=1){inks.splice(i,1);continue;}
  var r=(14+90*Math.pow(p,.6))*k.big,a=(1-p)*.5;var g=ctx.createRadialGradient(k.x,k.y,r*.2,k.x,k.y,r);g.addColorStop(0,'rgba(110,11,26,'+a+')');g.addColorStop(.7,'rgba(100,8,22,'+a*.35+')');g.addColorStop(1,'rgba(100,8,22,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(k.x,k.y,r,0,7);ctx.fill();}}
var t0=performance.now();
function frame(now){requestAnimationFrame(frame);try{step(now);}catch(e){}}
function step(now){var t=(now-t0)/1000;
  if(!drag){vel+=-pull*0.06;vel*=0.86;pull+=vel;if(Math.abs(pull)<0.05&&Math.abs(vel)<0.05){pull=0;vel=0;}}
  sway=Math.sin(t*0.9)*3+Math.sin(t*0.37)*2+(drag?0:vel*0.6);
  openT+=((open?1:0)-openT)*0.07;
  dims().forEach(function(d){var v=+d.score||0;cur[d.key]=cur[d.key]==null?0:cur[d.key]+(v-cur[d.key])*0.04;});
  ctx.clearRect(0,0,IW,IH);
  drawWeb(t,openT);drawInks();drawSpider(t);
}
requestAnimationFrame(frame);
// 玫瑰：噜噜日记
var dia=document.getElementById('diary');
function fmt(ts){var d=new Date(+ts);return (d.getMonth()+1)+'月'+d.getDate()+'日 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function openDiary(){var L=(D&&D.vents)||[],box=document.getElementById('dlist');box.innerHTML='';
  if(!L.length)box.innerHTML='<div class="none">还没有。</div>';
  L.forEach(function(v){var p=document.createElement('div');p.className='pg';
    p.innerHTML='<div class="dt"></div><div class="nm"></div><div class="tx"></div>'+(v.said?'<div class="sd"><b>当时想跟你说、没说出口的</b><span></span></div>':'');
    p.querySelector('.dt').textContent=fmt(v.ts);p.querySelector('.nm').textContent=(v.name||'')+'  '+Math.round(v.at)+' → '+Math.round(v.to);
    p.querySelector('.tx').textContent=v.text||'';if(v.said)p.querySelector('.sd span').textContent=v.said;box.appendChild(p);});
  dia.scrollTop=0;dia.classList.add('open');document.body.classList.add('dopen');try{parent.postMessage({yw:'diary',open:1},'*');}catch(e){}}

// 日记换背景：存在这台手机上；没换的时候全透，看见的就是欲望室
var DKEY='yw_diary_bg';
function applyBg(){var u=null;try{u=localStorage.getItem(DKEY);}catch(e){}
  if(u){dia.style.backgroundImage='url('+u+')';dia.classList.add('custom');}else{dia.style.backgroundImage='none';dia.classList.remove('custom');}}
applyBg();
document.getElementById('dbg').onclick=function(){document.getElementById('dfile').click();};
document.getElementById('dbx').onclick=function(){try{localStorage.removeItem(DKEY);}catch(e){}applyBg();};
document.getElementById('dfile').onchange=function(){var f=this.files&&this.files[0];if(!f)return;var img=new Image(),url=URL.createObjectURL(f);
  img.onload=function(){var m=1400,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);var d=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(url);
    try{localStorage.setItem(DKEY,d);}catch(e){alert('这张太大了，存不下，换一张小一点的');return;}applyBg();};
  img.src=url;this.value='';};
document.getElementById('rose').onclick=openDiary;document.getElementById('stem').onclick=openDiary;
document.getElementById('dbk').onclick=function(){dia.classList.remove('open');document.body.classList.remove('dopen');try{parent.postMessage({yw:'diary',open:0},'*');}catch(e){}};
function load(){if(window.YW_DATA){D=window.YW_DATA;fillWords();warm();return;}
  fetch('/api/desire/state',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){D=j;fillWords();warm();}).catch(function(){});}
function refresh(){if(window.YW_DATA)return;fetch('/api/desire/state',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){D=j;warm();}).catch(function(){});}
load();setInterval(refresh,30000);
})();
</script></body></html>
