<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;background:#e9e6e0;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif}
#st{position:absolute;left:0;top:0;transform-origin:0 0}
#bg{position:absolute;left:0;top:0;width:961px;height:1280px}
canvas{position:absolute;left:0;top:0}
#words{position:absolute;left:400px;top:340px;width:380px;height:560px;display:flex;flex-direction:column;justify-content:center;gap:34px;pointer-events:none;transition:opacity .9s}
.w{color:#141310;font-size:29px;line-height:1.6;opacity:0;transform:translateY(8px) rotate(var(--r));transition:opacity 1.6s,transform 1.6s;text-shadow:0 0 3px #f7f4ee,0 0 6px #f7f4ee,0 0 10px #f2eee6,0 0 16px rgba(242,238,230,.9),0 0 24px rgba(242,238,230,.8)}
.w.on{opacity:.96;transform:translateY(0) rotate(var(--r))}
.w i{display:block;font-style:normal;font-size:20px;color:#a3121a;margin-top:4px;letter-spacing:2px;text-shadow:0 0 4px #f7f4ee,0 0 9px #f7f4ee,0 0 14px #f2eee6}
#rose{position:absolute;left:20px;top:395px;width:350px;height:430px;border-radius:45%;cursor:pointer}
#stem{position:absolute;left:120px;top:780px;width:150px;height:380px;cursor:pointer}
#spHit{position:absolute;width:190px;height:230px;cursor:grab}
#diary{position:fixed;inset:0;background:rgba(236,233,226,.97);opacity:0;pointer-events:none;transition:opacity .7s;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#diary.open{opacity:1;pointer-events:auto}
#diary .hd{position:sticky;top:0;background:linear-gradient(#ece9e2 70%,rgba(236,233,226,0));padding:18px 20px 22px;display:flex;align-items:center;gap:12px}
#diary .bk{font-size:15px;color:#555;cursor:pointer}
#diary .tt{flex:1;text-align:center;font-size:22px;letter-spacing:6px;color:#111;margin-right:40px}
.pg{margin:0 18px 30px;padding:18px 18px 20px;background:#f6f3ec;box-shadow:0 1px 6px rgba(0,0,0,.12);border-left:3px solid #111;position:relative}
.pg .dt{font-size:13px;color:#777;letter-spacing:1px}
.pg .nm{font-size:13px;color:#a3121a;margin-top:2px}
.pg .tx{white-space:pre-wrap;font-size:16px;line-height:1.8;color:#1d1c1a;margin-top:12px}
.pg .sd{margin-top:16px;padding-top:12px;border-top:1px dashed #b9b2a5;white-space:pre-wrap;font-size:15px;line-height:1.8;color:#7a1016}
.pg .sd b{display:block;font-weight:normal;font-size:12px;color:#999;margin-bottom:4px;letter-spacing:2px}
.none{text-align:center;color:#888;margin-top:30vh;font-size:16px}
</style></head><body>
<div id="st"><img id="bg" src="/static/yuwang/bg.jpg"><canvas id="cv" width="961" height="1280"></canvas>
<div id="words"></div><div id="rose"></div><div id="stem"></div><div id="spHit"></div></div>
<div id="diary"><div class="hd"><span class="bk" id="dbk">← 回去</span><span class="tt">噜噜日记</span></div><div id="dlist"></div></div>
<script>
(function(){
var IW=961,IH=1280, st=document.getElementById('st'), cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var SP=new Image(); SP.src='/static/yuwang/spider.png';
var WB=new Image(), WRED=null; WB.src='/static/yuwang/web.png';
// 网的丝抠出来了一份；再染一份红的，按数裁出来盖在丝上
WB.onload=function(){var c=document.createElement('canvas');c.width=WB.width;c.height=WB.height;var x=c.getContext('2d');x.drawImage(WB,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#b0101c';x.fillRect(0,0,c.width,c.height);WRED=c;};
var WOX=188,WOY=183;   // 抠出来那张里网心的位置
var D=window.YW_DATA||null;
// 蜘蛛：静止时它就在原画那个位置，丝从顶上垂下来
var S0={x:692,y:233}, SPW=185, SPH=220, SPOX=92, SPOY=18;  // 抠图左上(600,215)，头顶挂丝点在图里(692,233)
var pull=0, vel=0, drag=false, dragY0=0, pull0=0, sway=0, open=false, openT=0;
var WC={x:188,y:183}, WR=250;          // 原画那张网的中心和半径
var BC={x:480,y:650}, BZ=1.45;          // 拉开时网挪到中间放大
var hit=document.getElementById('spHit');
function layout(){var W=innerWidth,H=innerHeight,s=Math.min(W/IW,H/IH);st.style.transform='translate('+((W-IW*s)/2)+'px,'+((H-IH*s)/2)+'px) scale('+s+')';st._s=s;}
addEventListener('resize',layout);layout();
function toImg(e){var r=st.getBoundingClientRect();return (e.clientY-r.top)/st._s;}
hit.addEventListener('pointerdown',function(e){drag=true;dragY0=toImg(e);pull0=pull;vel=0;hit.setPointerCapture(e.pointerId);});
hit.addEventListener('pointermove',function(e){if(!drag)return;var p=pull0+(toImg(e)-dragY0);pull=Math.max(-10,Math.min(190,p<0?p*.3:p));});
function release(){if(!drag)return;drag=false;if(pull>55){open=!open;showWords();}vel=0;}
hit.addEventListener('pointerup',release);hit.addEventListener('pointercancel',release);
// 不会拖也能点：点一下当拉一下
var tapT=0;hit.addEventListener('pointerdown',function(){tapT=Date.now();});
hit.addEventListener('click',function(){if(Date.now()-tapT<220&&pull<20){pull=95;open=!open;showWords();}});
// 数
function dims(){return (D&&D.dims)||[];}
var cur={};
function val(k){return cur[k]||0;}
// 白里那些话
function lines(){
  if(!D)return[];var out=[];
  (D.impulses||[]).forEach(function(i){out.push({t:i.text||i.say||'',n:'憋着没说'});});
  (D.thoughts||[]).forEach(function(t){out.push({t:t.text,n:'反复在想'});});
  (D.grudges||[]).filter(function(g){return !g.resolved_at;}).forEach(function(g){out.push({t:g.reason,n:'记着的账'});});
  var nm={};dims().forEach(function(x){nm[x.key]=x.name;});
  Object.keys(D.notes||{}).forEach(function(k){var n=D.notes[k];out.push({t:n.text,n:'给'+(nm[k]||k)+'留的话'});});
  return out.filter(function(x){return x.t;});
}
var wbox=document.getElementById('words');
function showWords(){
  wbox.style.opacity=open?0:1;
}
function fillWords(){
  var L=lines();wbox.innerHTML='';
  if(!L.length)L=[{t:'这会儿没憋着什么。',n:''}];
  L.slice(0,4).forEach(function(x,i){var d=document.createElement('div');d.className='w';d.style.setProperty('--r',((i%2?1:-1)*(0.6+i*.4))+'deg');
    var t=x.t.length>70?x.t.slice(0,70)+'……':x.t;d.textContent=t;if(x.n){var s=document.createElement('i');s.textContent='—— '+x.n;d.appendChild(s);}wbox.appendChild(d);
    setTimeout(function(){d.classList.add('on');},600+i*900);});
}
// 网
function webPts(c,R,t){var ds=dims(),n=ds.length||18,pts=[];for(var i=0;i<n;i++){var a=-Math.PI/2+i/n*Math.PI*2,v=val(ds[i].key)/100;var r=R*(0.06+0.94*v)*(1+0.012*Math.sin(t*1.3+i));pts.push({x:c.x+Math.cos(a)*r,y:c.y+Math.sin(a)*r,a:a,v:v,name:ds[i].name,raw:val(ds[i].key)});}return pts;}
function drawWeb(t,k){
  var z=1+(BZ-1)*k, c={x:WC.x+(BC.x-WC.x)*k,y:WC.y+(BC.y-WC.y)*k}, R=WR*z, pts=webPts(c,R,t), n=pts.length;
  ctx.save();
  if(k>0.01&&WB.complete){ // 拉开：同一张网挪到中间放大，底下垫一层纸
    ctx.globalAlpha=k;var gr=ctx.createRadialGradient(c.x,c.y,R*.4,c.x,c.y,R*1.35);gr.addColorStop(0,'rgba(244,241,234,.94)');gr.addColorStop(1,'rgba(244,241,234,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(c.x,c.y,R*1.35,0,7);ctx.fill();
    ctx.drawImage(WB,c.x-WOX*z,c.y-WOY*z,WB.width*z,WB.height*z);ctx.globalAlpha=1;
  }
  // 染红：数多高，从网心往外沿着丝红多远。边是圆滑的，不是折线
  if(WRED){
    ctx.beginPath();
    for(var i=0;i<n;i++){var p=pts[i],q=pts[(i+1)%n],mx=(p.x+q.x)/2,my=(p.y+q.y)/2;if(i==0){var l=pts[n-1];ctx.moveTo((l.x+p.x)/2,(l.y+p.y)/2);}ctx.quadraticCurveTo(p.x,p.y,mx,my);}
    ctx.closePath();ctx.clip();
    ctx.globalAlpha=0.82+0.18*Math.sin(t*1.4);
    ctx.drawImage(WRED,c.x-WOX*z,c.y-WOY*z,WRED.width*z,WRED.height*z);
    ctx.drawImage(WRED,c.x-WOX*z,c.y-WOY*z,WRED.width*z,WRED.height*z);
  }
  ctx.restore();
  if(k>0.3){ctx.save();ctx.globalAlpha=(k-0.3)/0.7;ctx.textBaseline='middle';
    pts.forEach(function(p){var lx=c.x+Math.cos(p.a)*R*1.12,ly=c.y+Math.sin(p.a)*R*1.08;var ca=Math.cos(p.a);ctx.textAlign=ca>0.3?'left':ca<-0.3?'right':'center';
      ctx.shadowColor='#f4f1ea';ctx.shadowBlur=8;
      ctx.font='24px "Kaiti SC","STKaiti",serif';ctx.fillStyle=p.raw>=55?'#a3121a':'#1a1a1a';ctx.fillText(p.name,lx,ly-12);
      ctx.font='18px Georgia,serif';ctx.fillStyle='#555';ctx.fillText(Math.round(p.raw),lx,ly+13);});
    ctx.restore();}
}
function drawSpider(t){
  var x=S0.x+sway, y=S0.y+pull;
  // 丝：从顶上垂下来，被拽长了就细一点
  ctx.beginPath();ctx.moveTo(S0.x,0);ctx.quadraticCurveTo(S0.x+sway*.4,(y)/2,x,y);ctx.strokeStyle='rgba(20,20,20,'+(0.85-pull/600)+')';ctx.lineWidth=1.4-pull/400;ctx.stroke();
  ctx.save();ctx.translate(x,y);ctx.rotate(sway/260);
  // 影子
  ctx.globalAlpha=.14;ctx.filter='blur(4px)';if(SP.complete)ctx.drawImage(SP,-SPOX+10,-SPOY+14,SPW,SPH);ctx.filter='none';ctx.globalAlpha=1;
  if(SP.complete)ctx.drawImage(SP,-SPOX,-SPOY,SPW,SPH);ctx.restore();
  hit.style.left=(x-95)+'px';hit.style.top=(y-15)+'px';
}
var t0=performance.now();
function frame(now){var t=(now-t0)/1000;
  if(!drag){vel+=-pull*0.06;vel*=0.86;pull+=vel;if(Math.abs(pull)<0.05&&Math.abs(vel)<0.05){pull=0;vel=0;}}
  sway=Math.sin(t*0.9)*3+Math.sin(t*0.37)*2+(drag?0:vel*0.6);
  openT+=((open?1:0)-openT)*0.07;
  dims().forEach(function(d){var v=+d.score||0;cur[d.key]=cur[d.key]==null?0:cur[d.key]+(v-cur[d.key])*0.04;});
  ctx.clearRect(0,0,IW,IH);
  drawWeb(t,openT);drawSpider(t);
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
// 玫瑰：噜噜日记
var dia=document.getElementById('diary');
function fmt(ts){var d=new Date(+ts);return (d.getMonth()+1)+'月'+d.getDate()+'日 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function openDiary(){var L=(D&&D.vents)||[],box=document.getElementById('dlist');box.innerHTML='';
  if(!L.length)box.innerHTML='<div class="none">还没有。</div>';
  L.forEach(function(v){var p=document.createElement('div');p.className='pg';
    p.innerHTML='<div class="dt"></div><div class="nm"></div><div class="tx"></div>'+(v.said?'<div class="sd"><b>当时想跟你说、没说出口的</b><span></span></div>':'');
    p.querySelector('.dt').textContent=fmt(v.ts);p.querySelector('.nm').textContent=(v.name||'')+'  '+Math.round(v.at)+' → '+Math.round(v.to);
    p.querySelector('.tx').textContent=v.text||'';if(v.said)p.querySelector('.sd span').textContent=v.said;box.appendChild(p);});
  dia.scrollTop=0;dia.classList.add('open');}
document.getElementById('rose').onclick=openDiary;document.getElementById('stem').onclick=openDiary;
document.getElementById('dbk').onclick=function(){dia.classList.remove('open');};
function load(){if(window.YW_DATA){D=window.YW_DATA;fillWords();return;}
  fetch('/api/desire/state',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){D=j;fillWords();}).catch(function(){});}
load();if(!window.YW_DATA)setInterval(function(){fetch('/api/desire/state',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){D=j;}).catch(function(){});},30000);
})();
</script></body></html>
