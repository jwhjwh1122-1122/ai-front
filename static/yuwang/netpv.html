<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>网往哪儿张</title>
<style>
html,body{margin:0;height:100%;background:#15130f;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;font-family:-apple-system,"PingFang SC",sans-serif;color:#eee}
#wrap{position:fixed;inset:0;overflow:hidden}
#st{position:absolute;left:0;top:0;transform-origin:0 0;width:961px;height:2081px}
#bg{position:absolute;left:0;top:0;width:961px;height:2081px}
canvas{position:absolute;left:0;top:0}
#hint{position:fixed;left:0;right:0;top:0;padding:8px 12px;background:rgba(14,12,10,.86);font-size:12.5px;color:#cfc4b2;z-index:9}
#bar{position:fixed;left:0;right:0;bottom:0;padding:9px 12px 16px;background:rgba(14,12,10,.93);border-top:1px solid #3a342c;font-size:13px;z-index:9}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.btn{padding:7px 11px;border-radius:13px;background:#2b2621;border:1px solid #574e43;color:#efe7da;font-size:13px;white-space:nowrap}
.btn.on{background:#8a0f1c;border-color:#d04050;color:#fff}
.sl{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:4px}
.sl span{width:52px;color:#a89c8a;font-size:12px}
.sl input{flex:1}
#out{font-family:Menlo,monospace;font-size:11.5px;color:#c9bfae;line-height:1.6}
</style></head><body>
<div id="wrap"><div id="st"><img id="bg" src="/static/yuwang/bg.jpg?v=4"><canvas id="cv" width="961" height="2081"></canvas></div></div>
<div id="hint"><span class="btn" style="padding:4px 9px;font-size:12px;margin-right:8px" onclick="location.href='/static/yuwang/room.html?v='+Date.now()">← 回欲望室</span>拉开的那张网往哪儿张 · 调好了截给凛</div>
<div id="bar">
<div class="sl"><span>左右</span><input type="range" id="sx" min="0" max="961" value="186"></div>
<div class="sl"><span>上下</span><input type="range" id="sy" min="0" max="1400" value="531"></div>
<div class="sl"><span>大小</span><input type="range" id="sr" min="100" max="520" value="330"></div>
<div class="sl"><span>白光</span><input type="range" id="sg" min="0" max="200" value="100"></div>
<div class="row">
<span class="btn on" id="bFit">盖在原网上</span>
<span class="btn" id="bMid">原来那样(中间)</span>
<span class="btn" id="bOld">原网红丝</span>
<span class="btn" id="bOpen">张开/收起</span>
</div>
<div id="out"></div>
</div>
<script>
(function(){
var IW=961,IH=2081,st=document.getElementById('st'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var WB=new Image(),WRED=null;WB.src='/static/yuwang/web.png?v=5';
WB.onload=function(){var c=document.createElement('canvas');c.width=WB.width;c.height=WB.height;var x=c.getContext('2d');x.drawImage(WB,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#6e0b1a';x.fillRect(0,0,c.width,c.height);WRED=c;};
var WOX=186,WOY=531,WC={x:186,y:531},WR=250;
var BC={x:186,y:531},BRR=330,GLOW=1,showOld=true,open=true,openT=1;
var D=null,cur={};
function dims(){return (D&&D.dims)||[];}
function val(k){return cur[k]||0;}
function layout(){var W=innerWidth,H=innerHeight,s=Math.min(W/IW,H/IH);
 st.style.transform='translate('+((W-IW*s)/2)+'px,'+((H-IH*s)/2)+'px) scale('+s+')';st._s=s;}
addEventListener('resize',layout);layout();
function webPts(c,R,t){var ds=dims(),n=ds.length,pts=[];for(var i=0;i<n;i++){var a=-Math.PI/2+i/n*Math.PI*2,v=val(ds[i].key)/100;
 var r=R*(0.06+0.94*v)*(1+0.012*Math.sin(t*1.3+i));pts.push({x:c.x+Math.cos(a)*r,y:c.y+Math.sin(a)*r,a:a,name:ds[i].name,raw:val(ds[i].key)});}return pts;}
var BASE=360,PW=null,PWR=null,PWS=0;
function weave(){var sz=Math.ceil(BASE*2.3),c=document.createElement('canvas');c.width=c.height=sz;var x=c.getContext('2d'),o=sz/2,n=18,ang=[];
 for(var i=0;i<n;i++)ang.push(-Math.PI/2+i/n*Math.PI*2+(Math.sin(i*7.3)*0.05));
 x.strokeStyle='#161514';x.lineCap='round';
 for(var i=0;i<n;i++){x.lineWidth=1.5;x.globalAlpha=.85;x.beginPath();x.moveTo(o,o);x.lineTo(o+Math.cos(ang[i])*BASE*1.07,o+Math.sin(ang[i])*BASE*1.07);x.stroke();}
 for(var g=1;g<=11;g++){var rr=BASE*(0.09+0.91*g/11);x.lineWidth=g<3?1.6:1.15;x.globalAlpha=.78;x.beginPath();
  for(var i=0;i<=n;i++){var a0=ang[i%n],r0=rr*(1+Math.sin(i*3.1+g)*0.025),px=o+Math.cos(a0)*r0,py=o+Math.sin(a0)*r0;
   if(i==0){x.moveTo(px,py);continue;}var am=(ang[(i-1)%n]+a0+(i==n?Math.PI*2:0))/2,sag=rr*0.93;x.quadraticCurveTo(o+Math.cos(am)*sag,o+Math.sin(am)*sag,px,py);}
  x.stroke();}
 x.globalAlpha=1;x.fillStyle='#161514';x.beginPath();x.arc(o,o,4,0,7);x.fill();
 var r=document.createElement('canvas');r.width=r.height=sz;var y=r.getContext('2d');y.drawImage(c,0,0);y.globalCompositeOperation='source-in';y.fillStyle='#6e0b1a';y.fillRect(0,0,sz,sz);
 PW=c;PWR=r;PWS=sz;}
function redClip(pts,n){ctx.beginPath();
 for(var i=0;i<n;i++){var p=pts[i],q=pts[(i+1)%n],mx=(p.x+q.x)/2,my=(p.y+q.y)/2;if(i==0){var l=pts[n-1];ctx.moveTo((l.x+p.x)/2,(l.y+p.y)/2);}ctx.quadraticCurveTo(p.x,p.y,mx,my);}
 ctx.closePath();ctx.clip();}
function draw(t){
 ctx.clearRect(0,0,IW,IH);
 var n=dims().length;if(!n)return;
 if(showOld&&WRED){var op=webPts(WC,WR,t);ctx.save();redClip(op,n);ctx.globalAlpha=0.82+0.18*Math.sin(t*1.4);
  ctx.drawImage(WRED,WC.x-WOX,WC.y-WOY);ctx.drawImage(WRED,WC.x-WOX,WC.y-WOY);ctx.restore();}
 var k=openT;if(k<0.01)return;
 if(!PW)weave();
 var R=BRR*(0.6+0.4*k),c=BC,bp=webPts(c,R,t);
 ctx.save();ctx.globalAlpha=k;
 if(GLOW>0.01){var gr=ctx.createRadialGradient(c.x,c.y,R*0.9,c.x,c.y,R*1.75);
  gr.addColorStop(0,'rgba(243,240,233,'+(.97*GLOW)+')');gr.addColorStop(.7,'rgba(243,240,233,'+(.85*GLOW)+')');gr.addColorStop(1,'rgba(243,240,233,0)');
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(c.x,c.y,R*1.75,0,7);ctx.fill();}
 var z=R/BASE;ctx.drawImage(PW,c.x-PWS/2*z,c.y-PWS/2*z,PWS*z,PWS*z);
 ctx.save();redClip(bp,n);ctx.globalAlpha=k*(0.85+0.15*Math.sin(t*1.4));
 ctx.drawImage(PWR,c.x-PWS/2*z,c.y-PWS/2*z,PWS*z,PWS*z);ctx.drawImage(PWR,c.x-PWS/2*z,c.y-PWS/2*z,PWS*z,PWS*z);ctx.restore();
 ctx.restore();
 if(k>0.4){ctx.save();ctx.globalAlpha=(k-0.4)/0.6;ctx.textBaseline='middle';ctx.shadowColor='#f3f0e9';ctx.shadowBlur=6;
  bp.forEach(function(p){var lx=c.x+Math.cos(p.a)*R*1.2,ly=c.y+Math.sin(p.a)*R*1.16,ca=Math.cos(p.a);
   lx=Math.max(34,Math.min(927,lx));ly=Math.max(26,Math.min(2055,ly));
   ctx.textAlign=lx<40?'left':lx>921?'right':(ca>0.35?'left':ca<-0.35?'right':'center');
   ctx.font='19px "Kaiti SC","STKaiti",serif';ctx.fillStyle=p.raw>=55?'#7a0e1c':'#1a1a1a';ctx.fillText(p.name,lx,ly-9);
   ctx.font='14px Georgia,serif';ctx.fillStyle='#6a6660';ctx.fillText(Math.round(p.raw),lx,ly+10);});
  ctx.restore();}
}
function out(){document.getElementById('out').textContent='网心 x:'+BC.x+'  y:'+BC.y+'   半径:'+BRR+'   白光:'+Math.round(GLOW*100)+'%   原网红丝:'+(showOld?'开':'关');}
function bindSl(id,fn){var e=document.getElementById(id);e.oninput=function(){fn(+e.value);out();};}
bindSl('sx',function(v){BC.x=v;});bindSl('sy',function(v){BC.y=v;});
bindSl('sr',function(v){BRR=v;});bindSl('sg',function(v){GLOW=v/100;});
function setAll(x,y,r,g){BC.x=x;BC.y=y;BRR=r;GLOW=g;
 document.getElementById('sx').value=x;document.getElementById('sy').value=y;
 document.getElementById('sr').value=r;document.getElementById('sg').value=Math.round(g*100);out();}
document.getElementById('bFit').onclick=function(){setAll(186,531,330,1);};
document.getElementById('bMid').onclick=function(){setAll(594,911,170,1);};
document.getElementById('bOld').onclick=function(){showOld=!showOld;this.classList.toggle('on',showOld);out();};
document.getElementById('bOpen').onclick=function(){open=!open;};
var t0=performance.now();
function frame(now){requestAnimationFrame(frame);var t=(now-t0)/1000;
 openT+=((open?1:0)-openT)*0.07;
 dims().forEach(function(d){var v=+d.score||0;cur[d.key]=cur[d.key]==null?0:cur[d.key]+(v-cur[d.key])*0.06;});
 try{draw(t);}catch(e){}}
fetch('/api/desire/state',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){D=j;
 dims().forEach(function(d){cur[d.key]=0;});}).catch(function(){});
document.getElementById('bOld').classList.add('on');out();requestAnimationFrame(frame);
})();
</script></body></html>
