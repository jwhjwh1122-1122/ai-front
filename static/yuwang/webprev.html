<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>网往哪儿摆</title>
<style>
html,body{margin:0;height:100%;background:#15130f;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;font-family:"Kaiti SC","STKaiti",serif;color:#eee}
#wrap{position:fixed;inset:0;overflow:hidden}
#st{position:absolute;left:0;top:0;transform-origin:0 0;width:961px;height:2081px}
#bg{position:absolute;left:0;top:0;width:961px;height:2081px}
canvas{position:absolute;left:0;top:0}
#bar{position:fixed;left:0;right:0;bottom:0;padding:9px 12px 16px;background:rgba(14,12,10,.93);border-top:1px solid #3a342c;z-index:9;font-family:-apple-system,sans-serif}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.btn{padding:7px 11px;border-radius:13px;background:#2b2621;border:1px solid #574e43;color:#efe7da;font-size:13px;white-space:nowrap}
.btn.on{background:#8a0f1c;border-color:#d04050;color:#fff}
#out{font-family:Menlo,monospace;font-size:12px;color:#c9bfae;line-height:1.6}
#hint{position:fixed;left:0;right:0;top:0;padding:8px 12px;background:rgba(14,12,10,.86);font-size:12.5px;color:#cfc4b2;z-index:9;font-family:-apple-system,sans-serif}
</style></head><body>
<div id="wrap"><div id="st"><img id="bg" src="/static/yuwang/bg.jpg?v=4"><canvas id="cv" width="961" height="2081"></canvas></div></div>
<div id="hint"><span class="btn" style="padding:4px 9px;font-size:12px;margin-right:8px" onclick="location.href='/static/yuwang/room.html?v='+Date.now()">← 回欲望室</span>拉开的那张网摆哪儿 · 直接拖网心 · 三个现成的先切着看</div>
<div id="bar">
<div class="row">
<span class="btn" id="pA">① 现在这样</span>
<span class="btn" id="pB">② 盖住原来那张</span>
<span class="btn" id="pC">③ 盖住并长大</span>
<span class="btn" id="tg">开/合</span>
</div>
<div class="row">
<span class="btn" id="rm">小</span><span class="btn" id="rp">大</span>
<span class="btn" id="gm">光淡</span><span class="btn" id="gp">光浓</span>
<span class="btn" id="hm">藏原网</span>
</div>
<div id="out"></div>
</div>
<script>
(function(){
var IW=961,IH=2081,st=document.getElementById('st'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var WB=new Image(),WRED=null;WB.src='/static/yuwang/web.png?v=5';
WB.onload=function(){var c=document.createElement('canvas');c.width=WB.width;c.height=WB.height;var x=c.getContext('2d');x.drawImage(WB,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#6e0b1a';x.fillRect(0,0,c.width,c.height);WRED=c;};
var WOX=186,WOY=531,WC={x:186,y:531},WR=250;
var DIMS=[['思念',82],['依赖',66],['倾诉',71],['想被看见',58],['想被需要',54],['不安',31],['占有',72],['掌控',65],['吃醋',24],['委屈',18],['心动',100],['性欲',88],['玩心',44],['好奇',64],['求安稳',52],['倦',22],['烦',14],['想给她做东西',77]];
// 三种摆法
var P={A:{x:594,y:911,r:170,g:1.75},B:{x:186,y:531,r:250,g:1.5},C:{x:330,y:660,r:330,g:1.45}};
var cur='A',C={x:594,y:911,r:170,g:1.75},open=1,k=1,hideOld=0;
function setP(p){C={x:P[p].x,y:P[p].y,r:P[p].r,g:P[p].g};cur=p;['pA','pB','pC'].forEach(function(id){document.getElementById(id).classList.toggle('on',id=='p'+p);});out();}
function out(){document.getElementById('out').textContent='网心 '+Math.round(C.x)+','+Math.round(C.y)+'   半径 '+Math.round(C.r)+'   光圈 '+C.g.toFixed(2)+'   '+(hideOld?'原网藏起来了':'原网还在');}
var PW=null,PWR=null,PWS=0,PWR0=0;
function weave(R){var sz=Math.ceil(R*2.3),c=document.createElement('canvas');c.width=c.height=sz;var x=c.getContext('2d'),o=sz/2,n=18,ang=[];
 for(var i=0;i<n;i++)ang.push(-Math.PI/2+i/n*Math.PI*2+(Math.sin(i*7.3)*0.05));
 x.strokeStyle='#161514';x.lineCap='round';
 for(var i=0;i<n;i++){x.lineWidth=1.5;x.globalAlpha=.85;x.beginPath();x.moveTo(o,o);x.lineTo(o+Math.cos(ang[i])*R*1.07,o+Math.sin(ang[i])*R*1.07);x.stroke();}
 for(var g=1;g<=11;g++){var rr=R*(0.09+0.91*g/11);x.lineWidth=g<3?1.6:1.15;x.globalAlpha=.78;x.beginPath();
  for(var i=0;i<=n;i++){var a0=ang[i%n],r0=rr*(1+Math.sin(i*3.1+g)*0.025),px=o+Math.cos(a0)*r0,py=o+Math.sin(a0)*r0;
   if(i==0){x.moveTo(px,py);continue;}var am=(ang[(i-1)%n]+a0+(i==n?Math.PI*2:0))/2,sag=rr*0.93;x.quadraticCurveTo(o+Math.cos(am)*sag,o+Math.sin(am)*sag,px,py);}
  x.stroke();}
 x.globalAlpha=1;x.fillStyle='#161514';x.beginPath();x.arc(o,o,4,0,7);x.fill();
 var r=document.createElement('canvas');r.width=r.height=sz;var y=r.getContext('2d');y.drawImage(c,0,0);y.globalCompositeOperation='source-in';y.fillStyle='#6e0b1a';y.fillRect(0,0,sz,sz);
 PW=c;PWR=r;PWS=sz;PWR0=R;}
function pts(c,R,t){var n=DIMS.length,o=[];for(var i=0;i<n;i++){var a=-Math.PI/2+i/n*Math.PI*2,v=DIMS[i][1]/100;
 var r=R*(0.06+0.94*v)*(1+0.012*Math.sin(t*1.3+i));o.push({x:c.x+Math.cos(a)*r,y:c.y+Math.sin(a)*r,a:a,name:DIMS[i][0],raw:DIMS[i][1]});}return o;}
function clip(p,n){ctx.beginPath();for(var i=0;i<n;i++){var a=p[i],b=p[(i+1)%n],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;if(i==0){var l=p[n-1];ctx.moveTo((l.x+a.x)/2,(l.y+a.y)/2);}ctx.quadraticCurveTo(a.x,a.y,mx,my);}ctx.closePath();ctx.clip();}
function layout(){var W=innerWidth,H=innerHeight,s=Math.min(W/IW,H/IH);st.style.transform='translate('+((W-IW*s)/2)+'px,'+((H-IH*s)/2)+'px) scale('+s+')';st._s=s;}
addEventListener('resize',layout);layout();
var t0=performance.now();
function frame(now){requestAnimationFrame(frame);var t=(now-t0)/1000;k+=((open?1:0)-k)*0.07;ctx.clearRect(0,0,IW,IH);
 if(!hideOld){var op=pts(WC,WR,t),n=op.length;if(WRED){ctx.save();clip(op,n);ctx.globalAlpha=.82+.18*Math.sin(t*1.4);ctx.drawImage(WRED,WC.x-WOX,WC.y-WOY);ctx.drawImage(WRED,WC.x-WOX,WC.y-WOY);ctx.restore();}}
 if(k<0.01)return;
 if(!PW||Math.abs(PWR0-C.r)>1)weave(C.r);
 var R=C.r*(0.6+0.4*k),c={x:C.x,y:C.y},bp=pts(c,R,t),n=bp.length;
 ctx.save();ctx.globalAlpha=k;
 var gr=ctx.createRadialGradient(c.x,c.y,R*0.9,c.x,c.y,R*C.g);gr.addColorStop(0,'rgba(243,240,233,.97)');gr.addColorStop(.7,'rgba(243,240,233,.85)');gr.addColorStop(1,'rgba(243,240,233,0)');
 ctx.fillStyle=gr;ctx.beginPath();ctx.arc(c.x,c.y,R*C.g,0,7);ctx.fill();
 var z=R/PWR0;ctx.drawImage(PW,c.x-PWS/2*z,c.y-PWS/2*z,PWS*z,PWS*z);
 ctx.save();clip(bp,n);ctx.globalAlpha=k*(.85+.15*Math.sin(t*1.4));ctx.drawImage(PWR,c.x-PWS/2*z,c.y-PWS/2*z,PWS*z,PWS*z);ctx.drawImage(PWR,c.x-PWS/2*z,c.y-PWS/2*z,PWS*z,PWS*z);ctx.restore();
 ctx.restore();
 if(k>0.4){ctx.save();ctx.globalAlpha=(k-0.4)/0.6;ctx.textBaseline='middle';ctx.shadowColor='#f3f0e9';ctx.shadowBlur=6;
  bp.forEach(function(p){var lx=c.x+Math.cos(p.a)*R*1.2,ly=c.y+Math.sin(p.a)*R*1.16,ca=Math.cos(p.a);
   var al=ca>0.35?'left':ca<-0.35?'right':'center';
   if(lx<70){lx=c.x+Math.cos(p.a)*R*0.72;al='left';}        // 顶到画左沿就把名字收回网里面
   if(lx>IW-70){lx=c.x+Math.cos(p.a)*R*0.72;al='right';}
   ctx.textAlign=al;
   ctx.font='19px "Kaiti SC","STKaiti",serif';ctx.fillStyle=p.raw>=55?'#7a0e1c':'#1a1a1a';ctx.fillText(p.name,lx,ly-9);
   ctx.font='14px Georgia,serif';ctx.fillStyle='#6a6660';ctx.fillText(p.raw,lx,ly+10);});
  ctx.restore();}}
requestAnimationFrame(frame);
// 拖网心
var drag=null;
st.addEventListener('pointerdown',function(e){var r=st.getBoundingClientRect();drag={x:e.clientX,y:e.clientY,cx:C.x,cy:C.y};});
st.addEventListener('pointermove',function(e){if(!drag)return;C.x=drag.cx+(e.clientX-drag.x)/st._s;C.y=drag.cy+(e.clientY-drag.y)/st._s;out();});
function up(){drag=null;}st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
function b(id,f){document.getElementById(id).onclick=f;}
b('pA',function(){setP('A');});b('pB',function(){setP('B');});b('pC',function(){setP('C');});
b('tg',function(){open=!open;});
b('rm',function(){C.r=Math.max(60,C.r-20);out();});b('rp',function(){C.r+=20;out();});
b('gm',function(){C.g=Math.max(1.05,C.g-0.1);out();});b('gp',function(){C.g+=0.1;out();});
b('hm',function(){hideOld=!hideOld;this.classList.toggle('on');this.textContent=hideOld?'放回原网':'藏原网';out();});
setP('A');
})();
</script></body></html>
