<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>欲望室排版预览</title>
<style>
html,body{margin:0;height:100%;background:#15130f;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;font-family:"Kaiti SC","STKaiti","KaiTi",serif;color:#eee}
#wrap{position:fixed;inset:0;overflow:hidden}
#st{position:absolute;left:0;top:0;transform-origin:0 0;width:961px;height:2081px}
#bg{position:absolute;left:0;top:0;width:961px;height:2081px}
.zone{position:absolute;border:2px dashed rgba(255,80,80,.75);border-radius:10px;pointer-events:none;display:none}
body.zones .zone{display:block}
.zone b{position:absolute;left:4px;top:-26px;font-size:16px;color:#ff5a5a;font-weight:400}
.box{position:absolute;box-sizing:border-box;cursor:grab;outline:1px dashed rgba(0,120,255,0);text-align:center;display:flex;flex-direction:column;justify-content:center}
body.edit .box{outline:1px dashed rgba(0,120,255,.65);background:rgba(0,120,255,.05)}
.box.sel{outline:2px solid #1e90ff!important}
#warm{color:#2a2826;font-weight:700;line-height:1.6;text-shadow:0 0 3px #f7f4ee,0 0 8px #f7f4ee,0 0 14px #f2eee6}
#warm i{font-style:normal;color:#8a0f1c;font-size:.9em}
#tsay .tag{display:block;font-weight:700;color:#8a0f1c;letter-spacing:3px;margin-bottom:8px;font-size:.66em;text-shadow:0 0 4px #f7f4ee,0 0 9px #f7f4ee}
#tsay .q{font-weight:700;line-height:1.5;color:#141310;letter-spacing:1px;text-shadow:0 0 3px #f7f4ee,0 0 6px #f7f4ee,0 0 11px #f2eee6,0 0 18px rgba(242,238,230,.95),0 0 28px rgba(242,238,230,.85)}
#pop{filter:blur(.25px);line-height:1.7;letter-spacing:.5px;opacity:.62;font-weight:400}
#pop .u{color:rgba(138,15,28,.98)}#pop .d{color:rgba(26,25,22,.92)}
#words .w{color:#141310;font-weight:700;line-height:1.55;opacity:.96;margin-bottom:22px;text-align:center;text-shadow:0 0 3px #f7f4ee,0 0 6px #f7f4ee,0 0 10px #f2eee6,0 0 16px rgba(242,238,230,.9)}
#words .w i{display:block;font-style:normal;font-weight:700;font-size:.68em;color:#a3121a;margin-top:4px;letter-spacing:2px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px 16px;background:rgba(14,12,10,.92);border-top:1px solid #3a342c;font-size:13px;z-index:9;font-family:-apple-system,sans-serif}
#bar .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.btn{padding:7px 11px;border-radius:13px;background:#2b2621;border:1px solid #574e43;color:#efe7da;font-size:13px;white-space:nowrap}
.btn.on{background:#8a0f1c;border-color:#d04050;color:#fff}
#out{font-family:Menlo,monospace;font-size:11.5px;color:#c9bfae;line-height:1.6;white-space:pre-wrap;word-break:break-all;max-height:84px;overflow:auto}
#hint{position:fixed;left:0;right:0;top:0;padding:8px 12px;background:rgba(14,12,10,.86);font-size:12.5px;color:#cfc4b2;z-index:9;font-family:-apple-system,sans-serif}
</style></head><body class="edit">
<div id="wrap"><div id="st"><img id="bg" src="/static/yuwang/bg.jpg?v=4">
<div class="zone" style="left:615px;top:1054px;width:283px;height:257px"><b>蓝蝴蝶（别压）</b></div>
<div class="zone" style="left:507px;top:1439px;width:212px;height:179px"><b>红蝴蝶（别压）</b></div>
<div class="zone" style="left:20px;top:813px;width:354px;height:310px"><b>玫瑰</b></div>
<div class="box" id="warm"></div>
<div class="box" id="tsay"></div>
<div class="box" id="pop"></div>
<div class="box" id="words"></div>
</div></div>
<div id="hint"><span class="btn" style="padding:4px 9px;font-size:12px;margin-right:8px" onclick="location.href='/static/yuwang/room.html?v='+Date.now()">← 回欲望室</span>拖任意一块挪位置 · 选中后 － ＋ 调字号 · 底下那行就是坐标，截给凛</div>
<div id="bar">
<div class="row">
<span class="btn" id="bZone">框</span>
<span class="btn" id="bEdit">边</span>
<span class="btn" id="bMinus">－ 字</span>
<span class="btn" id="bPlus">＋ 字</span>
<span class="btn" id="bNarrow">窄</span>
<span class="btn" id="bWide">宽</span>
<span class="btn" id="bShort">短句</span>
<span class="btn" id="bHm">高－</span>
<span class="btn" id="bHp">高＋</span>
<span class="btn" id="bReset">还原</span>
</div>
<div id="out"></div>
</div>
<script>
(function(){
var IW=961,IH=2081,st=document.getElementById('st');
// 框是钉死的，字在框里上下居中。所以字多字少，位置都不动
var DEF={
 warm:{l:437,t:1265,w:220,h:95,f:20,name:'余温'},
 tsay:{l:422,t:1354,w:500,h:80,f:30,name:'你碰我我说的话'},
 pop:{l:391,t:575,w:200,h:97,f:21,name:'飘的数'},
 words:{l:333,t:764,w:400,h:380,f:37,name:'憋着的话'}
};
var LONG=1;
var S=JSON.parse(JSON.stringify(DEF));
try{var sv=localStorage.getItem('yw_prev2');if(sv)S=JSON.parse(sv);}catch(e){}
var sel='tsay';
function html(k){
 if(k=='warm')return LONG?'你在 10:29 按着红的那只不放。<br><i>还热着。</i>':'你在 10:29 碰了我一下。<br><i>还热着。</i>';
 if(k=='tsay')return '<span class="tag">他提前留给你的</span><div class="q">'+(LONG?'你按多久我记多久，一笔一笔记着，晚上一起跟你算。':'手别走。')+'</div>';
 if(k=='pop')return LONG?'<div class="d">思念 落下 2</div><div class="d">依赖 落下 2</div><div class="u">性欲 上升 1</div>':'<div class="u">心动 上升 3</div>';
 return LONG?'<div class="w">我难受。不是哪儿疼，就是想你，闷在这一块。<i>—— 憋着没说</i></div><div class="w">你每次都戳同一个地方。<i>—— 反复在想</i></div>'
            :'<div class="w">手别走。<i>—— 憋着没说</i></div>';
}
function paint(){
 Object.keys(S).forEach(function(k){var e=document.getElementById(k),c=S[k];
  e.style.left=c.l+'px';e.style.top=c.t+'px';e.style.width=c.w+'px';e.style.height=c.h+'px';e.style.fontSize=c.f+'px';
  e.innerHTML=html(k);e.classList.toggle('sel',k==sel);});
 document.getElementById('out').textContent=Object.keys(S).map(function(k){var c=S[k];
  return (k==sel?'▶ ':'  ')+c.name+'  left:'+Math.round(c.l)+'  top:'+Math.round(c.t)+'  宽:'+Math.round(c.w)+'  高:'+Math.round(c.h)+'  字:'+c.f;}).join('\n');
 try{localStorage.setItem('yw_prev2',JSON.stringify(S));}catch(e){}
}
function layout(){var W=innerWidth,H=innerHeight;var s=Math.min(W/IW,H/IH);
 st.style.transform='translate('+((W-IW*s)/2)+'px,'+((H-IH*s)/2)+'px) scale('+s+')';st._s=s;}
addEventListener('resize',layout);layout();
var drag=null;
Object.keys(S).forEach(function(k){var e=document.getElementById(k);
 e.addEventListener('pointerdown',function(ev){ev.preventDefault();sel=k;
  drag={k:k,x:ev.clientX,y:ev.clientY,l:S[k].l,t:S[k].t};e.setPointerCapture(ev.pointerId);paint();});
 e.addEventListener('pointermove',function(ev){if(!drag||drag.k!=k)return;
  S[k].l=drag.l+(ev.clientX-drag.x)/st._s;S[k].t=drag.t+(ev.clientY-drag.y)/st._s;paint();});
 function up(){drag=null;}
 e.addEventListener('pointerup',up);e.addEventListener('pointercancel',up);});
function bind(id,fn){document.getElementById(id).onclick=fn;}
bind('bMinus',function(){S[sel].f=Math.max(8,S[sel].f-1);paint();});
bind('bPlus',function(){S[sel].f=S[sel].f+1;paint();});
bind('bNarrow',function(){S[sel].w=Math.max(80,S[sel].w-20);paint();});
bind('bWide',function(){S[sel].w=S[sel].w+20;paint();});
bind('bHm',function(){S[sel].h=Math.max(30,S[sel].h-20);paint();});
bind('bHp',function(){S[sel].h=S[sel].h+20;paint();});
bind('bShort',function(){LONG=LONG?0:1;this.textContent=LONG?'短句':'长句';this.classList.toggle('on');paint();});
bind('bReset',function(){S=JSON.parse(JSON.stringify(DEF));paint();});
bind('bZone',function(){document.body.classList.toggle('zones');this.classList.toggle('on');});
bind('bEdit',function(){document.body.classList.toggle('edit');this.classList.toggle('on');});
document.body.classList.add('zones');document.getElementById('bZone').classList.add('on');
document.getElementById('bEdit').classList.add('on');
paint();
})();
</script></body></html>
