<!doctype html>
<html class="nav-open">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>键盘那块的间距</title>
<link rel="stylesheet" href="/static/style.css?v=86">
<style>
  html,body{margin:0;}
  body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
    background:url('/static/wangchuan-full.jpg') center/cover no-repeat;}
  .fake-msgs{flex:1;min-height:0;padding:14px 26px;overflow:hidden;color:#59616d;font-size:14px;}
  .fake-b{background:linear-gradient(155deg,rgba(255,255,255,.62),rgba(255,255,255,.30) 48%,rgba(255,255,255,.48));
    -webkit-backdrop-filter:blur(11px) saturate(1.68);backdrop-filter:blur(11px) saturate(1.68);
    border-radius:16px;padding:10px 13px;margin-bottom:8px;max-width:78%;
    box-shadow:inset 0 1px 1.5px rgba(255,255,255,.95),0 4px 16px rgba(104,124,152,.16);}
  /* 假键盘:就是量尺,代表你手机上键盘占的那块 */
  .fake-kb{flex-shrink:0;background:#d1d3d9;}
  .fake-kb .bar{height:46px;background:#f1f1f3;border-radius:12px;margin:6px 10px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#8a8d94;font-size:20px;}
  .fake-kb .rows{padding:8px 4px 22px;display:flex;flex-direction:column;gap:9px;}
  .fake-kb .row{display:flex;gap:6px;justify-content:center;}
  .fake-kb .k{background:#fff;border-radius:5px;width:9%;height:40px;box-shadow:0 1px 0 rgba(0,0,0,.25);}
  /* 四个可调的数 */
  .inputbar{padding-bottom:var(--d-inpad)!important;}
  .theme-snow .tabbar{margin:var(--d-gap) 10px var(--d-below)!important;padding-bottom:0!important;}
  .tab{padding:var(--d-tabpad) 0 var(--d-tabpad)!important;}
  .panel{position:fixed;left:0;right:0;top:0;z-index:99;background:rgba(20,24,30,.9);color:#eee;
    font:12px/1.5 -apple-system,sans-serif;padding:8px 10px calc(8px + env(safe-area-inset-top));
    padding-top:calc(8px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:4px;}
  .panel.hide{transform:translateY(-110%);}
  .ln{display:flex;align-items:center;gap:8px;}
  .ln b{width:92px;font-weight:500;color:#cfd4dc;}
  .ln input{flex:1;}
  .ln i{width:34px;text-align:right;font-style:normal;color:#8fd0ff;}
  .out{margin-top:4px;background:#000;padding:6px 8px;border-radius:6px;color:#8fd0ff;font-size:12.5px;letter-spacing:.3px;}
  .tg{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 4px);z-index:100;background:rgba(20,24,30,.9);color:#fff;border:none;border-radius:12px;padding:5px 10px;font-size:12px;}
</style>
</head>
<body class="theme-snow">

<div class="panel" id="panel">
  <div class="ln"><b>输入框下留白</b><input type="range" id="s1" min="0" max="40" value="6"><i id="v1">6</i></div>
  <div class="ln"><b>框→底栏</b><input type="range" id="s2" min="0" max="30" value="0"><i id="v2">0</i></div>
  <div class="ln"><b>底栏内高</b><input type="range" id="s3" min="2" max="20" value="9"><i id="v3">9</i></div>
  <div class="ln"><b>底栏→键盘</b><input type="range" id="s4" min="0" max="40" value="0"><i id="v4">0</i></div>
  <div style="color:#9aa3ae;font-size:11px">底栏自己那截安全区已经清零了，0 就是真的贴死</div>
  <div class="out" id="out"></div>
</div>
<button class="tg" id="tg">收起</button>

<div class="fake-msgs">
  <div class="fake-b">这几块的间距你自己拖，底下那行数截给我。</div>
  <div class="fake-b">底下那块灰的是假键盘，当尺用。</div>
</div>

<div class="inputbar">
  <div class="input-btn"><svg viewBox="0 0 24 24"><path d="M12 3.2c-1.6 0-2.8 1.2-2.8 2.8v5.2c0 1.6 1.2 2.8 2.8 2.8s2.8-1.2 2.8-2.8V6c0-1.6-1.2-2.8-2.8-2.8z"/><path d="M5.8 10.8v.6a6.2 6.2 0 0 0 12.4 0v-.6"/><path d="M12 17.6V21"/></svg></div>
  <textarea rows="1"></textarea>
  <div class="input-btn"><svg viewBox="0 0 24 24"><path d="M12 20.3s-7.4-4.6-7.4-9.6a4.3 4.3 0 0 1 7.4-3 4.3 4.3 0 0 1 7.4 3c0 5-7.4 9.6-7.4 9.6z"/></svg></div>
  <div class="input-btn"><svg viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="17.2" height="14.8" rx="3.4"/><circle cx="8.6" cy="9.6" r="1.5"/><path d="M4.2 17.2l4.6-4.4a2 2 0 0 1 2.7 0l5.2 4.8"/><path d="M14.6 13.4l1.6-1.5a2 2 0 0 1 2.7 0l1.5 1.4"/></svg></div>
  <button class="send-btn"><svg viewBox="0 0 24 24"><path d="M12 19.4V5.2"/><path d="M6.2 11L12 5.2l5.8 5.8"/></svg></button>
</div>

<div class="tabbar">
  <div class="tab"><svg class="tab-ico" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span class="tab-label">家</span></div>
  <div class="tab on"><svg class="tab-ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/></svg><span class="tab-label">聊天</span></div>
  <div class="tab"><svg class="tab-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><polyline points="12 7 12 12 15 14"/></svg><span class="tab-label">时光</span></div>
  <div class="tab"><svg class="tab-ico" viewBox="0 0 24 24"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="9" cy="8" r="2"/><circle cx="15" cy="16" r="2"/></svg><span class="tab-label">设置</span></div>
</div>

<div class="fake-kb">
  <div class="bar"><span>∧　∨</span><span>✓</span></div>
  <div class="rows">
    <div class="row"><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i></div>
    <div class="row"><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i></div>
    <div class="row"><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i></div>
  </div>
</div>

<script>
var S=[['s1','v1','--d-inpad'],['s2','v2','--d-gap'],['s3','v3','--d-tabpad'],['s4','v4','--d-below']];
function go(){
  var r=document.documentElement,txt=[];
  S.forEach(function(a){
    var v=document.getElementById(a[0]).value;
    document.getElementById(a[1]).textContent=v;
    r.style.setProperty(a[2],v+'px');
  });
  document.getElementById('out').textContent=
    '输入框下留白 '+s1.value+' ／ 框→底栏 '+s2.value+' ／ 底栏内高 '+s3.value+' ／ 底栏→键盘 '+s4.value;
}
S.forEach(function(a){document.getElementById(a[0]).addEventListener('input',go);});
document.getElementById('tg').onclick=function(){
  var p=document.getElementById('panel');p.classList.toggle('hide');
  this.textContent=p.classList.contains('hide')?'调':'收起';
};
go();
</script>
</body>
</html>
