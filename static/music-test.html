<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>随身听</title>
<!-- 加到主屏幕就是一个独立 app：图标、全屏、没有 Safari 地址栏 -->
<link rel="manifest" href="/static/tingting.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="随身听">
<meta name="theme-color" content="#fbfcfd">
<link rel="apple-touch-icon" sizes="180x180" href="/static/tt-icon-180.png">
<link rel="apple-touch-icon" href="/static/tt-icon-180.png">
<link rel="apple-touch-icon" sizes="512x512" href="/static/tt-icon-512.png">
<link rel="icon" href="/static/tt-icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans",sans-serif;
  background:linear-gradient(180deg,#fbfcfd,#eef1f4);color:#2b2f36;overflow:hidden;position:fixed;inset:0;display:flex;flex-direction:column;}
.page{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 22px calc(env(safe-area-inset-bottom) + 14px);
  transition:transform .34s cubic-bezier(.3,.7,.3,1);background:linear-gradient(180deg,#fbfcfd,#eef1f4);}
#play-page{z-index:2;}
#play-page.hid{transform:translateY(100%);}
.top{display:flex;align-items:center;justify-content:space-between;height:44px;flex-shrink:0;}
.top .down{width:30px;height:30px;color:#3a3f47;display:grid;place-items:center;background:none;border:none;padding:0;}
.top .down svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.top .ttl{font-size:16px;font-weight:500;color:#2b2f36;}
.top .share{width:24px;height:24px;color:#3a3f47;}
.together{position:relative;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:22px 0 0;}
.tg-buds{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:200px;height:122px;pointer-events:none;overflow:visible;z-index:0;}
.tg-faces{display:flex;position:relative;z-index:2;}
.tg-face{width:56px;height:56px;border-radius:50%;background:#d8dce2 center/cover no-repeat;border:none;box-shadow:0 2px 8px rgba(60,70,90,.16);}
.tg-face:last-child{margin-left:0;}
.tg-tip{position:relative;z-index:2;margin-top:16px;font-size:12px;color:#aeb4bc;letter-spacing:.2px;white-space:nowrap;}
.ipod-box{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px 0 0;}
.ipod{width:min(66vw,244px);height:auto;max-height:100%;aspect-ratio:264/446;padding:3% 3.3%;border-radius:8.5% / 5%;position:relative;
  background:linear-gradient(150deg,#ffffff 0%,#f8f9fa 22%,#eaecee 58%,#d8dbdf 100%);
  box-shadow:0 3px 3px rgba(255,255,255,1) inset,-3px 0 7px rgba(255,255,255,.85) inset,
    0 -5px 12px rgba(165,172,184,.55) inset,4px 5px 9px rgba(165,172,184,.4) inset,
    0 28px 48px -20px rgba(50,60,80,.55),0 12px 24px -12px rgba(50,60,80,.4);
  display:flex;flex-direction:column;z-index:1;}
.screen{margin-top:5.5%;border-radius:4px;overflow:hidden;border:1px solid #a8adb6;background:#e8ebee;box-shadow:0 1px 3px rgba(0,0,0,.22) inset,0 1px 0 rgba(255,255,255,.6);}
.scr-top{display:flex;align-items:center;justify-content:space-between;padding:3px 6px;background:linear-gradient(#e2e5e9,#c7ccd2);border-bottom:1px solid #a8adb6;}
.scr-top b{font-size:8.5px;font-weight:600;color:#40454d;}
.scr-top .r{display:flex;align-items:center;gap:4px;}
.scr-top .pz{color:#4a90d9;font-size:7px;letter-spacing:-1px;}
.scr-top .bt{width:14px;height:8px;border:1px solid #5a6068;border-radius:2px;padding:1px;position:relative;}
.scr-top .bt::after{content:"";display:block;height:100%;width:72%;background:#5cb85c;border-radius:1px;}
.scr-top .bt::before{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:2px;height:4px;background:#5a6068;border-radius:0 1px 1px 0;}
.scr-body{display:flex;gap:7px;padding:7px;background:#f5f7f8;}
.scr-cover{width:33%;aspect-ratio:1;border-radius:2px;object-fit:cover;background:#d5dae0;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.15);}
.scr-meta{flex:1;min-width:0;padding-top:1px;}
.scr-meta .nm{font-size:11px;font-weight:700;color:#20262c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.scr-meta .ar{font-size:9.5px;color:#525860;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.scr-meta .al{font-size:8.5px;color:#8a9098;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.scr-prog{display:flex;align-items:center;gap:4px;padding:0 7px 7px;background:#f5f7f8;font-size:7px;color:#6a7078;}
.scr-track{flex:1;height:7px;border-radius:4px;background:linear-gradient(#d2d6da,#e2e5e8);border:1px solid #b5bac0;overflow:hidden;box-shadow:0 1px 1px rgba(0,0,0,.08) inset;}
.scr-fill{height:100%;width:0%;background:linear-gradient(#8fc4f0,#4a90d9);border-radius:3px;box-shadow:0 -1px 1px rgba(255,255,255,.3) inset;}
.wheel-box{flex:1;display:flex;align-items:center;justify-content:center;}
.wheel{width:65%;aspect-ratio:1;border-radius:50%;position:relative;background:radial-gradient(circle at 50% 30%,#f4f5f6 0%,#e0e3e6 32%,#c8ccd1 58%,#b2b7bd 82%,#a4a9b1 100%);box-shadow:0 5px 14px rgba(70,78,95,.4),0 2px 0 rgba(255,255,255,1) inset,0 -5px 12px rgba(120,128,142,.5) inset,0 5px 10px rgba(255,255,255,.85) inset;display:grid;place-items:center;}
.wheel::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 26%,rgba(255,255,255,.65),transparent 46%);pointer-events:none;}
.wheel::after{content:"";position:absolute;inset:6%;border-radius:50%;box-shadow:0 2px 5px rgba(100,108,122,.28) inset,0 -2px 4px rgba(255,255,255,.7) inset,0 0 0 1px rgba(150,156,166,.18);pointer-events:none;}
.wheel .menu{position:absolute;top:8%;font-size:8.5px;font-weight:600;color:#868b93;letter-spacing:1.6px;z-index:1;}
.wheel .wi{position:absolute;color:#7d828b;z-index:1;}
.wheel .wi svg{width:14px;height:14px;fill:currentColor;}
.wheel .wi.prev{left:11%;top:50%;transform:translateY(-50%);}
.wheel .wi.next{right:11%;top:50%;transform:translateY(-50%);}
.wheel .wi.play{bottom:9.5%;}
.wheel .center{width:39%;aspect-ratio:1;border-radius:50%;border:none;z-index:1;background:radial-gradient(circle at 50% 34%,#ffffff 0%,#f0f2f4 52%,#dadde1 100%);box-shadow:0 3px 8px rgba(90,100,120,.38),0 2px 0 rgba(255,255,255,1) inset,0 -3px 6px rgba(150,156,168,.4) inset;}
.wbtn{position:absolute;width:30%;height:30%;background:none;border:none;}
.wbtn.m{top:0;left:35%;} .wbtn.p{left:0;top:35%;} .wbtn.n{right:0;top:35%;} .wbtn.y{bottom:0;left:35%;}
.below{flex-shrink:0;padding-top:24px;}
.b-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;}
.b-title{font-size:20px;font-weight:700;color:#20262c;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.b-artist{font-size:13px;color:#8a9098;margin-top:6px;display:flex;align-items:center;gap:7px;}
.b-follow{font-size:11px;color:#8a9098;border:1px solid #d5dae0;border-radius:9px;padding:1px 8px;}
.b-artist{cursor:pointer;}
.b-artist:active{opacity:.6;}
.b-social{display:flex;align-items:center;gap:18px;flex-shrink:0;}
/* 看歌词时歌名已经在顶栏了，下面这份藏起来，别重复 */
#play-page.lyon .b-head>div:first-child{display:none;}
#play-page.lyon .b-social{margin-left:auto;}
.b-heart{color:#9298a0;background:none;border:none;}
.b-heart svg path{fill:none;stroke:currentColor;stroke-width:1.7;}
.b-heart.liked{color:#ec4141;}
.b-heart.liked svg path{fill:currentColor;stroke:none;}
.b-heart svg{width:26px;height:26px;fill:currentColor;}
/* 单人显单颗,一起听显双人红心 */
.heart-double{display:none;}
#play-page.listening .heart-single{display:none;}
#play-page.listening .heart-double{display:block;width:30px;height:28px;}
.b-cmt{width:26px;height:26px;color:#5a6068;background:none;border:none;}
.chat-view{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 152px);bottom:80px;display:none;flex-direction:column;padding:0 18px;}
.chat-view.on{display:flex;}
.cv-msgs{flex:1;overflow-y:auto;scrollbar-width:none;padding:30px 0 8px;display:flex;flex-direction:column;gap:12px;}
.cv-msgs::-webkit-scrollbar{display:none;}
.cv-row{display:flex;gap:8px;max-width:82%;}
.cv-row.me{align-self:flex-end;flex-direction:row-reverse;}
.cv-av{width:34px;height:34px;border-radius:50%;background:#d8dce2 center/cover no-repeat;flex-shrink:0;}
.cv-bubble{padding:9px 13px;border-radius:15px;font-size:15px;line-height:1.4;color:#20262c;background:#fff;box-shadow:0 1px 3px rgba(60,70,90,.08);}
.cv-row.me .cv-bubble{background:#d5e8fb;}
.cv-col{display:flex;flex-direction:column;gap:5px;min-width:0;}
.cv-col.me{align-items:flex-end;}
/* 被回复的那句：灰白小框，跟在气泡下面，只有内容不带昵称 */
.cv-quote{background:#e8ebef;border-radius:10px;padding:6px 10px;font-size:12.5px;line-height:1.35;color:#868d96;}
.cv-item{display:flex;align-items:center;gap:10px;}
.ck{width:22px;height:22px;border-radius:50%;border:1.6px solid #c4cad2;flex-shrink:0;display:none;place-items:center;background:#fff;}
.selmode .ck{display:grid;}
.ck.on{background:#ec4141;border-color:#ec4141;}
.ck svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:none;}
.ck.on svg{display:block;}
/* 长按消息弹出来的那三个 */
.msg-pop{position:fixed;background:#fff;border-radius:14px;display:none;padding:12px 4px 10px;
  box-shadow:0 12px 30px -8px rgba(45,55,75,.34),0 1px 4px rgba(45,55,75,.10);z-index:70;}
.msg-pop.show{display:flex;}
.msg-pop .it{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 17px;
  font-size:12px;color:#2b2f36;background:none;border:none;}
.msg-pop .it svg{width:22px;height:22px;fill:none;stroke:#2b2f36;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.msg-arrow{position:fixed;width:15px;height:8px;z-index:70;display:none;}
.msg-arrow.show{display:block;}
/* 回复时输入框上面挂着那条 */
.reply-bar{display:none;align-items:center;gap:8px;background:#e8ebef;border-radius:10px;
  padding:7px 10px;margin-bottom:8px;font-size:12.5px;color:#868d96;}
.reply-bar.show{display:flex;}
.reply-bar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reply-bar .x{color:#a8aeb6;font-size:15px;padding:0 2px;background:none;border:none;}
/* 多选时底下那条 */
.sel-bar{display:none;align-items:center;justify-content:center;padding:14px 0 10px;flex-shrink:0;}
.selmode .sel-bar{display:flex;}
.selmode .cv-input{display:none;}
.sel-bar .b{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#2b2f36;background:none;border:none;}
.sel-bar .b svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.sel-bar .b[disabled]{opacity:.35;}
#play-page.selmode .mc-switch{display:none;}
.cv-input{display:flex;gap:8px;padding:10px 0;flex-shrink:0;}
.cv-input input{flex:1;padding:11px 15px;border-radius:20px;border:none;background:#e9ecef;font-size:15px;outline:none;color:#2b2f36;}
.cv-input button{padding:0 18px;border-radius:20px;border:none;background:#ec4141;color:#fff;font-size:14px;font-weight:600;}
.mc-switch{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;background:#e9ecef;border-radius:22px;padding:3px;gap:2px;z-index:8;}
.mc-btn{width:52px;height:36px;border:none;background:none;border-radius:19px;display:grid;place-items:center;color:#8a9098;}
.mc-btn svg{width:22px;height:22px;}
.mc-btn.on{background:#fff;color:#2b2f36;box-shadow:0 1px 4px rgba(60,70,90,.12);}
/* 聊天分两间房，标签告诉你现在在跟哪个凛说话 */
.cv-room{flex-shrink:0;display:flex;justify-content:center;padding:6px 0 2px;}
.cv-room button{font:inherit;font-size:11px;color:#8a9098;background:#e9ecef;border:none;
  border-radius:14px;padding:5px 13px;display:flex;align-items:center;gap:5px;}
.cv-room button b{font-weight:600;color:#3a3f47;}
.cv-room button svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.rm-mask{position:fixed;inset:0;background:rgba(20,24,30,.34);z-index:60;display:none;align-items:flex-end;}
.rm-mask.show{display:flex;}
.rm-sheet{width:100%;background:#f7f8fa;border-radius:18px 18px 0 0;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);}
.rm-sheet h4{font-size:12px;font-weight:500;color:#9298a0;text-align:center;padding:8px 0 10px;}
.rm-sheet button{width:100%;font:inherit;font-size:16px;color:#2b2f36;background:#fff;border:none;
  border-radius:12px;padding:14px;margin-bottom:8px;text-align:left;display:flex;flex-direction:column;gap:3px;}
.rm-sheet button span{font-size:11.5px;color:#9298a0;}
.rm-sheet button.on{box-shadow:0 0 0 2px #ec4141 inset;}
.rm-sheet .rm-x{text-align:center;color:#8a9098;background:#ececef;margin:2px 0 0;}
.prog{display:flex;align-items:center;gap:10px;font-size:11px;color:#9298a0;margin-top:2px;}
.prog .bar{flex:1;height:2px;background:#d8dce2;border-radius:2px;position:relative;cursor:pointer;}
.prog .bar .f{position:absolute;left:0;top:0;height:100%;background:#8a9098;border-radius:2px;}
.prog .bar .dot{position:absolute;top:50%;left:0%;width:10px;height:10px;border-radius:50%;background:#fff;border:1px solid #b0b6be;transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.15);}
.prog .bar{touch-action:none;}
/* 隐形的加大触摸区，手指好抓，外观不变 */
.prog .bar::after{content:"";position:absolute;left:0;right:0;top:-15px;bottom:-15px;}
.prog-sub{text-align:center;font-size:11px;color:#b0b6be;margin-top:8px;}
.ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:22px;margin-bottom:52px;padding:0 2px;}
.cb{background:none;border:none;color:#3a3f47;display:grid;place-items:center;}
.cb svg{fill:currentColor;}
.cb.mode svg,.cb.list svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.cb.side svg{width:30px;height:30px;}
.cb.main svg{width:52px;height:52px;}
.lyric-view{position:absolute;inset:0;background:linear-gradient(180deg,#fbfcfd,#eef1f4);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 52px) 22px calc(env(safe-area-inset-bottom) + 18px);z-index:3;overflow-x:hidden;}
.lyric-view.on{display:flex;}
.ly-scroll{flex:1;overflow-y:auto;overflow-x:hidden;text-align:center;padding:3px 0 26vh;margin:0 -12px;scrollbar-width:none;}
.ly-scroll::-webkit-scrollbar{display:none;}
/* 一起听时头像搬进歌词页，比播放页小一号，上下留一样的空 */
.lyric-view .together{padding:6px 0 9px;}
.lyric-view .together .tg-face{width:46px;height:46px;}
.lyric-view .together .tg-buds{top:6px;width:165px;height:101px;}
.lyric-view .together .tg-tip{margin-top:11px;font-size:11px;}
.ly-line{font-size:16px;color:#b6bcc4;line-height:1.5;padding:8px 10px;margin:9px 0;transition:color .25s,font-size .25s,background .2s;}
.ly-line.cur{font-size:18px;color:#20262c;}
.ly-line .tr{font-size:12px;color:#9298a0;font-weight:400;margin-top:4px;}
.ly-line.cur .tr{color:#5a6068;}
.ly-empty{color:#b0b6be;font-size:14px;padding-top:36vh;}
/* 歌词滑动定位条（拖动时有线，松手后只剩时间和三角）*/
.ly-seek{position:absolute;left:14px;right:14px;top:0;transform:translateY(-50%);display:none;align-items:center;gap:12px;z-index:6;pointer-events:none;}
.ly-seek.on{display:flex;}
.ly-seek .tm{font-size:11px;color:#9298a0;width:34px;flex-shrink:0;}
.ly-seek .ln{flex:1;height:1px;background:rgba(130,140,152,.22);transition:opacity .2s;}
.ly-seek.rest .ln{opacity:0;}
.ly-seek .pl{width:26px;height:26px;display:grid;place-items:center;color:#3a3f47;flex-shrink:0;pointer-events:auto;background:none;border:none;padding:0;-webkit-appearance:none;appearance:none;box-shadow:none;}
.ly-seek .pl svg{width:15px;height:15px;fill:currentColor;stroke:none;}
.ly-line.pick{color:#7b818a;}
.ly-line.pick.rest{background:rgba(120,130,145,.10);border-radius:16px;}
#list-page{z-index:1;padding-bottom:0;}
.lp-top{display:flex;align-items:center;gap:14px;height:44px;flex-shrink:0;}
.lp-tab{font-size:19px;font-weight:700;color:#b6bcc4;}
.lp-tab.on{color:#20262c;}
.lp-search{margin:14px 0;position:relative;}
.lp-search input{width:100%;padding:11px 14px 11px 40px;border-radius:20px;border:none;background:#e9ecef;font-size:15px;outline:none;color:#2b2f36;}
.lp-search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9298a0;width:18px;height:18px;}
.lp-body{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:80px;}
.lp-body::-webkit-scrollbar{display:none;}
.mine-item{display:flex;align-items:center;gap:13px;padding:11px 2px;}
.mine-item:active{opacity:.6;}
.mine-ic{width:46px;height:46px;border-radius:10px;background:#e9ecef;display:grid;place-items:center;color:#5a6068;flex-shrink:0;}
.mine-ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;}
.mine-tx{flex:1;min-width:0;}
.mine-tx .nm{font-size:16px;color:#20262c;}
.mine-tx .sub{font-size:12px;color:#9298a0;margin-top:3px;}
.res{display:flex;align-items:center;gap:11px;padding:9px 2px;}
.res:active{opacity:.6;}
.res img{width:44px;height:44px;border-radius:7px;object-fit:cover;background:#d8dce2;flex-shrink:0;}
.res .i{flex:1;min-width:0;}
.res .i .nm{font-size:15px;color:#20262c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.res .i .ar{font-size:12px;color:#9298a0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.res .go{color:#ec4141;font-size:22px;}
.hint{text-align:center;color:#b0b6be;font-size:13px;padding:30px;}
/* 骨架屏：加载时先摆好形状，比一片空白舒服 */
.sk-item{display:flex;align-items:center;gap:13px;padding:11px 2px;}
.sk-box{width:46px;height:46px;border-radius:10px;flex-shrink:0;}
.sk-line{height:12px;border-radius:6px;}
.sk-tx{flex:1;min-width:0;}
.sk-shine{background:linear-gradient(100deg,#e9ecef 30%,#f4f6f8 45%,#e9ecef 60%);
  background-size:300% 100%;animation:skshine 1.3s ease-in-out infinite;}
@keyframes skshine{0%{background-position:100% 0}100%{background-position:0 0}}
.sk-head{font-size:12px;color:#c8cdd3;padding:16px 2px 6px;}
.more-tip{text-align:center;color:#c0c4ca;font-size:12px;padding:14px 0 26px;}
/* 歌手主页 */
.ar-top{display:flex;flex-direction:column;align-items:center;padding:6px 0 18px;}
.ar-face{width:74px;height:74px;border-radius:50%;background:#d8dce2 center/cover no-repeat;box-shadow:0 3px 10px rgba(60,70,90,.18);}
.ar-name{font-size:19px;font-weight:700;color:#20262c;margin-top:12px;}
.ar-sub{font-size:12px;color:#9298a0;margin-top:5px;}
.ar-fav{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:13px 15px;box-shadow:0 1px 4px rgba(60,70,90,.07);margin-bottom:16px;}
.ar-fav:active{opacity:.7;}
.ar-fav .hz{width:20px;height:20px;color:#ec4141;flex-shrink:0;display:grid;place-items:center;}
.ar-fav .hz svg{width:20px;height:20px;fill:currentColor;}
.ar-fav .tx{flex:1;font-size:14px;color:#20262c;}
.ar-fav .n{font-size:12px;color:#9298a0;}
.ar-fav .go{font-size:17px;color:#c0c4ca;margin-left:4px;}
.ar-tabs{display:flex;gap:26px;padding:0 2px 10px;}
.ar-tab{font-size:15px;color:#9298a0;position:relative;padding-bottom:7px;}
.ar-tab.on{color:#20262c;font-weight:600;}
.ar-tab.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:18px;height:3px;border-radius:2px;background:#ec4141;}
.playall{display:flex;align-items:center;gap:11px;padding:6px 2px 12px;}
.playall:active{opacity:.6;}
.playall .pbtn{width:30px;height:30px;border-radius:50%;background:#ec4141;display:grid;place-items:center;flex-shrink:0;box-shadow:0 2px 6px rgba(236,65,65,.32);}
.playall .pbtn svg{width:13px;height:13px;fill:#fff;margin-left:2px;}
.playall .t{font-size:15px;font-weight:600;color:#20262c;}
.playall .n{font-size:12px;color:#9298a0;margin-left:auto;}
.al-item{display:flex;align-items:center;gap:12px;padding:9px 2px;}
.al-item:active{opacity:.6;}
.al-item img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#d8dce2;flex-shrink:0;}
.al-item .t{flex:1;min-width:0;}
.al-item .t .nm{font-size:15px;color:#20262c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.al-item .t .sub{font-size:12px;color:#9298a0;margin-top:3px;}
/* 行内编辑按钮 */
.res .edit{width:28px;height:28px;display:grid;place-items:center;color:#c0c4ca;flex-shrink:0;}
.res .edit svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
/* 编辑歌曲信息弹层 */
.ed-mask{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.34);display:none;align-items:flex-end;}
.ed-mask.open{display:flex;}
.ed-card{width:100%;background:#f4f6f8;border-radius:18px 18px 0 0;padding:18px 20px calc(env(safe-area-inset-bottom) + 18px);}
.ed-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.ed-head b{font-size:16px;color:#20262c;}
.ed-head .x{background:none;border:none;font-size:18px;color:#9298a0;}
.ed-body{display:flex;gap:14px;align-items:flex-start;}
.ed-cover{width:76px;height:76px;border-radius:10px;background:#e9ecef center/cover no-repeat;flex-shrink:0;display:grid;place-items:center;color:#9298a0;font-size:11px;text-align:center;line-height:1.3;border:1px dashed #cfd4da;}
.ed-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;}
.ed-fields input{width:100%;padding:10px 13px;border-radius:10px;border:none;background:#e9ecef;font-size:15px;outline:none;color:#2b2f36;}
.ed-hint{font-size:11px;color:#b0b6be;margin-top:12px;line-height:1.5;}
.ed-btns{display:flex;gap:10px;margin-top:16px;}
.ed-btns button{flex:1;padding:12px;border-radius:22px;border:none;font-size:15px;font-weight:600;}
.ed-reset{background:#eef0f2;color:#8a9098;}
.ed-save{background:#ec4141;color:#fff;}
/* 听歌排行入口图标(第一名封面+白色阶梯) */
.rank-ic{width:46px;height:46px;border-radius:10px;flex-shrink:0;position:relative;display:grid;place-items:center;background:#8a9098 center/cover no-repeat;}
.rank-ic::after{content:"";position:absolute;inset:0;border-radius:10px;background:rgba(0,0,0,.28);}
.rank-ic svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;position:relative;z-index:1;}
/* 听歌排行页 */
.rk-head{display:flex;align-items:center;gap:8px;padding:4px 2px 10px;}
.rk-back{font-size:20px;color:#5a6068;}
.rk-title{font-size:17px;font-weight:700;}
.rk-tabs{display:flex;gap:26px;padding:2px 2px 12px;}
.rk-tab{font-size:14px;color:#9298a0;position:relative;padding-bottom:7px;}
.rk-tab.on{color:#20262c;font-weight:600;}
.rk-tab.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:18px;height:3px;border-radius:2px;background:#ec4141;}
.rk-sub{font-size:12px;color:#b0b6be;padding:0 2px 10px;}
.rk-row{display:flex;align-items:center;gap:11px;padding:10px 2px;}
.rk-row:active{opacity:.6;}
.rk-i{width:24px;text-align:center;font-size:13px;color:#b0b6be;flex-shrink:0;}
.rk-mid{flex:1;min-width:0;}
.rk-nm{font-size:15px;color:#20262c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rk-ar{font-size:12px;color:#9298a0;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rk-n{font-size:12px;color:#9298a0;flex-shrink:0;display:flex;align-items:center;gap:3px;justify-content:flex-end;min-width:50px;}
.rk-n svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;flex-shrink:0;}
.mini{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);height:56px;border-radius:28px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);box-shadow:0 6px 20px -6px rgba(60,70,90,.3);display:none;align-items:center;gap:11px;padding:6px 12px 6px 6px;z-index:5;}
.mini.show{display:flex;}
.mini img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#d8dce2;animation:spin 12s linear infinite;animation-play-state:paused;}
.mini.playing img{animation-play-state:running;}
@keyframes spin{to{transform:rotate(360deg);}}
.mini .mt{flex:1;min-width:0;}
.mini .mt .nm{font-size:14px;color:#20262c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini .mt .ar{font-size:11px;color:#9298a0;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini .mp{width:34px;height:34px;color:#3a3f47;background:none;border:none;display:grid;place-items:center;}
.mini .mp svg{width:26px;height:26px;fill:currentColor;}
.mini .ml{width:30px;height:30px;color:#5a6068;background:none;border:none;}
.mini .ml svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;}
.queue-sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.34);display:none;align-items:flex-end;}
.queue-sheet.open{display:flex;}
.q-inner{width:100%;max-height:72vh;background:#f4f6f8;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;}
.q-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid #e4e7ea;}
.q-head b{font-size:16px;color:#20262c;}
.q-head .q-n{font-size:13px;color:#9298a0;margin-left:4px;}
.q-close{background:none;border:none;font-size:18px;color:#9298a0;}
.q-list{flex:1;overflow-y:auto;scrollbar-width:none;padding:4px 0;}
.q-list::-webkit-scrollbar{display:none;}
.q-item{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:10px;}
.q-item:active{background:#e9ecef;}
.q-item.cur .q-nm{color:#ec4141;}
.q-item.cur .q-ar{color:#ec4141;}
.q-song{flex:1;min-width:0;display:flex;align-items:baseline;}
.q-nm{font-size:15px;color:#20262c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;}
.q-ar{font-size:12px;color:#9298a0;white-space:nowrap;flex-shrink:0;max-width:40%;overflow:hidden;text-overflow:ellipsis;}
.q-del{background:none;border:none;font-size:15px;color:#c0c4ca;flex-shrink:0;padding:4px;}
.q-foot{padding:14px 18px;border-top:1px solid #e4e7ea;text-align:center;}
.q-foot span{font-size:14px;color:#5a6068;}
/* 邀请弹窗 */
/* 邀请弹窗：照网易云的排版，配色跟着我们自己的白 */
.invite-mask{position:fixed;inset:0;z-index:80;background:rgba(40,46,56,.20);
  display:none;align-items:center;justify-content:center;padding:40px;}
.invite-mask.show{display:flex;}
/* 毛玻璃要看得出来，关键不是糊得多，是透得够：
   糊太狠底下全糊成一片均匀的白，就跟纯白没区别了。 */
.invite-card{background:rgba(255,255,255,.50);border-radius:26px;padding:30px 26px 26px;width:100%;max-width:290px;
  text-align:center;box-shadow:0 26px 60px -18px rgba(60,70,90,.34);
  border:1px solid rgba(255,255,255,.65);
  -webkit-backdrop-filter:blur(13px) saturate(2);backdrop-filter:blur(13px) saturate(2);}
.inv-heads{position:relative;height:112px;margin-bottom:4px;}
.inv-buds{position:absolute;top:0;left:0;width:100%;height:112px;pointer-events:none;overflow:visible;z-index:0;}
.inv-faces{position:relative;z-index:2;display:flex;justify-content:center;gap:22px;padding-top:6px;}
.inv-face{width:62px;height:62px;border-radius:50%;background:#d8dce2 center/cover no-repeat;
  box-shadow:0 3px 10px rgba(60,70,90,.18);}
.inv-name{font-size:18px;font-weight:700;color:#20262c;letter-spacing:.3px;}
.inv-sub{font-size:13px;color:#9aa1a9;margin-top:6px;margin-bottom:24px;}
.invite-btns{display:flex;gap:44px;justify-content:center;}
.invite-btns button{width:56px;height:56px;border-radius:50%;border:none;padding:0;
  display:flex;align-items:center;justify-content:center;}
.invite-btns svg{width:24px;height:24px;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.inv-no{background:#e7eaee;color:#8a9098;}
.inv-yes{background:#ec4141;color:#fff;box-shadow:0 6px 16px -4px rgba(236,65,65,.55);}

/* 单人/一起听 排版切换 */
.together{display:none;}
.mc-switch{display:none;}
#play-page.listening .together{display:flex;}
#play-page.listening .ipod{width:min(47vw,196px);}
#play-page.listening .mc-switch{display:flex;}
/* 单人=原始排版(大iPod,原始间距),一起听才缩小加头像 */

/* ── 开屏：就是那张图。盒子不动，里面的碟在转 ──
   做法：整张图当底（盒子），再把图里那张碟抠成圆形贴在原位上转，
   底下那份被完全盖住，所以看起来只有碟在动。 */
#splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#fbfcfd,#eef1f4);transition:opacity .55s ease;}
#splash.gone{opacity:0;pointer-events:none;}
.sp-wrap{position:relative;width:186px;height:186px;opacity:0;animation:spFade 1s ease forwards;
  filter:drop-shadow(0 12px 22px rgba(60,70,90,.30));}
.sp-wrap img{position:absolute;display:block;}
.sp-case{left:0;top:0;width:186px;height:186px;}
.sp-disc{left:15.8px;top:15.2px;width:154.4px;height:154.4px;
  animation:spSpin 6s linear infinite;transform-origin:50% 50%;}
@keyframes spFade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes spSpin{to{transform:rotate(360deg)}}
</style>
</head>

</div></div>

// HLS 播放引擎

  for(let k=0;k<HLS_WIN&&k<order.length;k++)win.push(order[(startIdx+k)%order.length]);

let stallSec=0,lastT=-1,everPlayed=false,autoSolo=false;

  if(resumeGrace>0){resumeGrace--;stallSec=0;lastT=audio.currentTime;return;}

  if(t!==lastT&&t>0){stallSec=0;lastT=t;everPlayed=true;return;}   // 在走，一切正常

  if(loadingNow()&&stallSec<18)return;

  if(stallSec===5){try{audio.pause();}catch(e){}}
  if(stallSec===7){try{audio.play().catch(()=>{});}catch(e){}}

  if(stallSec>=20&&hlsMode){

const keepAlive=document.createElement('audio');
keepAlive.setAttribute('playsinline','');keepAlive.loop=true;keepAlive.preload='auto';

let kaTimer=null;
function keepAliveOn(){
  clearTimeout(kaTimer);

  kaTimer=setTimeout(()=>{

setInterval(()=>{

let resumeAt=0;      // 停住/重载之前停在哪一秒

function reloadAndSeek(){
  const back=()=>{audio.removeEventListener('loadedmetadata',back);

}

function doPause(){

function loadingNow(){return audio.networkState===2&&audio.readyState<3;}
function kickPlay(from){
  const at=(typeof from==='number')?from:audio.currentTime;
  resumeGrace=8;
  warm(cur&&cur.id);                    // 顺手让后端把直链备好，少等一轮
  try{const p=audio.play();if(p&&p.catch)p.catch(playBlocked);}catch(e){}

  const check=()=>{
    if(userPaused||audio.currentTime>at+0.1){kicking=false;return;}
    waited+=1400;
    resumeGrace=8;                      // 还在等，就一直压着看门狗别插手
    // 它在下载：耐心等，最多等 20 秒
    if(loadingNow()&&waited<20000){
      if(waited===1400)toast('正在续上…');
      setTimeout(check,1400);return;
    }
    // 真的不动了，才按你的手法救：停 0.9 秒再播
    kicking=true;
    try{audio.pause();}catch(e){}
    setTimeout(()=>{
      kicking=false;
      if(userPaused)return;
      resumeGrace=8;
      try{audio.play().catch(playBlocked);}catch(e){}
      setTimeout(()=>{
        if(userPaused||audio.currentTime>at+0.1)return;
        resumeAt=at;resumeGrace=8;reloadAndSeek();
      },2500);
    },900);
  };
  setTimeout(check,1400);
}

function doResume(){
  userPaused=false;
  keepAliveOff();
  kickPlay(audio.currentTime);
}

// 跳到某一秒然后确保它真的响。上/下一首、点歌词、拖进度条都走这里。
function seekAndPlay(t,keepPaused){

  kickPlay(t);
}

    // 分段表空了（被降级清掉过）就从当前这首往后数，否则接着这张列表往下续；
    // 不判断的话算出来还是原地，按下一首会重放同一首。
    startStream(((segs.length?segBase+segs.length:qIndex+1)%queue.length+queue.length)%queue.length,true);
  }
}
function playPrev(){
  if(!queue.length)return;
  if(!hlsMode){
    qIndex=(qIndex-1+queue.length)%queue.length;
    soloPlay(queue[qIndex]);return;
  }
  if(segIdx-1>=0&&segs.length){
    warm(segs[segIdx-1].id);
    seekAndPlay(segs[segIdx-1].start);
    onSegChanged(segIdx-1);
  }else{
    startStream((((segs.length?segBase:qIndex)-1)%queue.length+queue.length)%queue.length,true);
  }
}

    document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity='0',1600);
}

async function openPlaylist(pid,name){

    const all=r.songs||[];
    curSourceId=pid;
    warmFirst(all);
    renderSongList(all,name||r.name,all);
    setListTotal(all.length,r.total||all.length);
    if(!r.done)loadPlaylistRest(my,pid,all,r.total||0);
  }catch(e){$('lp-body').innerHTML='<div class="hint">出错：'+e+'</div>';}

// 一段一段往下续。往同一个数组里塞，列表和播放队列自动跟着变长
async function loadPlaylistRest(my,pid,all,total){
  let offset=all.length;
  while(my===plLoadToken&&(!total||offset<total)){
    let r;
    try{r=await fetchT('/api/music/playlist/page?id='+pid+'&offset='+offset+'&limit=300',40000);}
    catch(e){break;}
    if(my!==plLoadToken)return;
    if(!r||!r.ok||!(r.songs||[]).length)break;
    all.push.apply(all,r.songs);
    offset=all.length;
    total=r.total||total;
    setListTotal(all.length,total);
    if(r.done)break;
  }
  setListTotal(all.length,all.length,true);
}
function setListTotal(now,total,done){
  const el=$('list-count');
  if(el)el.textContent=(done||now>=total)?(now+'首'):(now+' / '+total+'首，加载中…');
}

// 渲染歌曲列表(点歌→整个列表成为队列,从这首开始放)
// 2000+首一次性塞进DOM会把Safari卡死,所以分批渲染:先出80首,往下滚再续
const CHUNK=80;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderSongList(songs,title,queue,editable,onBack,playAllText){
  if(!songs.length){$('lp-body').innerHTML='<div class="hint">'+title+'：空的</div>';return;}
  $('lp-body').innerHTML='<div style="display:flex;align-items:center;gap:8px;padding:4px 2px 12px;">'+
    '<span id="pl-back" style="font-size:20px;color:#5a6068;">‹</span>'+
    '<span style="font-size:17px;font-weight:700;">'+esc(title)+'</span>'+
    '<span id="list-count" style="font-size:12px;color:#9298a0;">'+songs.length+'首</span></div>'+
    (playAllText?playAllRow(playAllText,songs.length+' 首'):'')+
    '<div id="song-rows"></div><div class="more-tip" id="more-tip"></div>';
  $('pl-back').onclick=()=>{if(onBack)onBack();else renderMine();};
  if(playAllText)$('play-all').onclick=()=>{setQueue(songs,0);expand();};
  const rows=$('song-rows'),tip=$('more-tip');
  let shown=0;
  function chunk(){
    const end=Math.min(shown+CHUNK,songs.length);
    let h='';
    for(let i=shown;i<end;i++){
      const s=songs[i];
      const cv=editable&&s.cover?'<img src="'+esc(s.cover)+'" style="width:40px;height:40px;border-radius:7px;object-fit:cover;flex-shrink:0;">':'';
      h+='<div class="res" data-i="'+i+'"><div style="width:26px;text-align:center;color:#b0b6be;font-size:13px;flex-shrink:0;">'+(i+1)+'</div>'+cv+
         '<div class="i"><div class="nm">'+esc(s.name)+'</div><div class="ar">'+esc(s.artist)+'</div></div>'+
         (editable?'<div class="edit" data-edit="'+i+'"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></div>':'')+
         '<div class="go" data-add="'+i+'">＋</div></div>';
    }
    rows.insertAdjacentHTML('beforeend',h);
    shown=end;
    tip.textContent=shown<songs.length?('已显示 '+shown+' / '+songs.length+'，继续下滑'):(songs.length>CHUNK?'到底啦':'');
  }
  chunk();
  // 事件委托:一个监听器管全部,不再给每行挂两个
  rows.onclick=e=>{
    const ed=e.target.closest('[data-edit]');
    if(ed){e.stopPropagation();openEditor(songs[+ed.dataset.edit],()=>openList('/api/music/my/cloud','音乐网盘',true));return;}
    const add=e.target.closest('[data-add]');
    if(add){e.stopPropagation();addNext(queue[+add.dataset.add]);return;}
    const row=e.target.closest('.res[data-i]');
    if(row){setQueue(queue,+row.dataset.i);expand();}
  };
  const body=$('lp-body');
  body.onscroll=()=>{
    if(shown>=songs.length)return;
    if(body.scrollTop+body.clientHeight>=body.scrollHeight-400)chunk();
  };
}

// 分批渲染歌曲行（歌手页/专辑页复用）
function fillRows(songs,queue){
  const rows=$('song-rows'),tip=$('more-tip');
  if(!rows)return;
  let shown=0;
  function chunk(){
    const end=Math.min(shown+CHUNK,songs.length);
    let h='';
    for(let i=shown;i<end;i++){
      const s=songs[i];
      h+='<div class="res" data-i="'+i+'"><div style="width:26px;text-align:center;color:#b0b6be;font-size:13px;flex-shrink:0;">'+(i+1)+'</div>'+
         '<div class="i"><div class="nm">'+esc(s.name)+'</div><div class="ar">'+esc(s.artist)+(s.album?(' · '+esc(s.album)):'')+'</div></div>'+
         '<div class="go" data-add="'+i+'">＋</div></div>';
    }
    rows.insertAdjacentHTML('beforeend',h);shown=end;
    if(tip)tip.textContent=shown<songs.length?('已显示 '+shown+' / '+songs.length+'，继续下滑加载'):'';
  }
  chunk();
  rows.onclick=e=>{
    const add=e.target.closest('[data-add]');
    if(add){e.stopPropagation();addNext(queue[+add.dataset.add]);return;}
    const row=e.target.closest('.res[data-i]');
    if(row){setQueue(queue,+row.dataset.i);expand();}
  };
  const body=$('lp-body');
  body.onscroll=()=>{
    if(shown>=songs.length)return;
    if(body.scrollTop+body.clientHeight>=body.scrollHeight-400)chunk();
  };
}

async function primeRankEntry(){

// 带超时的 fetch：网慢的时候不至于一直吊着最后报错
function fetchT(url,ms){
  return Promise.race([
    fetch(url).then(r=>r.json()),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms||12000))
  ]);
}
// 锁屏和控制中心的播放控件：切到别的软件、锁屏之后也能看见歌名、能暂停切歌
function setMediaSession(s){
  if(!('mediaSession' in navigator))return;
  try{
    // 网易云给的封面是 http 的，锁屏/灵动岛那边不收混合内容，必须换成 https。
    // 顺便用 param 直接要对应尺寸的图，别让系统去下原图。
    const cov=(u,px)=>u.replace(/^http:\/\//,'https://').split('?')[0]+'?param='+px+'y'+px;
    const art=s.cover?[96,192,384,512].map(px=>(
      {src:cov(s.cover,px),sizes:px+'x'+px,type:'image/jpeg'})):[];
    navigator.mediaSession.metadata=new MediaMetadata({
      title:s.name||'',artist:s.artist||'',album:s.album||'',artwork:art});
    navigator.mediaSession.setActionHandler('play',()=>doResume());
    navigator.mediaSession.setActionHandler('pause',()=>doPause());
    navigator.mediaSession.setActionHandler('nexttrack',()=>playNext());
    navigator.mediaSession.setActionHandler('previoustrack',()=>playPrev());
    navigator.mediaSession.setActionHandler('seekto',e=>{
      if(e.seekTime==null)return;
      const g=curSeg();
      audio.currentTime=(g?g.start:0)+e.seekTime;});
  }catch(e){}
  updPositionState();
}
// 锁屏进度：不报的话会一直停在 0:00、看着像暂停
function updPositionState(){
  if(!('mediaSession' in navigator)||!navigator.mediaSession.setPositionState)return;
  try{
    const d=localDur()||audio.duration;
    if(!d||!isFinite(d))return;
    navigator.mediaSession.setPositionState({
      duration:d,playbackRate:audio.playbackRate||1,
      position:Math.min(localTime(),d)});
  }catch(e){}
}

// 把"现在在放什么"报给服务器，claude.ai 那边的凛靠这个知道你在听什么。
// 以前只有一起听时才报，单人听歌他就是瞎子，只能去翻网易云的最近播放
// （那玩意儿有延迟，而且记的是"播过"不是"正在播"）。现在一直报。
let npLast=0,npLastKey='';

  npLastKey=key;npLast=t;
  fetch('/api/music/listen/now',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({song:{name:cur.name,artist:cur.artist,id:cur.id},
                         playing:!audio.paused})}).catch(()=>{});
}
function postNP(){

      song:cur?{name:cur.name,artist:cur.artist,cover:cur.cover||'',id:cur.id}:null,
      playing:!audio.paused&&!!cur,
      pct:audio.duration?Math.round(audio.currentTime/audio.duration*100):0,
      cur:fmt(audio.currentTime||0),rem:'-'+fmt((audio.duration||0)-(audio.currentTime||0))},'*');
  }catch(e){}
}

// 上报给网易云：听歌排行、累计听歌首数、累计听歌时长都靠它。
// 每首歌只报一次，报的是你真实听了多少秒（听完就是整首时长）。
let scrobbleSong=null,scrobbleDone=false;
function doScrobble(song,sec){
  if(!song||!song.id)return;
  sec=Math.round(sec||0);
  if(sec<30)return;                     // 听不到30秒不算，跟网易云一个规矩
  fetch('/api/music/scrobble',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:song.id,seconds:sec,source_id:curSourceId||''})}).catch(()=>{});
}
// 换歌/离开时，把上一首实际听了多久结算掉
function flushScrobble(){
  if(scrobbleSong&&!scrobbleDone){
    const played=audio.currentTime||0,dur=audio.duration||0;
    if(played>=30&&(played>=dur*0.5||played>=60))doScrobble(scrobbleSong,played);
  }
  scrobbleSong=null;scrobbleDone=false;
}
// 页面被关掉/切走时也结算一次，别漏

// ── 音质模式：单曲直连，要母带 ──
async function soloPlay(sg,lite){
  if(!sg)return;
  // ⚠️ 整个函数在设好 src、调完 play() 之前，一个 await 都不许有。
  // 装到桌面的 PWA 里 iOS 是严格的：你点下去那一下之后中间只要隔了等待，
  // 授权就作废，之后 play() 会出现"状态全绿、时钟不走"。Safari 网页里宽限，PWA 里不宽限。
  // 所以直接把 src 指向我们自己的服务器，由它去网易云取链接再 302 跳过去——
  // 播放器自己走完全程，JS 不参与，也就没有等待这回事。
  const my=++playToken;
  userPaused=false;
  segs=[];segIdx=-1;hlsReady=false;
  flushScrobble();
  cur=sg;
  const i=queue.findIndex(x=>String(x.id)===String(sg.id));
  if(i>=0)qIndex=i;
  $('scr-nm').textContent=sg.name;$('scr-ar').textContent=sg.artist;$('scr-al').textContent=sg.album||'';
  $('b-title').textContent=sg.name;$('b-artist').textContent=sg.artist;
  if(lyView)setTimeout(setLyTitle,0);
  document.querySelector('.b-follow').style.display='none';
  if(sg.cover){$('scr-cover').src=sg.cover;$('mini-cover').src=sg.cover;}
  $('mini-nm').textContent=sg.name;$('mini-ar').textContent=sg.artist;
  $('p-fill').style.width='0%';$('p-dot').style.left='0%';$('scr-fill').style.width='0%';
  $('p-cur').textContent='0:00';$('p-dur').textContent='0:00';
  lyrics=[];lastLy=-1;lyHideSeek();
  loadLyric(sg.id);
  // 同步设 src + 播放，中间没有任何等待
  audio.src='/api/music/seg?id='+sg.id+(lite?'':'&hi=1');
  audio.preload='auto';
  audio.play().catch(playBlocked);
  // 音质标签是附带信息，晚一点问，绝不挡播放
  fetch('/api/music/url?id='+sg.id+(lite?'&mp3=1':'')).then(r=>r.json()).then(r=>{
    if(my!==playToken||!r||!r.ok)return;
    if(!lite){urlCache[sg.id]=r.url;qualityCache[sg.id]=r.quality||'';}
    setModeLabel();
  }).catch(()=>{});
  if(my!==playToken)return;
  refreshMini();syncHeart(sg.id);setMediaSession(sg);postNP();
  scrobbleSong=sg;scrobbleDone=false;
  postNow(true);
}
// 底下那行字：既显示音质，也是模式开关
function setModeLabel(tmp){
  const el=$('prog-sub');if(!el)return;
  if(tmp){el.textContent=tmp;return;}

  el.textContent=(q?q+' · ':'')+(hlsMode?'连播':'单曲');

function toggleMode(){
  const keep=localTime();          // 先记住现在放到哪了，再切模式（顺序反了就会从头放）
  hlsMode=!hlsMode;
  toast(hlsMode?'连播模式 · 锁屏也会一首接一首':'音质模式 · 母带，后台放完这首会停');
  const sg=cur;
  if(!sg){setModeLabel();return;}
  if(hlsMode){
    const i=queue.findIndex(x=>String(x.id)===String(sg.id));
    startStream(i<0?0:i,!audio.paused);
    const back=()=>{audio.removeEventListener('loadedmetadata',back);
      try{audio.currentTime=(curSeg()?curSeg().start:0)+keep;}catch(e){}};
    audio.addEventListener('loadedmetadata',back);
  }else{
    soloPlay(sg).then(()=>{try{audio.currentTime=keep;}catch(e){}});
  }
  setModeLabel();
}

// 点某一首歌：在当前这张列表里就直接跳过去，不在就换一张列表
function playSong(sg){
  if(!sg)return;
  restoreMode();
  if(!hlsMode){soloPlay(sg);return;}
  const inWin=segs.findIndex(g=>String(g.id)===String(sg.id));
  if(inWin>=0&&hlsReady){
    warm(segs[inWin].id);
    audio.currentTime=segs[inWin].start;
    audio.play().catch(()=>{});
    onSegChanged(inWin);
    return;
  }
  let idx=queue.findIndex(x=>String(x.id)===String(sg.id));
  if(idx<0){
    // 队列里没有就插到当前这首后面，别把人家整条队列洗掉
    if(queue.length){idx=Math.min(qIndex+1,queue.length);queue.splice(idx,0,sg);}
    else{queue=[sg];idx=0;}
  }
  startStream(idx,true);
}
// 红心状态同步
let likedSet=null,likedLoading=null,likedTries=0;
function loadLiked(){
  // 只在没数据时拉，最多重试2次。以前"空了就下次再试"，
  // 结果每放一首歌都去翻一遍两千多首的歌单，把后端堵死了。
  if(likedLoading)return likedLoading;
  if(likedTries>=2)return Promise.resolve();
  likedTries++;
  likedLoading=fetch('/api/music/liked').then(r=>r.json()).then(r=>{
    const ids=(r&&r.ids)||[];
    likedSet=new Set(ids.map(String));
    if(!ids.length)console.log('红心列表空:',r&&r.error);
  }).catch(()=>{}).finally(()=>{likedLoading=null;});
  return likedLoading;
}

    // 手指按住就回到线条模式，按多久都是线条模式
    if(lyResting||lySeeking){lyResting=false;lySeeking=true;
      document.querySelectorAll('.ly-line.rest').forEach(el=>el.classList.remove('rest'));
      lyShowSeek(false);}
  },{passive:true});
  sc.addEventListener('touchmove',()=>{lyMoved=true;},{passive:true});
  sc.addEventListener('touchend',()=>{
    touching=false;lastTouchEnd=Date.now();
    clearTimeout(lyIdleT);

  },{passive:true});
  sc.addEventListener('touchcancel',()=>{touching=false;lastTouchEnd=Date.now();},{passive:true});
  sc.addEventListener('scroll',()=>{
    if(!lyrics.length)return;

    if(!touching&&Date.now()-lastTouchEnd>1000)return;

  },{passive:true});
  // 点三角 → 跳到这句
  $('ly-seek-go').addEventListener('click',e=>{

    if(lyPick>=0&&lyrics[lyPick]){

(function(){
  const bar=$('p-bar');let dragging=false;
  function ratio(x){const r=bar.getBoundingClientRect();return Math.min(1,Math.max(0,(x-r.left)/r.width));}
  function paint(p){$('p-fill').style.width=(p*100)+'%';$('p-dot').style.left=(p*100)+'%';
    const d=localDur();if(d)$('p-cur').textContent=fmt(p*d);}
  bar.addEventListener('pointerdown',e=>{
    if(!audio.duration&&!localDur())return;
    dragging=true;
    try{bar.setPointerCapture(e.pointerId);}catch(_){}
    paint(ratio(e.clientX));e.preventDefault();
  });
  bar.addEventListener('pointermove',e=>{if(dragging)paint(ratio(e.clientX));});
  function end(e){
    if(!dragging)return;dragging=false;
    const g=curSeg();
    // 拖完也可能把管道卡住，所以走同一条"跳完盯着"的路
    if(g)seekAndPlay(g.start+ratio(e.clientX)*g.dur,true);
    else if(audio.duration)seekAndPlay(ratio(e.clientX)*audio.duration,true);
  }
  bar.addEventListener('pointerup',end);
  bar.addEventListener('pointercancel',()=>{dragging=false;});
  // 拖动时别让 timeupdate 把点拽回去
  audio.addEventListener('timeupdate',()=>{if(dragging){/*拖动中不刷新*/}},true);
  window._pbarDragging=()=>dragging;
})();

function switchRoom(r){
  if(r===chatRoom){$('rm-mask').classList.remove('show');return;}
  chatRoom=r;
  try{localStorage.setItem('chat-room',r);}catch(e){}
  renderRoom();
  $('rm-mask').classList.remove('show');
  setSelMode(false);replyTo=null;$('reply-bar').classList.remove('show');
  chatLastTs=0;$('cv-msgs')._loaded=false;$('cv-msgs').innerHTML='';
  loadChatHistory();
}
$('rm-mcp').onclick=()=>switchRoom('mcp');
$('rm-app').onclick=()=>switchRoom('app');
$('rm-x').onclick=()=>$('rm-mask').classList.remove('show');
$('rm-mask').addEventListener('click',e=>{if(e.target===$('rm-mask'))$('rm-mask').classList.remove('show');});
$('cv-room-btn').onclick=()=>{renderRoom();$('rm-mask').classList.add('show');};
// 长按底下那个聊天按钮也能选
(function(){
  const el=$('mc-chat');let t=null,longed=false;
  const start=()=>{longed=false;clearTimeout(t);t=setTimeout(()=>{
    longed=true;renderRoom();$('rm-mask').classList.add('show');},600);};
  const stop=()=>clearTimeout(t);
  el.addEventListener('touchstart',start,{passive:true});
  ['touchend','touchmove','touchcancel'].forEach(e=>el.addEventListener(e,stop,{passive:true}));
  el.addEventListener('mousedown',start);
  ['mouseup','mouseleave'].forEach(e=>el.addEventListener(e,stop));
  el.addEventListener('click',e=>{if(longed){e.preventDefault();e.stopPropagation();longed=false;}},true);
})();
renderRoom();

function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// 一条消息 = 勾选圈 + 头像 + （气泡 [+ 引用框]）
function addMsg(text,me,m){
  m=m||{};
  const item=document.createElement('div');
  item.className='cv-item';
  item.dataset.id=m.id||'';
  const av=me?(window._uav||''):(window._aav||'');
  const q=m.quote?('<div class="cv-quote">'+esc(m.quote.text)+'</div>'):'';
  item.innerHTML=
    '<div class="ck"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>'+
    '<div class="cv-row'+(me?' me':'')+'">'+
      '<div class="cv-av" style="background-image:url('+av+')"></div>'+
      '<div class="cv-col'+(me?' me':'')+'">'+
        '<div class="cv-bubble">'+esc(text)+'</div>'+q+
      '</div>'+
    '</div>';
  armMsg(item);
  $('cv-msgs').appendChild(item);
  const box=$('cv-msgs');box.scrollTop=box.scrollHeight;
}

// ── 长按一条消息 ──────────────────────────────────────────────
let popFor=null,selMode=false,replyTo=null;
function armMsg(item){
  let t=null,longed=false;
  const start=e=>{longed=false;clearTimeout(t);t=setTimeout(()=>{longed=true;openMsgPop(item);},550);};
  const stop=()=>clearTimeout(t);
  item.addEventListener('touchstart',start,{passive:true});
  ['touchend','touchmove','touchcancel'].forEach(ev=>item.addEventListener(ev,stop,{passive:true}));
  item.addEventListener('mousedown',start);
  ['mouseup','mouseleave'].forEach(ev=>item.addEventListener(ev,stop));
  item.addEventListener('click',e=>{
    if(longed){longed=false;e.preventDefault();e.stopPropagation();return;}
    if(selMode)toggleSel(item);
  });
}
function openMsgPop(item){
  if(selMode)return;
  popFor=item;
  const pop=$('msg-pop'),arr=$('msg-arrow');
  pop.classList.add('show');arr.classList.add('show');
  const b=item.querySelector('.cv-bubble').getBoundingClientRect();
  const w=pop.offsetWidth,h=pop.offsetHeight;
  let left=Math.round(b.left+b.width/2-w/2);
  left=Math.max(10,Math.min(left,window.innerWidth-w-10));
  let top=Math.round(b.top-h-10);
  const below=top<8;
  if(below)top=Math.round(b.bottom+10);
  pop.style.left=left+'px';pop.style.top=top+'px';
  const ax=Math.round(Math.max(left+12,Math.min(b.left+b.width/2-7.5,left+w-27)));
  arr.style.left=ax+'px';
  arr.style.top=(below?(top-8):(top+h))+'px';
  arr.style.transform=below?'rotate(180deg)':'none';
}
function closeMsgPop(){popFor=null;$('msg-pop').classList.remove('show');$('msg-arrow').classList.remove('show');}
document.addEventListener('pointerdown',e=>{
  if(!$('msg-pop').classList.contains('show'))return;
  if(e.target.closest('#msg-pop'))return;
  closeMsgPop();
},true);

$('mp-reply').onclick=()=>{
  if(!popFor)return;
  replyTo={id:popFor.dataset.id,text:popFor.querySelector('.cv-bubble').textContent};
  $('reply-tx').textContent=replyTo.text;
  $('reply-bar').classList.add('show');
  closeMsgPop();$('cv-text').focus();
};
$('reply-x').onclick=()=>{replyTo=null;$('reply-bar').classList.remove('show');};
$('mp-del').onclick=()=>{
  if(!popFor)return;
  const id=popFor.dataset.id,el=popFor;
  closeMsgPop();
  delMsgs([id]).then(()=>{try{el.remove();}catch(e){}});
};
$('mp-multi').onclick=()=>{
  const first=popFor;closeMsgPop();
  setSelMode(true);
  if(first)toggleSel(first);
};

// ── 多选 ──────────────────────────────────────────────────────
function setSelMode(on){
  selMode=on;
  $('play-page').classList.toggle('selmode',on);
  $('chat-view').classList.toggle('selmode',on);
  if(!on)document.querySelectorAll('.cv-item .ck.on').forEach(el=>el.classList.remove('on'));
  updSelCnt();
}
function toggleSel(item){
  const ck=item.querySelector('.ck');if(!ck)return;
  ck.classList.toggle('on');updSelCnt();
}
function selIds(){
  return [...document.querySelectorAll('.cv-item')]
    .filter(el=>el.querySelector('.ck.on')).map(el=>el.dataset.id).filter(Boolean);
}
function updSelCnt(){
  const n=selIds().length;
  $('sel-cnt').textContent=n?('删除 '+n+' 条'):'删除';
  $('sel-del').disabled=!n;
}
$('sel-del').onclick=async()=>{
  const ids=selIds();if(!ids.length)return;
  await delMsgs(ids);
  document.querySelectorAll('.cv-item').forEach(el=>{if(ids.indexOf(el.dataset.id)>=0)el.remove();});
  setSelMode(false);
};
async function delMsgs(ids){
  try{await fetch('/api/music/chat/delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ids:ids})});}catch(e){}
}
async function loadChatHistory(){
  if($('cv-msgs')._loaded)return;
  try{
    const r=await fetch('/api/music/chat/history?room='+chatRoom).then(r=>r.json());
    if(r.ok&&r.messages){$('cv-msgs').innerHTML='';r.messages.forEach(m=>addMsg(m.text,m.me,m));
      if(r.messages.length)chatLastTs=Math.max(...r.messages.map(m=>m.ts||0));}
  }catch(e){}
  $('cv-msgs')._loaded=true;
}
async function sendChat(){
  const t=$('cv-text').value.trim();if(!t)return;
  $('cv-text').value='';
  const rt=replyTo;
  addMsg(t,true,rt?{quote:{text:rt.text}}:null);
  replyTo=null;$('reply-bar').classList.remove('show');
  // 存 + 触发凛回复(走app聊天后端)
  const ctx=cur?('（正在一起听：'+cur.name+' - '+cur.artist+'）'):'';
  try{
    const r=await fetch('/api/music/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:t,room:chatRoom,reply_to:rt?rt.id:null,song:cur?{name:cur.name,artist:cur.artist}:null})}).then(r=>r.json());
    if(r.ok&&r.reply)addMsg(r.reply,false,{});
  }catch(e){}
}
$('cv-send').onclick=sendChat;
$('cv-text').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});

// 轮询收新消息(AI通过MCP push的,一起听时)
let chatLastTs=0;
async function pollChat(){
  if(!$('play-page').classList.contains('listening'))return;
  try{
    const r=await fetch('/api/music/chat/history?room='+chatRoom).then(r=>r.json());
    if(r.ok&&r.messages){
      const newMsgs=r.messages.filter(m=>!m.me&&m.ts>chatLastTs);
      if(chatLastTs>0&&newMsgs.length&&$('cv-msgs')._loaded){
        newMsgs.forEach(m=>addMsg(m.text,false,m));
      }
      if(r.messages.length)chatLastTs=Math.max(...r.messages.map(m=>m.ts||0));
    }
  }catch(e){}
}
setInterval(pollChat,8000);

// ── 改显示信息(封面/歌名/歌手)──
let edSong=null,edCover=null,edDone=null;
const edFile=document.createElement('input');
edFile.type='file';edFile.accept='image/*';edFile.style.display='none';
document.body.appendChild(edFile);
function openEditor(song,onDone){
  edSong=song;edCover=null;edDone=onDone;
  $('ed-name').value=song.name&&song.name!=='未知歌曲'?song.name:'';
  $('ed-artist').value=song.artist&&song.artist!=='未知歌手'?song.artist:'';
  const c=$('ed-cover');
  if(song.cover){c.style.backgroundImage='url('+song.cover+')';c.textContent='';}
  else{c.style.backgroundImage='';c.innerHTML='点这里<br>换封面';}
  $('ed-mask').classList.add('open');
}
function closeEditor(){$('ed-mask').classList.remove('open');edSong=null;edCover=null;}
$('ed-x').onclick=closeEditor;
$('ed-mask').addEventListener('click',e=>{if(e.target===$('ed-mask'))closeEditor();});
$('ed-cover').onclick=()=>edFile.click();
edFile.addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      // 压到 300x300 存，省流量
      const cv=document.createElement('canvas');cv.width=300;cv.height=300;
      const ctx=cv.getContext('2d');
      const side=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,300,300);
      edCover=cv.toDataURL('image/jpeg',0.82);
      const c=$('ed-cover');c.style.backgroundImage='url('+edCover+')';c.textContent='';
    };
    img.src=ev.target.result;
  };
  rd.readAsDataURL(f);
  edFile.value='';
});
$('ed-save').onclick=async()=>{
  if(!edSong)return;
  const body={id:edSong.id,name:$('ed-name').value.trim(),artist:$('ed-artist').value.trim()};
  if(edCover)body.cover=edCover;
  try{
    await fetch('/api/music/meta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    toast('改好了');
  }catch(e){toast('保存失败');}
  const cb=edDone;closeEditor();if(cb)cb();
};
$('ed-reset').onclick=async()=>{
  if(!edSong)return;
  try{
    await fetch('/api/music/meta/del',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:edSong.id})});
    toast('恢复原样了');
  }catch(e){}
  const cb=edDone;closeEditor();if(cb)cb();
};

let lastSeq=0,remoteTimer=null,remoteFirst=true;
async function pollRemote(){
  try{
    const r=await fetch('/api/music/remote').then(r=>r.json());const c=r.command;
    // 页面刚打开时服务器上往往还躺着一条旧指令（上次推的歌）。
    // 第一次只记下号码，不执行——否则一进来就会自动重放那首歌，
    // 而且因为不是手点的，iOS 不许出声，看上去就是"有歌但放不出来"。
    if(remoteFirst){remoteFirst=false;if(c&&c.seq)lastSeq=c.seq;schedRemote();return;}
    if(c&&c.seq&&c.seq!==lastSeq){lastSeq=c.seq;
      if(c.action==='play'&&c.id){playSong({id:c.id,name:c.name,artist:c.artist,cover:c.cover});expand();}
      else if(c.action==='stop'||c.action==='pause'){doPause();}
      else if(c.action==='resume'){doResume();}
      else if(c.action==='next')playNext();
      else if(c.action==='prev')playPrev();
    }
  }catch(e){}
  try{pollInvite();}catch(e){}   // 顺路把邀请也看一眼，别单开一条容易被冻住的线
  schedRemote();
}
function schedRemote(){
  clearTimeout(remoteTimer);
  // 一起听的时候勤快点，平时省着来
  remoteTimer=setTimeout(pollRemote,$('play-page').classList.contains('listening')?2000:6000);
}
schedRemote();
// 从后台回来：定时器被系统冻过，立刻补拉一次，攒下的指令不丢
// 从后台回来就把两条都补一次。
// iOS 把页面冻起来之后再唤醒，走的不一定是 visibilitychange，
// 也可能是 pageshow 或 focus，所以三个都听着。
function wakeUp(){
  if(document.hidden)return;
  pollRemote();
  try{pollInvite();}catch(e){}
}
document.addEventListener('visibilitychange',wakeUp);
window.addEventListener('pageshow',wakeUp);
window.addEventListener('focus',wakeUp);

// 开屏唱片：首页数据到了就淡出；最多转 6 秒，免得网络卡住一直挡着
function hideSplash(){
  const el=document.getElementById('splash');
  if(!el||el.classList.contains('gone'))return;
  el.classList.add('gone');
  setTimeout(()=>{try{el.remove();}catch(e){}},600);
}
setTimeout(hideSplash,2200);   // 兜底：最多挡 2.2 秒，网络再慢也不许它赖着

showTab('mine');
