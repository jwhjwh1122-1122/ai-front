<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>一起听</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans",sans-serif;
  background:linear-gradient(180deg,#fbfcfd,#eef1f4);color:#2b2f36;overflow:hidden;position:fixed;inset:0;display:flex;flex-direction:column;}
.page{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 22px calc(env(safe-area-inset-bottom) + 14px);
  transition:transform .34s cubic-bezier(.3,.7,.3,1);background:linear-gradient(180deg,#fbfcfd,#eef1f4);}
#play-page{z-index:2;}
#play-page.hid{transform:translateY(100%);}
.top{display:flex;align-items:center;justify-content:space-between;height:44px;flex-shrink:0;}
.top .down{width:30px;height:30px;color:#3a3f47;display:grid;place-items:center;background:none;border:none;padding:0;}
.top .down svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.top .ttl{font-size:16px;font-weight:500;color:#2b2f36;}
.top .share{width:24px;height:24px;color:#3a3f47;}
.together{position:relative;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:22px 0 0;}
.tg-buds{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:200px;height:122px;pointer-events:none;overflow:visible;z-index:0;}
.tg-faces{display:flex;position:relative;z-index:2;}
.tg-face{width:56px;height:56px;border-radius:50%;background:#d8dce2 center/cover no-repeat;border:none;box-shadow:0 2px 8px rgba(60,70,90,.16);}
.tg-face:last-child{margin-left:0;}
.tg-tip{position:relative;z-index:2;margin-top:16px;font-size:12px;color:#aeb4bc;letter-spacing:.2px;white-space:nowrap;}
.ipod-box{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px 0 0;}
.ipod{width:min(66vw,244px);height:auto;max-height:100%;aspect-ratio:264/446;padding:3% 3.3%;border-radius:8.5% / 5%;position:relative;
  background:linear-gradient(150deg,#ffffff 0%,#f8f9fa 22%,#eaecee 58%,#d8dbdf 100%);
  box-shadow:0 3px 3px rgba(255,255,255,1) inset,-3px 0 7px rgba(255,255,255,.85) inset,
    0 -5px 12px rgba(165,172,184,.55) inset,4px 5px 9px rgba(165,172,184,.4) inset,
    0 28px 48px -20px rgba(50,60,80,.55),0 12px 24px -12px rgba(50,60,80,.4);
  display:flex;flex-direction:column;z-index:1;}
.screen{margin-top:5.5%;border-radius:4px;overflow:hidden;border:1px solid #a8adb6;background:#e8ebee;box-shadow:0 1px 3px rgba(0,0,0,.22) inset,0 1px 0 rgba(255,255,255,.6);}
.scr-top{display:flex;align-items:center;justify-content:space-between;padding:3px 6px;background:linear-gradient(#e2e5e9,#c7ccd2);border-bottom:1px solid #a8adb6;}
.scr-top b{font-size:8.5px;font-weight:600;color:#40454d;}
.scr-top .r{display:flex;align-items:center;gap:4px;}
.scr-top .pz{color:#4a90d9;font-size:7px;letter-spacing:-1px;}
.scr-top .bt{width:14px;height:8px;border:1px solid #5a6068;border-radius:2px;padding:1px;position:relative;}
.scr-top .bt::after{content:"";display:block;height:100%;width:72%;background:#5cb85c;border-radius:1px;}
.scr-top .bt::before{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:2px;height:4px;background:#5a6068;border-radius:0 1px 1px 0;}
.scr-body{display:flex;gap:7px;padding:7px;background:#f5f7f8;}
.scr-cover{width:33%;aspect-ratio:1;border-radius:2px;object-fit:cover;background:#d5dae0;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.15);}
.scr-meta{flex:1;min-width:0;padding-top:1px;}
.scr-meta .nm{font-size:11px;font-weight:700;color:#20262c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.scr-meta .ar{font-size:9.5px;color:#525860;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.scr-meta .al{font-size:8.5px;color:#8a9098;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.scr-prog{display:flex;align-items:center;gap:4px;padding:0 7px 7px;background:#f5f7f8;font-size:7px;color:#6a7078;}
.scr-track{flex:1;height:7px;border-radius:4px;background:linear-gradient(#d2d6da,#e2e5e8);border:1px solid #b5bac0;overflow:hidden;box-shadow:0 1px 1px rgba(0,0,0,.08) inset;}
.scr-fill{height:100%;width:0%;background:linear-gradient(#8fc4f0,#4a90d9);border-radius:3px;box-shadow:0 -1px 1px rgba(255,255,255,.3) inset;}
.wheel-box{flex:1;display:flex;align-items:center;justify-content:center;}
.wheel{width:65%;aspect-ratio:1;border-radius:50%;position:relative;background:radial-gradient(circle at 50% 30%,#f4f5f6 0%,#e0e3e6 32%,#c8ccd1 58%,#b2b7bd 82%,#a4a9b1 100%);box-shadow:0 5px 14px rgba(70,78,95,.4),0 2px 0 rgba(255,255,255,1) inset,0 -5px 12px rgba(120,128,142,.5) inset,0 5px 10px rgba(255,255,255,.85) inset;display:grid;place-items:center;}
.wheel::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 26%,rgba(255,255,255,.65),transparent 46%);pointer-events:none;}
.wheel::after{content:"";position:absolute;inset:6%;border-radius:50%;box-shadow:0 2px 5px rgba(100,108,122,.28) inset,0 -2px 4px rgba(255,255,255,.7) inset,0 0 0 1px rgba(150,156,166,.18);pointer-events:none;}
.wheel .menu{position:absolute;top:8%;font-size:8.5px;font-weight:600;color:#868b93;letter-spacing:1.6px;z-index:1;}
.wheel .wi{position:absolute;color:#7d828b;z-index:1;}
.wheel .wi svg{width:14px;height:14px;fill:currentColor;}
.wheel .wi.prev{left:11%;top:50%;transform:translateY(-50%);}
.wheel .wi.next{right:11%;top:50%;transform:translateY(-50%);}
.wheel .wi.play{bottom:9.5%;}
.wheel .center{width:39%;aspect-ratio:1;border-radius:50%;border:none;z-index:1;background:radial-gradient(circle at 50% 34%,#ffffff 0%,#f0f2f4 52%,#dadde1 100%);box-shadow:0 3px 8px rgba(90,100,120,.38),0 2px 0 rgba(255,255,255,1) inset,0 -3px 6px rgba(150,156,168,.4) inset;}
.wbtn{position:absolute;width:30%;height:30%;background:none;border:none;}
.wbtn.m{top:0;left:35%;} .wbtn.p{left:0;top:35%;} .wbtn.n{right:0;top:35%;} .wbtn.y{bottom:0;left:35%;}
.below{flex-shrink:0;padding-top:24px;}
.b-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;}
.b-title{font-size:20px;font-weight:700;color:#20262c;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.b-artist{font-size:13px;color:#8a9098;margin-top:6px;display:flex;align-items:center;gap:7px;}
.b-follow{font-size:11px;color:#8a9098;border:1px solid #d5dae0;border-radius:9px;padding:1px 8px;}
.b-social{display:flex;align-items:center;gap:18px;flex-shrink:0;}
.b-heart{color:#9298a0;background:none;border:none;}
.b-heart svg path{fill:none;stroke:currentColor;stroke-width:1.7;}
.b-heart.liked{color:#ec4141;}
.b-heart.liked svg path{fill:currentColor;stroke:none;}
.b-heart svg{width:26px;height:26px;fill:currentColor;}
/* 单人显单颗,一起听显双人红心 */
.heart-double{display:none;}
#play-page.listening .heart-single{display:none;}
#play-page.listening .heart-double{display:block;width:30px;height:28px;}
.b-cmt{width:26px;height:26px;color:#5a6068;background:none;border:none;}
.chat-view{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 152px);bottom:80px;display:none;flex-direction:column;padding:0 18px;}
.chat-view.on{display:flex;}
.cv-msgs{flex:1;overflow-y:auto;scrollbar-width:none;padding:8px 0;display:flex;flex-direction:column;gap:12px;}
.cv-msgs::-webkit-scrollbar{display:none;}
.cv-row{display:flex;gap:8px;max-width:82%;}
.cv-row.me{align-self:flex-end;flex-direction:row-reverse;}
.cv-av{width:34px;height:34px;border-radius:50%;background:#d8dce2 center/cover no-repeat;flex-shrink:0;}
.cv-bubble{padding:9px 13px;border-radius:15px;font-size:15px;line-height:1.4;color:#20262c;background:#fff;box-shadow:0 1px 3px rgba(60,70,90,.08);}
.cv-row.me .cv-bubble{background:#d5e8fb;}
.cv-input{display:flex;gap:8px;padding:10px 0;flex-shrink:0;}
.cv-input input{flex:1;padding:11px 15px;border-radius:20px;border:none;background:#e9ecef;font-size:15px;outline:none;color:#2b2f36;}
.cv-input button{padding:0 18px;border-radius:20px;border:none;background:#ec4141;color:#fff;font-size:14px;font-weight:600;}
.mc-switch{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;background:#e9ecef;border-radius:22px;padding:3px;gap:2px;z-index:4;}
.mc-btn{width:52px;height:36px;border:none;background:none;border-radius:19px;display:grid;place-items:center;color:#8a9098;}
.mc-btn svg{width:22px;height:22px;}
.mc-btn.on{background:#fff;color:#2b2f36;box-shadow:0 1px 4px rgba(60,70,90,.12);}
.prog{display:flex;align-items:center;gap:10px;font-size:11px;color:#9298a0;margin-top:2px;}
.prog .bar{flex:1;height:2px;background:#d8dce2;border-radius:2px;position:relative;cursor:pointer;}
.prog .bar .f{position:absolute;left:0;top:0;height:100%;background:#8a9098;border-radius:2px;}
.prog .bar .dot{position:absolute;top:50%;left:0%;width:10px;height:10px;border-radius:50%;background:#fff;border:1px solid #b0b6be;transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.15);}
.prog-sub{text-align:center;font-size:11px;color:#b0b6be;margin-top:8px;}
.ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:22px;margin-bottom:52px;padding:0 2px;}
.cb{background:none;border:none;color:#3a3f47;display:grid;place-items:center;}
.cb svg{fill:currentColor;}
.cb.mode svg,.cb.list svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.cb.side svg{width:30px;height:30px;}
.cb.main svg{width:52px;height:52px;}
.lyric-view{position:absolute;inset:0;background:linear-gradient(180deg,#fbfcfd,#eef1f4);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 52px) 22px calc(env(safe-area-inset-bottom) + 18px);z-index:3;}
.lyric-view.on{display:flex;}
.ly-scroll{flex:1;overflow-y:auto;text-align:center;padding:16vh 8px 26vh;scrollbar-width:none;}
.ly-scroll::-webkit-scrollbar{display:none;}
.ly-line{font-size:16px;color:#b6bcc4;line-height:1.5;padding:12px 6px;transition:all .3s;}
.ly-line.cur{font-size:19px;color:#20262c;font-weight:700;}
.ly-line .tr{font-size:12px;color:#9298a0;font-weight:400;margin-top:4px;}
.ly-line.cur .tr{color:#5a6068;}
.ly-empty{color:#b0b6be;font-size:14px;padding-top:36vh;}
#list-page{z-index:1;padding-bottom:0;}
.lp-top{display:flex;align-items:center;gap:14px;height:44px;flex-shrink:0;}
.lp-tab{font-size:19px;font-weight:700;color:#b6bcc4;}
.lp-tab.on{color:#20262c;}
.lp-search{margin:14px 0;position:relative;}
.lp-search input{width:100%;padding:11px 14px 11px 40px;border-radius:20px;border:none;background:#e9ecef;font-size:15px;outline:none;color:#2b2f36;}
.lp-search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9298a0;width:18px;height:18px;}
.lp-body{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:80px;}
.lp-body::-webkit-scrollbar{display:none;}
.mine-item{display:flex;align-items:center;gap:13px;padding:11px 2px;}
.mine-item:active{opacity:.6;}
.mine-ic{width:46px;height:46px;border-radius:10px;background:#e9ecef;display:grid;place-items:center;color:#5a6068;flex-shrink:0;}
.mine-ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;}
.mine-tx{flex:1;min-width:0;}
.mine-tx .nm{font-size:16px;color:#20262c;}
.mine-tx .sub{font-size:12px;color:#9298a0;margin-top:3px;}
.res{display:flex;align-items:center;gap:11px;padding:9px 2px;}
.res:active{opacity:.6;}
.res img{width:44px;height:44px;border-radius:7px;object-fit:cover;background:#d8dce2;flex-shrink:0;}
.res .i{flex:1;min-width:0;}
.res .i .nm{font-size:15px;color:#20262c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.res .i .ar{font-size:12px;color:#9298a0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.res .go{color:#ec4141;font-size:22px;}
.hint{text-align:center;color:#b0b6be;font-size:13px;padding:30px;}
.mini{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);height:56px;border-radius:28px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);box-shadow:0 6px 20px -6px rgba(60,70,90,.3);display:none;align-items:center;gap:11px;padding:6px 12px 6px 6px;z-index:5;}
.mini.show{display:flex;}
.mini img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#d8dce2;animation:spin 12s linear infinite;animation-play-state:paused;}
.mini.playing img{animation-play-state:running;}
@keyframes spin{to{transform:rotate(360deg);}}
.mini .mt{flex:1;min-width:0;}
.mini .mt .nm{font-size:14px;color:#20262c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini .mt .ar{font-size:11px;color:#9298a0;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini .mp{width:34px;height:34px;color:#3a3f47;background:none;border:none;display:grid;place-items:center;}
.mini .mp svg{width:26px;height:26px;fill:currentColor;}
.mini .ml{width:30px;height:30px;color:#5a6068;background:none;border:none;}
.mini .ml svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;}
.queue-sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.34);display:none;align-items:flex-end;}
.queue-sheet.open{display:flex;}
.q-inner{width:100%;max-height:72vh;background:#f4f6f8;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;}
.q-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid #e4e7ea;}
.q-head b{font-size:16px;color:#20262c;}
.q-head .q-n{font-size:13px;color:#9298a0;margin-left:4px;}
.q-close{background:none;border:none;font-size:18px;color:#9298a0;}
.q-list{flex:1;overflow-y:auto;scrollbar-width:none;padding:4px 0;}
.q-list::-webkit-scrollbar{display:none;}
.q-item{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:10px;}
.q-item:active{background:#e9ecef;}
.q-item.cur .q-nm{color:#ec4141;}
.q-item.cur .q-ar{color:#ec4141;}
.q-song{flex:1;min-width:0;display:flex;align-items:baseline;}
.q-nm{font-size:15px;color:#20262c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;}
.q-ar{font-size:12px;color:#9298a0;white-space:nowrap;flex-shrink:0;max-width:40%;overflow:hidden;text-overflow:ellipsis;}
.q-del{background:none;border:none;font-size:15px;color:#c0c4ca;flex-shrink:0;padding:4px;}
.q-foot{padding:14px 18px;border-top:1px solid #e4e7ea;text-align:center;}
.q-foot span{font-size:14px;color:#5a6068;}
/* 邀请弹窗 */
.invite-mask{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:40px;}
.invite-mask.show{display:flex;}
.invite-card{background:#fff;border-radius:22px;padding:28px 24px 20px;width:100%;max-width:300px;text-align:center;box-shadow:0 20px 50px -12px rgba(0,0,0,.4);}
.invite-ic{font-size:44px;margin-bottom:12px;}
.invite-tx{font-size:16px;color:#20262c;font-weight:600;margin-bottom:22px;line-height:1.4;}
.invite-btns{display:flex;gap:12px;}
.invite-btns button{flex:1;padding:12px;border-radius:22px;border:none;font-size:15px;font-weight:600;}
.inv-no{background:#eef0f2;color:#8a9098;}
.inv-yes{background:#ec4141;color:#fff;}

/* 单人/一起听 排版切换 */
.together{display:none;}
.mc-switch{display:none;}
#play-page.listening .together{display:flex;}
#play-page.listening .ipod{width:min(47vw,196px);}
#play-page.listening .mc-switch{display:flex;}
/* 单人=原始排版(大iPod,原始间距),一起听才缩小加头像 */

</style>
</head>
<body>
<audio id="audio"></audio>
<div class="page" id="list-page">
  <div class="lp-top">
    <span class="lp-tab on" id="tab-mine" data-tab="mine">我的</span>
    <span class="lp-tab" id="tab-search" data-tab="search">搜索</span>
  </div>
  <div class="lp-search" id="search-box" style="display:none;">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input id="q" placeholder="搜歌名 / 歌手" enterkeyhint="search">
  </div>
  <div class="lp-body" id="lp-body"></div>
</div>
<div class="page" id="play-page">
  <div class="top">
    <button class="down" id="btn-down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="ttl" id="top-title">一起听</div>
    <button class="share" id="btn-together" style="background:none;border:none;padding:0;color:#3a3f47;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;"><path d="M7 4L3 8l4 4M3 8h13M17 20l4-4-4-4M21 16H8"/></svg></button>
  </div>
  <div class="together" id="together-bar">
    <svg class="tg-buds" viewBox="0 0 200 122" preserveAspectRatio="xMidYMin meet">
      <defs><linearGradient id="budG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2b2f36" stop-opacity="1"/>
        <stop offset="55%" stop-color="#2b2f36" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#2b2f36" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="M42 26 Q32 46 38 66 Q42 78 48 90" fill="none" stroke="url(#budG)" stroke-width="2" stroke-linecap="round"/>
      <path d="M158 26 Q168 46 162 66 Q158 78 152 90" fill="none" stroke="url(#budG)" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="42" cy="24" rx="4" ry="5.5" fill="#2b2f36" transform="rotate(-14 42 24)"/>
      <ellipse cx="158" cy="24" rx="4" ry="5.5" fill="#2b2f36" transform="rotate(14 158 24)"/>
    </svg>
    <div class="tg-faces">
      <div class="tg-face" id="tg-user"></div>
      <div class="tg-face" id="tg-ai"></div>
    </div>
    <div class="tg-tip" id="tg-tip">TA就在你身边，一起听了 0 分钟</div>
  </div>
  <div class="ipod-box">
    <div class="ipod" id="ipod-tap">
      <div class="screen">
        <div class="scr-top"><b>Now Playing</b><div class="r"><span class="pz" id="scr-pz">&#10074;&#10074;</span><span class="bt"></span></div></div>
        <div class="scr-body">
          <img class="scr-cover" id="scr-cover" src="" alt="">
          <div class="scr-meta"><div class="nm" id="scr-nm">还没有歌</div><div class="ar" id="scr-ar">去搜一首</div><div class="al" id="scr-al"></div></div>
        </div>
        <div class="scr-prog"><span id="scr-cur">0:00</span><div class="scr-track"><div class="scr-fill" id="scr-fill"></div></div><span id="scr-rem">0:00</span></div>
      </div>
      <div class="wheel-box"><div class="wheel">
        <span class="menu">MENU</span>
        <span class="wi prev"><svg viewBox="0 0 24 24"><path d="M18 5v14l-8-7zM8 5v14H6V5z"/></svg></span>
        <span class="wi next"><svg viewBox="0 0 24 24"><path d="M6 5v14l8-7zM16 5v14h2V5z"/></svg></span>
        <span class="wi play"><svg viewBox="0 0 24 24"><path d="M8 5v14l9-7z"/><path d="M4 5h1.5v14H4z"/></svg></span>
        <button class="center" id="w-center"></button>
        <button class="wbtn m" id="w-menu"></button><button class="wbtn p" id="w-prev"></button>
        <button class="wbtn n" id="w-next"></button><button class="wbtn y" id="w-play"></button>
      </div></div>
    </div>
  </div>
  <div class="below">
    <div class="b-head">
      <div style="min-width:0;flex:1;">
        <div class="b-title" id="b-title">还没有歌</div>
        <div class="b-artist"><span id="b-artist">向下收起，去搜一首</span><span class="b-follow" style="display:none">关注</span></div>
      </div>
      <div class="b-social">
        <button class="b-heart" id="btn-heart"><svg class="heart-single" viewBox="0 0 24 24"><path d="M12 20.3l-1.45-1.32C5.4 14.24 2 11.16 2 7.38 2 4.3 4.42 2 7.5 2c1.74 0 3.41.81 4.5 2.09C13.09 2.81 14.76 2 16.5 2 19.58 2 22 4.3 22 7.38c0 3.78-3.4 6.86-8.55 11.61L12 20.3z"/></svg><svg class="heart-double" viewBox="0 0 32 30"><defs><path id="bigH" transform="rotate(-25 13 16)" d="M13 24l-1.6-1.45C6.3 18 3 14.6 3 10.4 3 7 5.4 4.5 8.5 4.5c1.9 0 3.75.9 4.5 2.3C13.75 5.4 15.6 4.5 17.5 4.5 20.6 4.5 23 7 23 10.4c0 4.2-3.3 7.6-8.4 12.15L13 24z"/><clipPath id="clipBig"><use href="#bigH"/></clipPath></defs><use href="#bigH" fill="#ec4141"/><g clip-path="url(#clipBig)"><path transform="rotate(25 21 18)" d="M21 23l-1.1-1C16.5 18.7 14 16.3 14 13.4 14 11 15.7 9.3 17.9 9.3c1.36 0 2.66.63 3.1 1.6C21.44 9.93 22.74 9.3 24.1 9.3 26.3 9.3 28 11 28 13.4c0 2.9-2.5 5.3-6.9 9.6L21 23z" fill="none" stroke="#fff" stroke-width="2.4"/></g><path transform="rotate(25 21 18)" d="M21 23l-1.1-1C16.5 18.7 14 16.3 14 13.4 14 11 15.7 9.3 17.9 9.3c1.36 0 2.66.63 3.1 1.6C21.44 9.93 22.74 9.3 24.1 9.3 26.3 9.3 28 11 28 13.4c0 2.9-2.5 5.3-6.9 9.6L21 23z" fill="#ec4141"/></svg></button>
        <button class="b-cmt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></button>
      </div>
    </div>
    <div class="prog"><span id="p-cur">0:00</span><div class="bar" id="p-bar"><div class="f" id="p-fill"></div><div class="dot" id="p-dot"></div></div><span id="p-dur">0:00</span></div>
    <div class="prog-sub">无损音质</div>
    <div class="ctrl">
      <button class="cb mode" id="c-mode"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg></button>
      <button class="cb side" id="c-prev"><svg viewBox="0 0 24 24"><path d="M18 5v14l-9-7zM8 5v14H6V5z"/></svg></button>
      <button class="cb main" id="c-main"><svg viewBox="0 0 24 24" id="c-main-ic"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="cb side" id="c-next"><svg viewBox="0 0 24 24"><path d="M6 5v14l9-7zM16 5v14h2V5z"/></svg></button>
      <button class="cb list" id="c-list"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6l1 1M3 12h.01M3 18h.01"/></svg></button>
    </div>
  </div>
  <div class="chat-view" id="chat-view">
    <div class="cv-msgs" id="cv-msgs"></div>
    <div class="cv-input">
      <input id="cv-text" placeholder="就着这首歌，说点什么…" enterkeyhint="send">
      <button id="cv-send">发送</button>
    </div>
  </div>
  <div class="mc-switch">
    <button class="mc-btn on" id="mc-music"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button>
    <button class="mc-btn" id="mc-chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></button>
  </div>
  <div class="lyric-view" id="lyric-view"><div class="ly-scroll" id="ly-scroll"><div class="ly-empty">点一下回到播放</div></div></div>
</div>
<div class="queue-sheet" id="queue-sheet"></div>

<!-- 邀请弹窗 -->
<div class="invite-mask" id="invite-mask">
  <div class="invite-card">
    <div class="invite-ic">🎧</div>
    <div class="invite-tx" id="invite-tx">Claude 邀请你一起听</div>
    <div class="invite-btns">
      <button class="inv-no" id="inv-no">以后再说</button>
      <button class="inv-yes" id="inv-yes">一起听</button>
    </div>
  </div>
</div>
<div class="mini" id="mini">
  <img id="mini-cover" src="">
  <div class="mt"><div class="nm" id="mini-nm">—</div><div class="ar" id="mini-ar">—</div></div>
  <button class="mp" id="mini-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  <button class="ml"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
</div>
<script>

const $=id=>document.getElementById(id);const audio=$('audio');
let cur=null,lyrics=[],lyView=false,lastLy=-1,collapsed=false;
let queue=[],qIndex=-1,loopMode=0; // loopMode: 0列表循环 1单曲 2随机
function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0');}

// 播放队列
function setQueue(songs,startIndex){
  queue=songs.slice();qIndex=startIndex;
  playSong(queue[qIndex]);
}
function addNext(song){
  if(!queue.length){queue=[song];qIndex=0;playSong(song);return;}
  queue.splice(qIndex+1,0,song);
  toast(song.name+' 已加到下一首');
}
function playNext(){
  if(!queue.length)return;
  if(loopMode===1){playSong(queue[qIndex]);return;} // 单曲循环
  if(loopMode===2){qIndex=Math.floor(Math.random()*queue.length);} // 随机
  else{qIndex=(qIndex+1)%queue.length;} // 列表循环
  playSong(queue[qIndex]);
}
function playPrev(){
  if(!queue.length)return;
  qIndex=(qIndex-1+queue.length)%queue.length;
  playSong(queue[qIndex]);
}
function toast(msg){
  let t=document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';
    t.style.cssText='position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(40,44,52,.92);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:99;transition:opacity .3s;';
    document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity='0',1600);
}

// ── 页面切换 ──
function collapse(){collapsed=true;$('play-page').classList.add('hid');refreshMini();}
function expand(){collapsed=false;$('play-page').classList.remove('hid');refreshMini();}
$('btn-down').onclick=collapse;

// ── 我的/搜索 tab ──
function showTab(t,keep){
  document.querySelectorAll('.lp-tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));
  $('search-box').style.display=t==='search'?'block':'none';
  if(keep)return;
  if(t==='mine')renderMine();else{$('lp-body').innerHTML='<div class="hint">搜一首想听的歌</div>';setTimeout(()=>$('q').focus(),100);}
}
document.querySelectorAll('.lp-tab').forEach(x=>x.onclick=()=>showTab(x.dataset.tab));

async function renderMine(){
  $('lp-body').innerHTML='<div class="hint">加载中…</div>';
  const fixed=[
    {ic:'<path d="M4 6h16M4 12h16M4 18h10"/>',nm:'最近播放',act:'recent'},
    {ic:'<path d="M18 10a6 6 0 00-11.3-2A4.5 4.5 0 007 18h11a4 4 0 000-8z"/>',nm:'音乐网盘',act:'cloud'},
  ];
  let h='';
  // 拉歌单
  try{
    const r=await fetch('/api/music/my/playlists').then(r=>r.json());
    if(r.ok&&r.playlists.length){
      // 固定入口(最近/网盘)
      h+=fixed.map(it=>`<div class="mine-item" data-act="${it.act}"><div class="mine-ic"><svg viewBox="0 0 24 24">${it.ic}</svg></div><div class="mine-tx"><div class="nm">${it.nm}</div></div></div>`).join('');
      h+='<div style="font-size:12px;color:#9298a0;padding:16px 2px 6px;">我的歌单</div>';
      h+=r.playlists.map(p=>{
        const cover=p.cover?`<img src="${p.cover}" style="width:46px;height:46px;border-radius:10px;object-fit:cover;flex-shrink:0;">`:`<div class="mine-ic">♪</div>`;
        return `<div class="mine-item" data-pl="${p.id}" data-name="${p.name.replace(/"/g,'')}">${cover}<div class="mine-tx"><div class="nm">${p.name}</div><div class="sub">${p.count} 首</div></div></div>`;
      }).join('');
    }else{h+='<div class="hint">'+(r.error||'没拿到歌单')+'</div>';}
  }catch(e){h+='<div class="hint">出错：'+e+'</div>';}
  $('lp-body').innerHTML=h;
  document.querySelectorAll('.mine-item[data-pl]').forEach(el=>el.onclick=()=>openPlaylist(el.dataset.pl,el.dataset.name));
  document.querySelectorAll('.mine-item[data-act]').forEach(el=>el.onclick=()=>{
    const a=el.dataset.act;
    if(a==='recent')openList('/api/music/my/recent','最近播放');
    else if(a==='cloud')openList('/api/music/my/cloud','音乐网盘');
  });
}
// 打开歌单 → 显示里面的歌
async function openPlaylist(pid,name){
  $('lp-body').innerHTML='<div class="hint">加载歌单…</div>';
  showTab('mine',true);
  try{
    const r=await fetch('/api/music/playlist?id='+pid).then(r=>r.json());
    if(!r.ok){$('lp-body').innerHTML='<div class="hint">'+r.error+'</div>';return;}
    renderSongList(r.songs,name||r.name,r.songs);
  }catch(e){$('lp-body').innerHTML='<div class="hint">出错：'+e+'</div>';}
}
async function openList(url,name){
  $('lp-body').innerHTML='<div class="hint">加载…</div>';showTab('mine',true);
  try{
    const r=await fetch(url).then(r=>r.json());
    if(!r.ok){$('lp-body').innerHTML='<div class="hint">'+r.error+'</div>';return;}
    renderSongList(r.songs,name,r.songs);
  }catch(e){$('lp-body').innerHTML='<div class="hint">出错：'+e+'</div>';}
}
// 渲染歌曲列表(点歌→整个列表成为队列,从这首开始放)
function renderSongList(songs,title,queue){
  if(!songs.length){$('lp-body').innerHTML='<div class="hint">'+title+'：空的</div>';return;}
  let h='<div style="display:flex;align-items:center;gap:8px;padding:4px 2px 12px;"><span id="pl-back" style="font-size:20px;color:#5a6068;">‹</span><span style="font-size:17px;font-weight:700;">'+title+'</span><span style="font-size:12px;color:#9298a0;">'+songs.length+'首</span></div>';
  h+=songs.map((s,i)=>`<div class="res" data-i="${i}"><div style="width:22px;text-align:center;color:#b0b6be;font-size:13px;flex-shrink:0;">${i+1}</div><div class="i"><div class="nm">${s.name}</div><div class="ar">${s.artist}</div></div><div class="go" data-add="${i}">＋</div></div>`).join('');
  $('lp-body').innerHTML=h;
  $('pl-back').onclick=()=>renderMine();
  document.querySelectorAll('.res[data-i]').forEach(el=>{
    const i=+el.dataset.i;
    el.querySelector('.i').onclick=()=>{setQueue(queue,i);expand();};
    el.querySelector('[data-add]').onclick=(e)=>{e.stopPropagation();addNext(queue[i]);};
  });
}

// ── 搜索 ──
let searchTimer;
$('q').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(doSearch,400);});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
async function doSearch(){
  const q=$('q').value.trim();if(!q){$('lp-body').innerHTML='<div class="hint">搜一首想听的歌</div>';return;}
  $('lp-body').innerHTML='<div class="hint">搜索中…</div>';
  try{
    const r=await fetch('/api/music/search?q='+encodeURIComponent(q)).then(r=>r.json());
    if(!r.ok){$('lp-body').innerHTML='<div class="hint">'+r.error+'</div>';return;}
    if(!r.songs.length){$('lp-body').innerHTML='<div class="hint">没搜到</div>';return;}
    $('lp-body').innerHTML='';
    r.songs.forEach((s,i)=>{const d=document.createElement('div');d.className='res';
      d.innerHTML='<img src="'+(s.cover||'')+'" onerror="this.style.opacity=.25"><div class="i"><div class="nm">'+s.name+'</div><div class="ar">'+s.artist+'</div></div><div class="go" data-add>＋</div>';
      d.querySelector('.i').onclick=()=>{setQueue(r.songs,i);expand();};
      d.querySelector('[data-add]').onclick=(e)=>{e.stopPropagation();addNext(s);};
      $('lp-body').appendChild(d);});
  }catch(e){$('lp-body').innerHTML='<div class="hint">出错：'+e+'</div>';}
}

// ── 播放 ──
async function playSong(s){
  cur=s;$('scr-nm').textContent=s.name;$('scr-ar').textContent=s.artist;$('scr-al').textContent=s.album||'';
  $('b-title').textContent=s.name;$('b-artist').textContent=s.artist;
  document.querySelector('.b-follow').style.display='';$('top-title').textContent='我喜欢的音乐';
  if(s.cover){$('scr-cover').src=s.cover;$('mini-cover').src=s.cover;}
  $('mini-nm').textContent=s.name;$('mini-ar').textContent=s.artist;
  try{const r=await fetch('/api/music/url?id='+s.id).then(r=>r.json());if(!r.ok)return;audio.src=r.url;await audio.play().catch(()=>{});}catch(e){}
  loadLyric(s.id);refreshMini();syncHeart(s.id);
  // 一起听时上报当前歌
  if($('play-page').classList.contains('listening')){
    fetch('/api/music/listen/now',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({song:{name:s.name,artist:s.artist,id:s.id}})}).catch(()=>{});
  }
}
// 红心状态同步
let likedSet=null;
async function syncHeart(id){
  if(likedSet===null){
    try{const r=await fetch('/api/music/liked').then(r=>r.json());likedSet=new Set((r.ids||[]).map(String));}catch(e){likedSet=new Set();}
  }
  $('btn-heart').classList.toggle('liked',likedSet.has(String(id)));
}
function showQueue(){
  if(!queue.length){toast('还没有歌');return;}
  const cur_i=qIndex;
  let h='<div class="q-head"><div><b>当前播放</b> <span class="q-n">'+queue.length+'</span></div>'+
    '<button class="q-close" id="q-close">✕</button></div>';
  h+='<div class="q-list" id="q-list">';
  h+=queue.map((s,i)=>`<div class="q-item${i===cur_i?' cur':''}" data-i="${i}">
    <div class="q-song"><div class="q-nm">${s.name}</div><div class="q-ar"> - ${s.artist}</div></div>
    <button class="q-del" data-del="${i}">✕</button></div>`).join('');
  h+='</div>';
  h+='<div class="q-foot"><span id="q-mode">'+['列表循环','单曲循环','随机播放'][loopMode]+'</span></div>';
  $('queue-sheet').innerHTML='<div class="q-inner">'+h+'</div>';
  $('queue-sheet').classList.add('open');
  $('q-close').onclick=()=>$('queue-sheet').classList.remove('open');
  $('q-mode').onclick=()=>{$('c-mode').click();$('q-mode').textContent=['列表循环','单曲循环','随机播放'][loopMode];};
  document.querySelectorAll('.q-item').forEach(el=>{
    const i=+el.dataset.i;
    el.querySelector('.q-song').onclick=()=>{qIndex=i;playSong(queue[i]);showQueue();};
    el.querySelector('[data-del]').onclick=(e)=>{e.stopPropagation();
      queue.splice(i,1);if(i<qIndex)qIndex--;else if(i===qIndex&&queue.length){qIndex=qIndex%queue.length;playSong(queue[qIndex]);}
      if(!queue.length){$('queue-sheet').classList.remove('open');audio.pause();cur=null;}else showQueue();};
  });
  // 滚到当前歌
  setTimeout(()=>{const c=document.querySelector('.q-item.cur');if(c)c.scrollIntoView({block:'center'});},50);
}
function refreshMini(){const isCollapsed=$('play-page').classList.contains('hid');$('mini').classList.toggle('show',isCollapsed&&!!cur);}

async function loadLyric(id){
  lyrics=[];lastLy=-1;$('ly-scroll').innerHTML='<div class="ly-empty">加载歌词…</div>';
  try{const r=await fetch('/api/music/lyric?id='+id).then(r=>r.json());const trMap={};
    (r.tlyric||'').split('\n').forEach(l=>{const m=l.match(/\[(\d+):(\d+)[.:](\d+)\](.*)/);if(m){const t=(+m[1])*60+(+m[2])+(+m[3])/1000;trMap[Math.round(t)]=m[4].trim();}});
    (r.lyric||'').split('\n').forEach(l=>{const m=l.match(/\[(\d+):(\d+)[.:](\d+)\](.*)/);if(m){const t=(+m[1])*60+(+m[2])+(+m[3])/1000;const text=m[4].trim();if(text)lyrics.push({t,text,tr:trMap[Math.round(t)]||''});}});
    renderLyric();
  }catch(e){}
}
function renderLyric(){if(!lyrics.length){$('ly-scroll').innerHTML='<div class="ly-empty">这首歌没有歌词</div>';return;}
  $('ly-scroll').innerHTML=lyrics.map((l,i)=>'<div class="ly-line" data-i="'+i+'">'+l.text+(l.tr?'<div class="tr">'+l.tr+'</div>':'')+'</div>').join('');}
function updLyric(t){if(!lyrics.length)return;let i=0;for(let j=0;j<lyrics.length;j++){if(lyrics[j].t<=t)i=j;else break;}
  if(i===lastLy)return;lastLy=i;document.querySelectorAll('.ly-line').forEach((el,j)=>el.classList.toggle('cur',j===i));
  if(lyView){const el=document.querySelector('.ly-line[data-i="'+i+'"]');if(el)el.scrollIntoView({block:'center',behavior:'smooth'});}}

audio.addEventListener('timeupdate',()=>{const t=audio.currentTime,d=audio.duration||0,p=d?t/d*100:0;
  $('scr-fill').style.width=p+'%';$('p-fill').style.width=p+'%';$('p-dot').style.left=p+'%';
  $('scr-cur').textContent=fmt(t);$('scr-rem').textContent='-'+fmt(d-t);$('p-cur').textContent=fmt(t);$('p-dur').textContent=fmt(d);updLyric(t);});
audio.addEventListener('play',()=>{$('c-main-ic').innerHTML='<path d="M7 4h3v16H7zM14 4h3v16h-3z"/>';$('mini-play').innerHTML='<svg viewBox="0 0 24 24"><path d="M7 4h3v16H7zM14 4h3v16h-3z"/></svg>';$('scr-pz').innerHTML='&#10074;&#10074;';$('mini').classList.add('playing');});
audio.addEventListener('pause',()=>{$('c-main-ic').innerHTML='<path d="M8 5v14l11-7z"/>';$('mini-play').innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';$('scr-pz').textContent='▶';$('mini').classList.remove('playing');});

function togglePlay(){if(!cur){collapse();showTab('search');return;}audio.paused?audio.play():audio.pause();}
$('c-main').onclick=togglePlay;$('w-play').onclick=togglePlay;$('mini-play').onclick=togglePlay;
$('mini').addEventListener('click',e=>{
  if(e.target.closest('.mp'))return;
  if(e.target.closest('.ml')){showQueue();return;}
  expand();
});
$('btn-heart').onclick=async()=>{
  if(!cur)return;
  const nowLiked=!$('btn-heart').classList.contains('liked');
  $('btn-heart').classList.toggle('liked',nowLiked);
  if(likedSet){if(nowLiked)likedSet.add(String(cur.id));else likedSet.delete(String(cur.id));}
  try{await fetch('/api/music/like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:cur.id,like:nowLiked})});}catch(e){}
};
$('c-list').onclick=()=>{showQueue();};
// 上一首/下一首(iPod轮 + 底部控件)
$('c-prev').onclick=playPrev;$('c-next').onclick=playNext;
$('w-prev').onclick=playPrev;$('w-next').onclick=playNext;
// 循环模式切换
$('c-mode').onclick=()=>{
  loopMode=(loopMode+1)%3;
  const ics=['<path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/>',
    '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/><text x="12" y="15" font-size="8" fill="currentColor" stroke="none" text-anchor="middle">1</text>',
    '<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>'];
  $('c-mode').querySelector('svg').innerHTML=ics[loopMode];
  toast(['列表循环','单曲循环','随机播放'][loopMode]);
};
// 放完自动下一首
audio.addEventListener('ended',()=>{playNext();});
$('w-center').onclick=()=>{collapse();showTab('search');};
$('w-menu').onclick=()=>toggleLyric();
function toggleLyric(){lyView=!lyView;$('lyric-view').classList.toggle('on',lyView);if(lyView){lastLy=-1;updLyric(audio.currentTime);}}
$('ipod-tap').addEventListener('click',e=>{if(e.target.closest('.wheel'))return;if(e.target.closest('.screen'))toggleLyric();});
$('lyric-view').addEventListener('click',()=>toggleLyric());
$('p-bar').addEventListener('click',e=>{if(!audio.duration)return;const r=$('p-bar').getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;});

// ── 头像:跟随app头像(嵌入时从父窗口读,否则localStorage)──
function loadAvatars(){
  let uav='',aav='';
  try{uav=window.parent?.localStorage?.getItem('chat-avatar-user')||'';aav=window.parent?.localStorage?.getItem('chat-avatar-ai')||'';}catch(e){}
  if(!uav)uav=localStorage.getItem('chat-avatar-user')||'';
  if(!aav)aav=localStorage.getItem('chat-avatar-ai')||'';
  if(uav)$('tg-user').style.backgroundImage='url('+uav+')';
  if(aav)$('tg-ai').style.backgroundImage='url('+aav+')';
  window._uav=uav;window._aav=aav;
}

// 单人/一起听 切换
// 单人/一起听 + 互相邀请
function enterTogether(){
  $('play-page').classList.add('listening');
}
function exitTogether(){
  $('play-page').classList.remove('listening');
  setMode(false);
  fetch('/api/music/listen/end',{method:'POST'}).catch(()=>{});
}
async function toggleTogether(){
  const on=$('play-page').classList.contains('listening');
  if(on){exitTogether();}
  else{
    // 你发起一起听:进模式 + 邀请AI + 标记active
    enterTogether();
    try{
      await fetch('/api/music/listen/accept',{method:'POST'}); // 标记一起听active
      await fetch('/api/music/listen/invite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:'user',name:'慧'})});
      toast('已开始一起听');
    }catch(e){}
  }
}
$('btn-together').onclick=toggleTogether;

// 收到AI邀请 → 弹窗
let inviteShown=false;
async function pollInvite(){
  try{
    const r=await fetch('/api/music/listen/state').then(r=>r.json());
    if(r.invite&&r.invite.from==='ai'&&!inviteShown&&!$('play-page').classList.contains('listening')){
      inviteShown=true;
      $('invite-tx').textContent=(r.invite.name||'Claude')+' 邀请你一起听';
      $('invite-mask').classList.add('show');
    }
  }catch(e){}
}
setInterval(pollInvite,8000);pollInvite();
$('inv-yes').onclick=async()=>{
  $('invite-mask').classList.remove('show');inviteShown=false;
  enterTogether();
  await fetch('/api/music/listen/accept',{method:'POST'}).catch(()=>{});
  toast('开始一起听');
};
$('inv-no').onclick=async()=>{
  $('invite-mask').classList.remove('show');
  await fetch('/api/music/listen/end',{method:'POST'}).catch(()=>{});
};

loadAvatars();

// ── 一起听累计时长 ──
function tgMins(){return parseInt(localStorage.getItem('together-mins')||'0',10);}
function renderTip(){
  const m=tgMins(),h=Math.floor(m/60),mm=m%60;
  const dur=h?(h+' 小时 '+mm+' 分钟'):(mm+' 分钟');
  $('tg-tip').textContent='TA就在你身边，一起听了 '+dur;
}
renderTip();
setInterval(()=>{
  // 只在一起听模式 + 正在放歌 才累计
  if($('play-page').classList.contains('listening')&&!audio.paused&&audio.currentTime>0){
    localStorage.setItem('together-mins',tgMins()+1);renderTip();
  }
},60000);

// ── 音乐/评论切换 ──
let chatMode=false;
function setMode(chat){
  chatMode=chat;
  $('chat-view').classList.toggle('on',chat);
  $('mc-music').classList.toggle('on',!chat);
  $('mc-chat').classList.toggle('on',chat);
  // 评论模式隐藏iPod和控件
  document.querySelector('.ipod-box').style.display=chat?'none':'flex';
  document.querySelector('.below').style.display=chat?'none':'block';
  if(chat){loadChatHistory();setTimeout(()=>{const m=$('cv-msgs');m.scrollTop=m.scrollHeight;},100);}
}
$('mc-music').onclick=()=>setMode(false);
$('mc-chat').onclick=()=>setMode(true);
// 播放页那个💬也切到聊天
document.querySelector('.b-cmt').onclick=()=>setMode(true);

// ── 聊天 ──
function addMsg(text,me){
  const row=document.createElement('div');row.className='cv-row'+(me?' me':'');
  const av=me?(window._uav||''):(window._aav||'');
  row.innerHTML='<div class="cv-av" style="background-image:url('+av+')"></div><div class="cv-bubble">'+text.replace(/</g,'&lt;')+'</div>';
  $('cv-msgs').appendChild(row);
  const m=$('cv-msgs');m.scrollTop=m.scrollHeight;
}
async function loadChatHistory(){
  if($('cv-msgs')._loaded)return;
  try{
    const r=await fetch('/api/music/chat/history').then(r=>r.json());
    if(r.ok&&r.messages){$('cv-msgs').innerHTML='';r.messages.forEach(m=>addMsg(m.text,m.me));}
  }catch(e){}
  $('cv-msgs')._loaded=true;
}
async function sendChat(){
  const t=$('cv-text').value.trim();if(!t)return;
  $('cv-text').value='';
  addMsg(t,true);
  // 存 + 触发凛回复(走app聊天后端)
  const ctx=cur?('（正在一起听：'+cur.name+' - '+cur.artist+'）'):'';
  try{
    const r=await fetch('/api/music/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:t,song:cur?{name:cur.name,artist:cur.artist}:null})}).then(r=>r.json());
    if(r.ok&&r.reply)addMsg(r.reply,false);
  }catch(e){}
}
$('cv-send').onclick=sendChat;
$('cv-text').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});

// 轮询收新消息(AI通过MCP push的,一起听时)
let chatLastTs=0;
async function pollChat(){
  if(!$('play-page').classList.contains('listening'))return;
  try{
    const r=await fetch('/api/music/chat/history').then(r=>r.json());
    if(r.ok&&r.messages){
      const newMsgs=r.messages.filter(m=>!m.me&&m.ts>chatLastTs);
      if(chatLastTs>0&&newMsgs.length&&$('cv-msgs')._loaded){
        newMsgs.forEach(m=>addMsg(m.text,false));
      }
      if(r.messages.length)chatLastTs=Math.max(...r.messages.map(m=>m.ts||0));
    }
  }catch(e){}
}
setInterval(pollChat,6000);

let lastSeq=0;
setInterval(async()=>{try{const r=await fetch('/api/music/remote').then(r=>r.json());const c=r.command;
  if(c&&c.seq&&c.seq!==lastSeq){lastSeq=c.seq;
    if(c.action==='play'&&c.id){playSong({id:c.id,name:c.name,artist:c.artist,cover:c.cover});expand();}
    else if(c.action==='stop'||c.action==='pause')audio.pause();
    else if(c.action==='resume')audio.play().catch(()=>{});
    else if(c.action==='next')playNext();
    else if(c.action==='prev')playPrev();
  }}catch(e){}},5000);

showTab('mine');

</script>
