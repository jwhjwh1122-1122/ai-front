<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>游戏房</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fdfafb; --dot:#f6dfe7;
  --line:#7e7183; --line2:#cbb9c1; --ink:#6f6270; --ink2:#a99aa4;
  --pink:#f3b9cd; --pink2:#f9dbe6; --pink3:#fdeef3;
  --blue:#bcd7f2; --blue2:#dde9f7; --blue3:#f0f5fc;
  --mint:#cfe8da; --star:#f6d98b;
}
html,body{min-height:100%}
body{background:var(--bg);
  background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:15px 15px;
  font-family:"DotGothic16",-apple-system,"PingFang SC",monospace;color:var(--ink);overflow-x:hidden}
img,canvas{image-rendering:pixelated;display:block}
.px{position:absolute}
.pic{position:relative}

/* ===== 顶上：粉蓝条纹雨棚 + 蕾丝 ===== */
.awning{height:92px;position:relative;
  background:repeating-linear-gradient(90deg,var(--pink2) 0 18px,#fff 18px 36px,var(--blue2) 36px 54px,#fff 54px 72px)}
.awning:after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;
  background:radial-gradient(circle at 50% 0,#fff 0 6px,var(--line2) 6px 7.5px,transparent 8px) 0 0/16px 10px repeat-x}
.lace-line{height:6px;margin-top:10px;border-top:2px solid var(--line2);
  background:radial-gradient(circle,var(--line2) 1.4px,transparent 1.6px) 0 1px/8px 6px repeat-x}
.plate{position:absolute;left:50%;top:30px;transform:translateX(-50%);z-index:3;
  display:flex;align-items:center;gap:6px}
.plate .bd{background:#fff;border:2px solid var(--line);outline:2px solid #fff;
  box-shadow:0 0 0 4px var(--line2);padding:6px 14px 5px;text-align:center;white-space:nowrap}
.plate h1{font-size:19px;letter-spacing:5px;color:#fff;font-weight:normal;
  text-shadow:2px 0 0 var(--pink),-2px 0 0 var(--pink),0 2px 0 var(--pink),0 -2px 0 var(--pink),2px 2px 0 var(--pink),-2px 2px 0 var(--pink),2px -2px 0 var(--pink),-2px -2px 0 var(--pink)}
.plate h1 i{font-style:normal;font-size:11px;color:var(--blue);text-shadow:none;vertical-align:3px;margin:0 2px}
.plate .sub{font-size:8px;letter-spacing:3px;color:var(--ink2);margin-top:2px}
.plate img.wg{width:40px}
.plate .bd{position:relative}
.plate .peek{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:46px;z-index:-1}

.paws{display:flex;justify-content:center;align-items:center;gap:8px;margin:12px 0 2px}
.paws img{width:96px}
.paws i{width:4px;height:4px;background:var(--pink);box-shadow:4px 4px var(--pink),-4px 4px var(--pink),0 8px var(--pink)}
/* ===== 大框 ===== */
.wrap{max-width:560px;margin:0 auto;padding:16px 12px 30px;position:relative}
.frame{position:relative;background:rgba(255,255,255,.72);border:2px solid var(--line2);
  outline:4px solid rgba(255,255,255,.8);padding:20px 12px 16px;margin-top:6px}
.frame .cn{position:absolute;width:12px;height:12px;border-color:var(--line2);border-style:solid;border-width:0}
.frame .cn.a{left:6px;top:6px;border-left-width:2px;border-top-width:2px}
.frame .cn.b{right:6px;top:6px;border-right-width:2px;border-top-width:2px}
.frame .cn.c{left:6px;bottom:6px;border-left-width:2px;border-bottom-width:2px}
.frame .cn.d{right:6px;bottom:6px;border-right-width:2px;border-bottom-width:2px}

.topbar{display:flex;align-items:center;gap:8px;margin:0 2px 18px}
.topbar .heads{display:flex;align-items:flex-end;gap:2px}
.topbar .heads img{width:36px}
.coin{display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:1.5px;color:var(--ink2);
  background:#fff;border:2px solid var(--line2);padding:3px 7px}
.coin img{width:15px}
.coin img.hb{width:36px}
.topbar .right{margin-left:auto}

/* ===== 每台机子 = 一扇带猫耳的小窗 ===== */
.wall{display:grid;grid-template-columns:1fr 1fr;gap:50px 26px;margin-top:34px;padding:0 6px}
.win{position:relative;cursor:pointer;transition:transform .1s;margin-top:10px}
.win:active{transform:translateY(2px)}
.win .ear{position:absolute;top:-14px;z-index:1}
.win .ear.l{left:10px}
.win .ear.r{right:10px}
.win .shell{position:relative;z-index:2;border:2px solid var(--line);padding-top:0;
  background:var(--c2) radial-gradient(#fff 1.2px,transparent 1.4px) 0 0/7px 7px;box-shadow:3px 3px 0 var(--c1)}
.win .inner{position:relative;margin:0 7px;border:2px solid var(--line);background:#fff;overflow:hidden;
  outline:2px solid #fff}
.win .bow{position:absolute;left:50%;top:-21px;transform:translateX(-50%);width:36px;z-index:6}
.win .stk{position:absolute;left:-9px;bottom:16px;width:20px;z-index:6;transform:rotate(-12deg)}
.win .twk{position:absolute;right:-5px;top:12px;z-index:6}
.swag{position:absolute;left:10%;right:10%;top:-12px;height:28px;z-index:4;
  border-bottom:4px dotted var(--line2);border-radius:0 0 50% 50%}
.swag img{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);width:13px}
.rib{position:absolute;right:-20px;bottom:12px;width:66px;height:10px;transform:rotate(-45deg);z-index:4;
  background:repeating-linear-gradient(90deg,var(--c1) 0 5px,#fff 5px 8px);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.tb{height:19px;display:flex;align-items:center;gap:3px;padding:0 4px;
  background:linear-gradient(90deg,var(--c1),var(--c2));border-bottom:2px solid var(--line)}
.tb .no{font-size:8px;line-height:9px;width:11px;height:11px;text-align:center;background:#fff;
  border:1px solid var(--line);color:var(--line)}
.tb .ttl{font-size:9px;letter-spacing:1px;color:#fff;margin-left:3px;
  text-shadow:1px 0 0 var(--line),-1px 0 0 var(--line),0 1px 0 var(--line),0 -1px 0 var(--line)}
.tb .bt{margin-left:auto;display:flex;gap:2px}
.tb .bt i{width:9px;height:9px;background:#fff;border:1px solid var(--line);font-style:normal;
  font-size:7px;line-height:7px;text-align:center;color:var(--line)}
.lace{position:relative;z-index:5;height:7px;background:radial-gradient(circle at 50% 0,#fff 0 4px,var(--line2) 4px 5px,transparent 5.5px) 0 0/10px 7px repeat-x}
.view{position:relative;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;
  background:linear-gradient(170deg,var(--c3),#fff 55%,var(--c3))}
.view:before{content:"";position:absolute;inset:0;opacity:.55;
  background:radial-gradient(var(--dot) 1.2px,transparent 1.4px) 0 0/9px 9px}
.view .cat{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:50px;z-index:2}
.view .art{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);z-index:3}
.view img.art{width:44px}
.view .pearl{position:absolute;right:-6px;top:6px;width:58px;height:5px;transform:rotate(40deg);transform-origin:right;
  background:radial-gradient(circle,#fff 0 1.6px,var(--line2) 1.7px 2.4px,transparent 2.6px) 0 0/6px 5px repeat-x;z-index:1}
.view .pearl.p2{right:auto;left:-6px;transform:rotate(-38deg);transform-origin:left;width:40px}
.view .ribbon{position:absolute;right:-18px;bottom:8px;width:70px;height:9px;transform:rotate(-45deg);z-index:1;
  background:repeating-linear-gradient(90deg,var(--c1) 0 6px,#fff 6px 8px);border:1px solid var(--line2)}
.view img.ic{position:absolute;left:5px;top:5px;width:20px;z-index:3}
.view .xx{position:absolute;right:6px;top:5px;font-size:8px;line-height:8px;color:var(--line2);letter-spacing:1px;z-index:3}
.view .nm{position:relative;z-index:2;font-size:15px;letter-spacing:3px;color:#fff;
  text-shadow:2px 0 0 var(--line),-2px 0 0 var(--line),0 2px 0 var(--line),0 -2px 0 var(--line),2px 2px 0 var(--line),-2px 2px 0 var(--line),2px -2px 0 var(--line),-2px -2px 0 var(--line),3px 4px 0 var(--c1)}
.view .cap{position:relative;z-index:2;font-size:8px;letter-spacing:1px;color:var(--ink2)}
.win.on .nm{animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.5}}
.win.on .shell{box-shadow:3px 3px 0 var(--line)}
.win.on .view{background:linear-gradient(170deg,var(--c2),#fff 55%,var(--c2))}
.win.on .cat{animation:hop .5s steps(2,end) infinite}
@keyframes hop{50%{transform:translate(-50%,-4px)}}
.win .sel{display:none;position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:22px;z-index:4;
  animation:hop2 .6s steps(2,end) infinite}
.win.on .bow{animation:hop .5s steps(2,end) infinite}
.win.on .shell{box-shadow:3px 3px 0 var(--line)}
.win .st{position:absolute;z-index:6;pointer-events:none}
.win.on .st.fig{animation:hop2 .5s steps(2,end) infinite}
@keyframes hop2{50%{margin-top:-4px}}
@keyframes hop2{50%{top:-34px}}
.win .foot2{display:flex;align-items:center;gap:4px;padding:5px 6px 5px}
.win .foot2 .lv{font-size:9px;line-height:9px;color:var(--pink);letter-spacing:-1px;
  text-shadow:1px 0 0 var(--line),-1px 0 0 var(--line),0 1px 0 var(--line),0 -1px 0 var(--line)}
.win .foot2 .by{background:#fff;border:1px solid var(--line2);padding:0 4px}
.win .foot2 .by{font-size:8px;color:var(--ink2);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .foot2 .tag{margin-left:auto;font-size:8px;padding:0 4px;border:1px solid var(--line);color:var(--line);background:#fff;white-space:nowrap}
.win.hide{display:none}

/* 星星 */
.star{position:absolute;width:3px;height:3px;background:var(--star);z-index:5;pointer-events:none;
  box-shadow:3px 0 var(--star),-3px 0 var(--star),0 3px var(--star),0 -3px var(--star),0 0 0 1px rgba(255,255,255,.6);
  animation:tw 1.8s steps(2,end) infinite}
.star.s{transform:scale(.7)}
@keyframes tw{50%{opacity:.25}}

/* ===== 地板：也是一扇窗 ===== */
.floorwin{margin-top:30px}
.floorwin .view{height:156px;background:linear-gradient(180deg,var(--blue2),var(--blue3) 45%,#fff 75%)}
.cloud{position:absolute;top:12px;width:70px;z-index:1;opacity:.95;animation:drift 22s linear infinite}
@keyframes drift{0%{left:-80px}100%{left:110%}}
.moon{position:absolute;right:14px;top:10px;width:18px;z-index:1}
.ipod{position:absolute;right:8px;bottom:6px;width:52px;z-index:2}
.horse{position:absolute;right:66px;bottom:8px;width:44px;z-index:2}
.zz{position:absolute;width:22px;z-index:6;opacity:0;transition:opacity .4s}
.zz.on{opacity:1;animation:zzz 1.4s steps(3,end) infinite}
@keyframes zzz{50%{transform:translateY(-4px)}}
.react{position:absolute;width:34px;z-index:7;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
.react.on{opacity:1;transform:translateY(0)}
.rug{position:absolute;left:0;right:0;bottom:0;height:30px;border-top:2px solid var(--line);z-index:1}
.drop{position:absolute;width:14px;z-index:1;opacity:.85;animation:fall 3.4s linear infinite}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}15%{opacity:.9}100%{transform:translateY(118px);opacity:0}}
.sprite{position:absolute;bottom:20px;z-index:4;transition:left .55s steps(7,end)}
.sprite.walk{animation:bob .3s steps(2,end) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.leash{position:absolute;bottom:56px;height:3px;background:var(--pink);z-index:3;
  transition:left .55s steps(7,end),width .55s steps(7,end)}
.say{position:absolute;z-index:5;transition:left .55s steps(7,end)}
.say img{width:54px}

/* ===== 说明板 ===== */
.card{margin-top:44px}
.card .body{padding:12px 12px 12px;background:linear-gradient(175deg,var(--pink3),#fff 40%)}
.card h2{font-size:13px;letter-spacing:2px;font-weight:normal;display:flex;align-items:center;gap:4px}
.card h2 img{height:26px}
.card .wand{position:absolute;right:10px;top:34px;width:20px;transform:rotate(18deg);transform-origin:bottom center;animation:wv 1.6s steps(2,end) infinite}
@keyframes wv{50%{transform:rotate(-6deg)}}
.card .shell{position:relative}
.card .cdonut{position:absolute;left:-14px;bottom:-14px;width:58px;z-index:7}
.card .ccute{position:absolute;right:-8px;top:-30px;width:56px;z-index:7}
.card .by{font-size:9px;color:var(--ink2);letter-spacing:1px;margin:3px 0 8px}
.card p{font-size:11px;line-height:2;letter-spacing:.5px}
.card .why{display:flex;gap:7px;margin-top:9px;padding-top:9px;border-top:2px dashed var(--line2);
  font-size:11px;line-height:2;color:#cf7fa0}
.card .why img{width:22px;flex-shrink:0;margin-top:5px}
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;
  background:linear-gradient(90deg,var(--pink2),var(--blue2));border:2px solid var(--line);box-shadow:3px 3px 0 var(--line2);
  padding:8px;font-family:inherit;font-size:12px;letter-spacing:5px;color:var(--ink);cursor:pointer}
.go img{width:22px}
.go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line2)}

/* ===== 底下一排小东西：能按的 ===== */
.dock{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:26px;padding:0 2px}
.dk{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:8px;letter-spacing:1px;color:var(--ink2)}
.dk .pic{transition:transform .1s}
.dk.on{color:#cf7fa0}
.dk.on .pic{transform:translateY(-3px)}
.chip{display:flex;gap:3px}
.chip b{font-weight:normal;font-size:10px;width:20px;height:20px;line-height:16px;text-align:center;
  border:2px solid var(--line);background:#fff;cursor:pointer}
.chip b.on{background:var(--pink2)}
.chip b.on.bl{background:var(--blue2)}
.stamp{position:relative;border:2px dashed var(--line2);padding:5px 7px;background:#fff;text-align:center}
.stamp img{width:30px;margin:0 auto}
.stamp:before,.stamp:after{content:"";position:absolute;width:6px;height:6px;background:#fff;border:2px solid var(--line)}
.stamp:before{left:-5px;top:-5px}.stamp:after{right:-5px;bottom:-5px}
.foot img{width:30px;margin:0 auto 4px}
.foot{margin-top:22px;font-size:9px;line-height:2.2;letter-spacing:1px;color:var(--ink2);text-align:center}
/* ===== 软版底：把像素味收掉，留结构 ===== */
body{font-family:-apple-system,"PingFang SC","Hiragino Maru Gothic ProN","Yuanti SC",sans-serif}
img{image-rendering:auto}
.win .ear,.awning,.lace-line,.paws{display:none}
.win .st{filter:drop-shadow(0 1px 0 rgba(255,255,255,.6))}
.deco{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:0}
.deco img,.deco i,.deco b,.deco span{position:absolute}
.wrap,.hdr{position:relative;z-index:1}
.hdr{position:relative}
.view .nm{font-weight:bold}
body{position:relative}
.tb .bt{display:none!important}

@keyframes fl{50%{transform:translateY(-6px)}}

 {n:"斗地主",by:"凛 做",tag:"自家",t:BLUE,art:"cards",fig:["kt_bear",50,-30],food:["kt_ycup",34],small:"paw_w",cap:"8 → A + 王",

 {n:"翻牌配对",by:"凛 做",tag:"自家",t:PINK,art:"@heart_plaid",fig:["kt_ice",38,-42],food:["berry_g",28],small:"hearts_s",cap:"翻到哪天",

];
var wall=document.getElementById("wall");
GAMES.forEach(function(g,i){
  var d=document.createElement("div"); d.className="win"; d.dataset.tag=g.tag;
  d.style.setProperty("--c1",g.t.c1);d.style.setProperty("--c2",g.t.c2);d.style.setProperty("--c3",g.t.c3);
  var O=i%2?"right":"left", I=i%2?"left":"right";

  var sts=(TH.st[i]||[]).map(function(a){return S(a[0],a[1],a[2].replace(/OUT/g,O).replace(/IN/g,I),a[3])}).join("");

    (TH.below?TH.below(g,i):'')+'<div class="foot2"><span class="lv">'+(TH.lv||'♥♥♥')+'</span><span class="by">'+g.by+'</span><span class="tag">'+g.tag+'</span></div></div>';

(function(){

/* 地板上走路 */
var floor=document.getElementById("floor"), leash=document.getElementById("leash"),
    say1=document.getElementById("say1"), say2=document.getElementById("say2"), cur=-1, lead="hui",
    react=document.getElementById("react"), zz=document.getElementById("zz"), rt=0, idle=0;
function pop(n){
  react.src=PX[n]; react.classList.add("on"); clearTimeout(rt);
  rt=setTimeout(function(){react.classList.remove("on")},1600);
  zz.classList.remove("on"); clearTimeout(idle);
  idle=setTimeout(function(){zz.classList.add("on")},9000);
}
function place(x){
  var w=floor.clientWidth, hx=Math.max(10,Math.min(w-118,x)), a=hx, b=hx+56;
  if(lead==="lin"){a=hx+56;b=hx;}
  hui.style.left=a+"px"; lin.style.left=b+"px";
  leash.style.left=(hx+46)+"px"; leash.style.width="22px";
  leash.style.background=lead==="hui"?"var(--pink)":"var(--blue)";
  say1.style.left=(a-14)+"px"; say1.style.top="6px";
  say2.style.left=(b-6)+"px"; say2.style.top="30px";
  react.style.left=(b+50)+"px"; react.style.top="44px";
  zz.style.left=(a+44)+"px"; zz.style.top="54px";
  place.x=x;
}
place(34);
function walk(){
  hui.classList.add("walk"); lin.classList.add("walk");
  setTimeout(function(){hui.classList.remove("walk");lin.classList.remove("walk")},560);
}
function pick(i,el){
  document.querySelectorAll("#wall .win").forEach(function(c){c.classList.remove("on")});
  el.classList.add("on"); cur=i;
  var g=GAMES[i];
  document.getElementById("c-t").textContent=g.n;
  document.getElementById("c-b").textContent=g.by+" · "+(g.tag==="自家"?"我们自己做的":"游戏厅接来的");
  document.getElementById("c-p").textContent=g.p;
  document.getElementById("c-w").textContent=g.w;
  var w=floor.clientWidth, vis=[].slice.call(document.querySelectorAll("#wall .win:not(.hide)")), k=vis.indexOf(el);
  place(16+(k%2)*(w*0.44));
  walk(); pop("cat_happy");
}
var go=document.getElementById("go"), H='<img src="'+PX.paw_w+'" alt="">';
go.onclick=function(){
  if(cur<0){go.innerHTML=H+"还 没 选";pop("cat_cry");}else{go.innerHTML=H+"开 ！";pop("cat_love");}
  setTimeout(function(){go.innerHTML=H+"投 币"},900);
};

  };
});
idle=setTimeout(function(){zz.classList.add("on")},6000);
(function(){var B='<img class="bow" src="'+PX.bow_px+'">',P='<img class="pr" src="'+PX.paws_row+'">';
document.querySelectorAll("#wall .win .shell").forEach(function(s){var tb=s.querySelector(".tb"),f=s.querySelector(".foot2");
 tb.insertAdjacentHTML("beforeend",P);});
var cs=document.querySelector(".card .shell");if(cs){cs.querySelector(".tb").insertAdjacentHTML("beforeend",P);}
var cu=document.querySelector(".card .ccute");if(cu){cu.src=PX.kt_sleep;cu.insertAdjacentHTML("afterend",'<img class="czz" src="'+PX.zzz+'">');}
var cd=document.querySelector(".card .cdonut");if(cd){cd.src=PX.ipod;}
})();
(function(){var c=document.querySelectorAll(".topbar .coin, .coin");c.forEach(function(e){var t=[].slice.call(e.childNodes).filter(function(n){return n.nodeType===3&&n.textContent.trim()});
 t.forEach(function(n){if(n.textContent.indexOf("COIN")>-1)n.textContent="lin hui";else if(n.textContent.indexOf("在场")>-1)n.textContent="";});});})();

var CFG={hw:64,lw:62,span:126,rpad:112,
 extra:function(hx,L){var fb=document.querySelector(".bub.fb"),s2=document.querySelector(".s2");
  if(!L){fb.style.left=Math.max(0,hx-14)+"px";s2.style.left=(hx+8)+"px";s2.style.transform="rotate(-25deg)";}
  else{fb.style.left=(hx+96)+"px";s2.style.left=(hx+118)+"px";s2.style.transform="rotate(25deg)";}},
 pos:function(hx,L){if(!L)return {h:hx,l:hx+60,r:[0,0],z:[hx+96,60]};
  return {h:hx+62,l:hx,hf:1,lf:1,r:[0,0],z:[hx+2,60]};}};
function setS(el,src,w){el.innerHTML='<img src="'+src+'" style="width:'+w+'px">';el.style.width=w+"px";el.style.height="auto";}
setS(hui,PX.p_hui,CFG.hw);setS(lin,PX.p_lin,CFG.lw);
if(CFG.pix){hui.firstChild.style.imageRendering=lin.firstChild.style.imageRendering="pixelated";}
function place(x){
  if(!CFG)return;
  var w=floor.clientWidth, L=lead==="lin", hx=Math.max(8,Math.min(w-CFG.span-CFG.rpad,x));
  var o=CFG.pos(hx,L);
  hui.style.left=o.h+"px"; lin.style.left=o.l+"px";
  hui.firstChild.style.transform=o.hf?"scaleX(-1)":""; lin.firstChild.style.transform=o.lf?"scaleX(-1)":"";
  if(o.leash){leash.style.display="";leash.style.left=o.leash[0]+"px";leash.style.width=o.leash[1]+"px";leash.style.setProperty("bottom",o.leash[2]+"px","important");
    leash.style.background=L?"#9db4d6":"#f4a3b7";}else leash.style.display="none";
  if(CFG.extra)CFG.extra(hx,L);
  react.style.left=o.r[0]+"px"; react.style.top=o.r[1]+"px";
  zz.style.left=o.z[0]+"px"; zz.style.top=o.z[1]+"px";
  place.x=x;
}
place(place.x||16);

window.addEventListener("resize",function(){place(place.x||34)});
</script>
